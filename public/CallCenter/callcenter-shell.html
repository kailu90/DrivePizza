<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CallCenter — DrivePizza</title>
    <link rel="shortcut icon" href="../Imagenes/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../Estilos/styles.css">
    <!-- Prefetch de páginas frecuentes para navegación más rápida -->
    <link rel="prefetch" href="./callcenter.html">
    <link rel="prefetch" href="./historialPedidos.html">
    <link rel="prefetch" href="./clientesCall.html">
    <link rel="prefetch" href="./pedidosCallCenter.html">
    <link rel="prefetch" href="./adminBarrios.html">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        /* Wrapper div — no es replaced element, calcula width correctamente */
        #cc-wrap {
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
        }
        #cc-frame { width: 100%; height: 100%; border: none; display: block; }

        /* ── Banner nueva versión ── */
        #banner-nueva-version {
            display: none;
            position: fixed; top: 0; left: 0; right: 0;
            background: #1e40af; color: #fff;
            padding: 10px 20px;
            text-align: center;
            font-family: sans-serif; font-size: 14px;
            z-index: 99999;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        #banner-nueva-version button {
            margin-left: 16px;
            background: #fff; color: #1e40af;
            border: none; border-radius: 6px;
            padding: 4px 14px; font-size: 13px;
            font-weight: 600; cursor: pointer;
        }

        /* ── SIP panel ── */
        #sip-panel {
            display: none;
            position: fixed; bottom: 20px; right: 20px;
            background: #1e293b; color: #f1f5f9;
            border-radius: 14px; padding: 16px 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.55);
            z-index: 9999; min-width: 260px;
            font-family: sans-serif;
        }
        #sip-panel .sip-label {
            font-size: 11px; color: #94a3b8;
            letter-spacing: 1px; text-transform: uppercase;
            margin-bottom: 6px;
        }
        #sip-panel .sip-caller {
            font-size: 22px; font-weight: 700; margin-bottom: 4px;
        }
        #sip-panel .sip-timer {
            font-size: 13px; color: #94a3b8; margin-bottom: 12px;
        }
        #sip-sede {
            display: none;
            font-size: 11px; font-weight: 600;
            padding: 3px 10px; border-radius: 20px;
            margin-bottom: 10px; width: fit-content;
        }
        #sip-sede.sip-sede--bga { background: var(--color-bga-light); color: var(--color-bga); }
        #sip-sede.sip-sede--car { background: var(--color-ctg-light); color: var(--color-ctg); }
        #sip-panel .sip-btns { display: flex; gap: 8px; }
        #sip-panel .sip-btns button {
            flex: 1; padding: 10px 0; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: opacity 0.15s;
        }
        #sip-panel .sip-btns button:hover { opacity: 0.85; }
        #btn-sip-answer { background: #22c55e; color: #fff; }
        #btn-sip-reject,
        #btn-sip-hangup { background: #ef4444; color: #fff; }

        /* ── Overlay navegación ── */
        #nav-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #f4ecdf;
            z-index: 8000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: .5rem;
        }
        #nav-overlay.visible { display: flex; }
        .nav-logo {
            width: 88px; height: 88px;
            border-radius: 20px; object-fit: cover;
            animation: nav-pulse 1.2s ease-in-out infinite;
        }
        .nav-slogan {
            display: flex; flex-direction: column; align-items: center;
            font-family: 'Manrope', 'Arial Black', 'Helvetica Neue', sans-serif;
            font-size: 1.9rem; font-weight: 800;
            letter-spacing: .06em; text-transform: uppercase;
            line-height: 1;
        }
        .nav-slogan-left  { color: #284c22; animation: nav-slide-left  .4s .25s ease both; }
        .nav-slogan-right { color: #e67e22; animation: nav-slide-right .4s .45s ease both; }
        @keyframes nav-pulse      { 0%,100%{transform:scale(1);opacity:.9} 50%{transform:scale(1.07);opacity:1} }
        @keyframes nav-slide-left  { from{transform:translateX(-70px);opacity:0} to{transform:translateX(0);opacity:1} }
        @keyframes nav-slide-right { from{transform:translateX( 70px);opacity:0} to{transform:translateX(0);opacity:1} }

        /* ── WA Panel — debajo del header, empuja solo el workspace ── */
        #wa-panel {
            position: fixed;
            top: 100px; left: 0; bottom: 0;
            width: 420px;
            display: flex; flex-direction: column;
            overflow: hidden;
            background: var(--color-secundario, #fff);
            transform: translateX(-360px);
            transition: transform 260ms ease;
            z-index: 7500;
        }
        #wa-panel.expanded { transform: translateX(0); }
        @media (max-width: 768px) {
            #wa-panel { width: 100%; transform: translateX(-100%); top: 54px; }
        }

        #wa-panel .panel-header {
            width: 420px; height: 60px;
            display: flex; align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: var(--color-primario);
            color: var(--color-secundario);
            border-radius: 0 0 30px 0;
        }
        #wa-panel .panel-header__title {
            font-size: 1.6rem; font-weight: 700;
            letter-spacing: 0.5px; white-space: nowrap;
            flex: 1; padding-left: 16px;
        }
        #wa-panel .panel-header__icon {
            width: 60px; height: 60px; border-radius: 30px;
            flex-shrink: 0; display: flex; align-items: center;
            justify-content: center; position: relative;
            background: var(--color-primario);
            color: var(--color-secundario);
            border: none; outline: none; cursor: pointer;
            transition: background 0.15s;
        }
        #wa-panel .panel-header__icon:hover { background: var(--color-cuaternario); }
        #btn-wa-monitor {
            display: none;
            background: none; border: none; cursor: pointer;
            color: #94a3b8; padding: 6px; border-radius: 8px;
            transition: color .2s, background .2s;
        }
        #btn-wa-monitor:hover { color: #f1f5f9; background: rgba(255,255,255,0.08); }
        #wa-badge-hdr {
            position: absolute; top: 6px; right: 6px;
            background: #ef4444; color: #fff; font-size: 10px;
            font-weight: 700; border-radius: 8px; min-width: 16px;
            height: 16px; padding: 0 3px; display: none;
            align-items: center; justify-content: center;
            font-family: sans-serif; line-height: 1;
        }
        #wa-body {
            flex: 1; overflow: hidden; min-height: 0;
            display: flex; flex-direction: column;
        }
        /* Ocultar contenido cuando el panel está colapsado — igual que #panel-pbx.collapsed */
        #wa-panel:not(.expanded) #wa-body {
            display: none;
        }
    </style>
</head>
<body>

<div id="banner-nueva-version">
    🚀 Hay una nueva versión disponible.
    <button onclick="location.reload()">Recargar ahora</button>
</div>

<div id="cc-wrap"><iframe id="cc-frame" src="./callcenter.html"></iframe></div>
<audio id="sip-audio" autoplay></audio>
<div id="nav-overlay" class="visible">
    <img class="nav-logo" src="../Imagenes/Isotipo.png" alt="Drive Pizza">
    <div class="nav-slogan">
        <span class="nav-slogan-left">HECHA PARA</span>

    </div>
</div>

<!-- Panel llamada entrante / en curso -->

    <div id="sip-sede"></div>
    <div class="sip-caller" id="sip-caller-num"></div>

<!-- WA Panel (mismo diseño que panel PBX, lado izquierdo) -->
<div id="wa-panel">
    <div class="panel-header">
        <span class="panel-header__title">WhatsApp</span>
        <button id="btn-wa-monitor" title="WA Monitor" onclick="window.open('/CallCenter/waMonitor.html','_blank')">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2"/>

                <circle cx="12" cy="10" r="2" fill="currentColor" stroke="none"/>

        </button>
        <button class="panel-header__icon" id="wa-strip" title="WhatsApp">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
                <path d="M12 0C5.373 0 0 5.373 0 12c0 2.124.558 4.118 1.531 5.845L.057 23.448a.75.75 0 0 0 .92.921l5.684-1.481A11.945 11.945 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.907 0-3.686-.524-5.208-1.433l-.374-.222-3.876 1.009 1.028-3.758-.244-.389A9.956 9.956 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>

<!-- JsSIP (debe cargar antes del módulo) -->
<script src="../jssip.min.js"></script>

<script type="module">
    import { supabase } from '../Api/supabaseConfig.js';
    import { PBX_URL, WS_URL } from '../Api/config.js';

    // ── WA Panel toggle y visibilidad ─────────────────────────────────────────
    let _resetWaView    = null; // se asigna al importar waPanel.js
    let _destroyWaPanel = null; // se asigna al importar waPanel.js
    let _historialFrame = null; // iframe lazy para historialPedidos

    function _waOffset() {
        const panel = document.getElementById('wa-panel');
        if (panel.style.display === 'none') return 0;
        return panel.classList.contains('expanded') ? 420 : 60;
    }
    function _postWaOffset() {
        const offset = _waOffset();
        [document.getElementById('cc-frame'), _historialFrame]
            .filter(Boolean)
            .forEach(f => f.contentWindow?.postMessage({ type: 'wa-workspace-offset', offset }, '*'));
    }
    function _setWaVisible(show) {
        const panel = document.getElementById('wa-panel');
        if (!show) {
            panel.classList.remove('expanded');
            panel.style.display = 'none';
        } else {
            panel.style.display = '';
        }
        _postWaOffset();
    }
    // Oculto por defecto — callcenter.html (index) lo mantiene oculto
    _setWaVisible(false);

    document.getElementById('wa-strip').addEventListener('click', () => {
        const panel = document.getElementById('wa-panel');
        panel.classList.toggle('expanded');
        if (!panel.classList.contains('expanded')) _resetWaView?.();
        _postWaOffset();
    });

    document.addEventListener('wa:conteos', (e) => {
        const badge  = document.getElementById('wa-badge-hdr');
        const espera = e.detail?.en_espera || 0;
        badge.textContent   = espera;
        badge.style.display = espera > 0 ? 'flex' : 'none';
    });

    const ICE = [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
    ];

    // ── postMessage al iframe ─────────────────────────────────────────────────
    let _sipState = 'offline';
    window._sipState = 'offline'; // inicializado aquí — postToFrame lo actualiza en cada cambio
    function postToFrame(state, extra = {}) {
        _sipState = state;
        window._sipState = state;
        const msg = {
            type:      'sip-state',
            state,
            username:  window._usuarioCC?.username  || '',
            extension: window._usuarioCC?.extension || '',
            ...extra
        };
        [document.getElementById('cc-frame'), _historialFrame]
            .filter(Boolean)
            .forEach(f => f.contentWindow?.postMessage(msg, '*'));
    }
    function sipReconnect() {
        if (window._sipUA) {
            window._sipUA.register();
        }
    }
    // ── Overlay de navegación ─────────────────────────────────────────────────
    const _overlay = document.getElementById('nav-overlay');
    const MIN_OVERLAY_MS = 600;
    let _overlayShownAt = performance.now(); // cubre la primera carga
    let _overlayFallback = null;
    let _overlayHideTimer = null;
    function hideOverlay() {
        clearTimeout(_overlayFallback);
        clearTimeout(_overlayHideTimer);
        _overlayFallback = null;
        const elapsed = performance.now() - _overlayShownAt;
        const wait = Math.max(0, MIN_OVERLAY_MS - elapsed);
        _overlayHideTimer = setTimeout(() => {
            _overlayHideTimer = null;
            _overlay.classList.remove('visible');
        }, wait);
    }
    // Fallback inicial: cubre race condition en recarga (location.reload) donde el evento
    // load del iframe puede llegar tarde o nav-loading puede re-mostrar el overlay.
    // Si load llega antes de 3s, hideOverlay() cancela este timer. Si no, fuerza cierre.
    _overlayFallback = setTimeout(() => hideOverlay(), 3000);

    // _listenForFrameNav: adjunta pagehide al iframe para mostrar el overlay.
    // pagehide siempre dispara ANTES de que cargue la nueva página, eliminando
    // el race condition donde nav-loading (postMessage async) llegaba tarde y
    // re-mostraba el overlay después de que cc-frame.load ya lo había ocultado.
    function _listenForFrameNav(frame) {
        try {
            frame.contentWindow?.addEventListener('pagehide', () => {
                _setWaVisible(false);
                clearTimeout(_overlayHideTimer);
                _overlayHideTimer = null;
                _overlayShownAt = performance.now();
                _overlay.classList.add('visible');
                _overlay.querySelectorAll('.nav-slogan-left, .nav-slogan-right').forEach(el => {
                    el.style.animation = 'none';
                    el.offsetHeight;
                    el.style.animation = '';
                });
                clearTimeout(_overlayFallback);
                _overlayFallback = setTimeout(() => hideOverlay(), 3000);
            }, { once: true });
        } catch(e) {}
    }

    document.getElementById('cc-frame').addEventListener('load', () => {
        hideOverlay();
        _postWaOffset();
        _listenForFrameNav(document.getElementById('cc-frame'));
    });

    // Mensajes desde el iframe
    window.addEventListener('message', (e) => {
        if (e.data?.type === 'logout') {
            _destroyWaPanel?.();
            window.location.href = '../index.html';
            return;
        }
        if (e.data?.type === 'wa-visible') {
            _setWaVisible(e.data.show !== false);
        }
        if (e.data?.type === 'nav-switch') {
            _switchView(e.data.page);
            return;
        }
        // nav-loading: ya no muestra el overlay (lo hace pagehide, sin race condition)
        if (e.data?.type === 'frame-ready')       { postToFrame(_sipState); _postWaOffset(); }
        if (e.data?.type === 'sip-reconnect')     sipReconnect();
        if (e.data?.type === 'reactivacion-hecha') {
            if (_ws?.readyState === 1) _ws.send(JSON.stringify({ tipo: 'reactivacion', clienteId: e.data.clienteId || null }));
        }
        if (e.data?.type === 'sip-hangup')  { if (_session) _session.terminate(); hidePanel(); }
        if (e.data?.type === 'sip-answer') {
            if (!_session) return;
            const caller = _session.remote_identity.uri.user || 'Desconocido';
            _session.answer({ mediaConstraints: { audio: true, video: false }, pcConfig: { iceServers: ICE } });
            _session.connection.addEventListener('track', (e) => {
                document.getElementById('sip-audio').srcObject = e.streams[0];
            });
            showInCall(caller);
        }
        if (e.data?.type === 'sip-decline') { if (_session) _session.terminate(); hidePanel(); }
    });

    // ── Gestión de vistas (cc-frame / frame-historial) ───────────────────────
    function _switchView(target) {
        const ccFrame = document.getElementById('cc-frame');
        if (target === 'historial') {
            if (!_historialFrame) {
                // Primera vez — lazy load con overlay
                clearTimeout(_overlayHideTimer);
                _overlayHideTimer = null;
                _overlayShownAt = performance.now();
                _overlay.classList.add('visible');
                clearTimeout(_overlayFallback);
                _overlayFallback = setTimeout(() => hideOverlay(), 3000);

                _historialFrame = document.createElement('iframe');
                _historialFrame.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:block;';
                _historialFrame.addEventListener('load', () => {
                    hideOverlay();
                    _postWaOffset();
                    _historialFrame.contentWindow?.postMessage({ type: 'frame-visible' }, '*');
                    _listenForFrameNav(_historialFrame);
                });
                _historialFrame.src = './historialPedidos.html';
                document.getElementById('cc-wrap').appendChild(_historialFrame);
            } else {
                // Ya cargado — switch instantáneo
                _historialFrame.style.display = 'block';
                _historialFrame.contentWindow?.postMessage({ type: 'frame-visible' }, '*');
                _historialFrame.contentWindow?.postMessage({
                    type: 'sip-state', state: _sipState,
                    username: window._usuarioCC?.username || '',
                    extension: window._usuarioCC?.extension || ''
                }, '*');
            }
            ccFrame.style.display = 'none';
            _postWaOffset();
        } else {
            // Volver a pedidos
            if (_historialFrame) _historialFrame.style.display = 'none';
            ccFrame.style.display = 'block';
            ccFrame.contentWindow?.postMessage({ type: 'frame-visible' }, '*');
            _postWaOffset();
        }
    }

    // ── Auth + usuario ────────────────────────────────────────────────────────
    window._usuarioCCPromise = (async () => {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { window.location.href = '../index.html'; return; }
        try {
            const { data, error } = await supabase.from('usuarios').select('*').eq('id', user.id).single();
            if (error || !data) { window.location.href = '../index.html'; return; }
            const ROLES_CC = ['callcenter', 'callcenter-admin', 'admin'];
            if (!ROLES_CC.includes(data.rol)) { window.location.href = '../index.html'; return; }
            // Sincronizar ciudad desde perfil — una vez por sesión, antes de que los iframes la lean
            localStorage.setItem('cc_ciudad', (data.ciudad || 'bucaramanga').toLowerCase());
            window._usuarioCC = {
                uid:         user.id,
                email:       user.email,
                username:    data.username    || user.email,
                sede:        data.sede        || '',
                rol:         data.rol         || '',
                ciudad:      (data.ciudad     || 'bucaramanga').toLowerCase(),
                extension:   data.extension   || null,
                sipPassword: data.sip_password || null
            };
            // Mostrar botón monitor solo para admin/callcenter-admin
            if (['admin', 'callcenter-admin'].includes(data.rol))
                document.getElementById('btn-wa-monitor').style.display = 'flex';
            // Inicializar WA panel en el drawer persistente
            const { initWaPanel, resetWaView, destroyWaPanel } = await import('./waPanel.js');
            _resetWaView    = resetWaView;
            _destroyWaPanel = destroyWaPanel;
            initWaPanel('wa-body', { rol: data.rol || '', asesor: data.username || user.email });
            if (data.extension) initSIP(data.extension, data.sip_password || '');
            return window._usuarioCC;
        } catch (err) {
            console.error('[shell] Error cargando usuario:', err);
        } finally {
            document.body.classList.add('loaded');
        }
    })();

    // ── Desconexión al cerrar el navegador ───────────────────────────────────
    window.addEventListener('pagehide', () => {
        _destroyWaPanel?.();
        const u = window._usuarioCC;
        if (!u?.extension) return;
        const body = JSON.stringify({ extension: u.extension, username: u.username || '' });
        navigator.sendBeacon(`${PBX_URL}/pbx/queue/disconnect`, new Blob([body], { type: 'application/json' }));
    });

    // ── Ringtone (Web Audio API) ──────────────────────────────────────────────
    let _ringCtx      = null;
    let _ringInterval = null;

    // Desbloquear AudioContext en el primer click (política autoplay del browser)
    document.addEventListener('click', () => {
        if (!_ringCtx) _ringCtx = new AudioContext();
        else if (_ringCtx.state === 'suspended') _ringCtx.resume();
    }, { once: true });

    function startRing() {
        if (_ringInterval) return;
        if (!_ringCtx) _ringCtx = new AudioContext();
        if (_ringCtx.state === 'suspended') _ringCtx.resume();

        // Tremolo: triangle 700Hz con LFO que oscila el gain ~20Hz — timbre antiguo
        const osc  = _ringCtx.createOscillator();
        const lfo  = _ringCtx.createOscillator();
        const gain = _ringCtx.createGain();
        const lfoGain = _ringCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.value = 700;

        lfo.type = 'sine';
        lfo.frequency.value = 20;   // velocidad del tremolo
        lfoGain.gain.value = 0.4;   // profundidad del tremolo

        lfo.connect(lfoGain);
        lfoGain.connect(gain.gain);
        gain.gain.value = 0.4;

        osc.connect(gain);
        gain.connect(_ringCtx.destination);

        osc.start();
        lfo.start();

        // Guardar referencias para poder parar
        _ringInterval = { _osc: osc, _lfo: lfo };
    }

    function stopRing() {
        if (!_ringInterval) return;
        if (typeof _ringInterval === 'object') {
            try { _ringInterval._osc.stop(); } catch(e) {}
            try { _ringInterval._lfo.stop(); } catch(e) {}
        } else {
            clearInterval(_ringInterval);
        }
        _ringInterval = null;
    }

    // ── Referencias UI ────────────────────────────────────────────────────────
    const panel      = document.getElementById('sip-panel');
    const panelLabel = document.getElementById('sip-panel-label');
    const callerNum  = document.getElementById('sip-caller-num');
    const timerEl    = document.getElementById('sip-timer');
    const btnsIn     = document.getElementById('sip-btns-incoming');
    const btnsCall   = document.getElementById('sip-btns-incall');

    const IVR_SEDE = {
        '801': 'BGA-Cabecera', '802': 'BGA-Cañaveral', '803': 'BGA-Acrópolis',
        '804': 'BGA-Piedecuesta', '805': 'BGA-Megamall', '806': 'BGA-Único',
        '811': 'CAR-El Prado', '812': 'CAR-CC Nuestro',
    };
    let _pendingSedeSIP = null;   // { numero, sede } recibido por WS antes de que suene
    const sedeEl        = document.getElementById('sip-sede');

    function _mostrarSede(callerNumber) {
        const queue  = (_pendingSedeSIP?.numero === callerNumber) ? _pendingSedeSIP.sede : null;
        const nombre = queue ? IVR_SEDE[queue] : null;
        if (nombre) {
            sedeEl.textContent = nombre;
            sedeEl.className   = ['811','812'].includes(queue) ? 'sip-sede--car' : 'sip-sede--bga';
            sedeEl.style.display = 'block';
        } else { sedeEl.style.display = 'none'; }
    }

    let _session       = null;
    let _timerInterval = null;

    // ── Init JsSIP ────────────────────────────────────────────────────────────
    function initSIP(extension, password) {
        const ua = new JsSIP.UA({
            sockets:                          [new JsSIP.WebSocketInterface('wss://pbx.everest-central.com/ws')],
            uri:                              `sip:${extension}@pbx.everest-central.com`,
            password,
            register:                         true,
            register_expires:                 300,
            connection_recovery_min_interval: 2,
            connection_recovery_max_interval: 30,
        });

        window._sipUA = ua;

        ua.on('registered', () => {
            postToFrame('registered');
            // Conectar automáticamente al IVR al registrarse
            fetch(`${PBX_URL}/pbx/queue/connect`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ extension, username: window._usuarioCC?.username || '' })
            }).catch(() => {});
        });

        ua.on('unregistered', () => {
            postToFrame('offline');
            // Reintentar registro si no fue un logout intencional
            if (ua.isConnected()) {
                setTimeout(() => { try { ua.register(); } catch(e) {} }, 3000);
            }
        });

        ua.on('registrationFailed', (e) => {
            postToFrame('offline');
            console.warn('[SIP] registrationFailed:', e.cause);
            // Reintentar cada 30s
            setTimeout(() => { try { ua.register(); } catch(e) {} }, 30000);
        });

        ua.on('newRTCSession', (e) => {
            const s = e.session;
            if (s.direction !== 'incoming') return;

            _session = s;
            window._sipSession = s;

            s.on('ended',  () => hidePanel());
            s.on('failed', () => hidePanel());

            showRinging(s.remote_identity.uri.user || 'Desconocido');
        });

        ua.start();
    }

    // ── WS: re-anunciar al backend si se reinicia ─────────────────────────────
    // ua.on('registered') solo dispara en el primer registro SIP.
    // Si el backend se reinicia con SIP ya registrado, el WS se reconecta
    // y llamamos /pbx/queue/connect para restaurar el estado en el nuevo proceso.
    let _wsShellFirst = true;
    let _ws = null;
    let _wsRetry = 0;
    function initShellWs() {
        _ws = new WebSocket(WS_URL);
        _ws.onopen = () => {
            _wsRetry = 0;
            if (_wsShellFirst) { _wsShellFirst = false; return; }
            // Reconexión = backend reiniciado → re-anunciar si SIP registrado
            const u = window._usuarioCC;
            if (window._sipUA?.isRegistered() && u?.extension) {
                fetch(`${PBX_URL}/pbx/queue/connect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ extension: u.extension, username: u.username || '' })
                }).catch(() => {});
            }
        };
        _ws.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data);
                if (msg.tipo === 'pbx:sede' && msg.numero && msg.sede) {
                    _pendingSedeSIP = { numero: msg.numero, sede: msg.sede };
                    // Si el panel ya está mostrando ese número → actualizar badge
                    if (panel.style.display !== 'none' && callerNum.textContent === msg.numero) {
                        _mostrarSede(msg.numero);
                    }
                }
                if (msg.tipo === 'reactivacion') {
                    const frame = document.getElementById('cc-frame');
                    frame?.contentWindow?.postMessage({ type: 'ws-reactivacion', clienteId: msg.clienteId || null }, '*');
                }
                if (msg.tipo === 'nueva-version') {
                    document.getElementById('banner-nueva-version').style.display = 'block';
                }
            } catch {}
        };
        _ws.onclose = () => {
            const delay = Math.min(1000 * 2 ** _wsRetry, 30_000);
            _wsRetry++;
            setTimeout(initShellWs, delay);
        };
    }
    initShellWs();

    // ── Estados del panel ─────────────────────────────────────────────────────
    function showRinging(caller) {
        startRing();
        panelLabel.textContent = 'Llamada entrante';
        postToFrame('ringing', { callerNumber: caller });
        callerNum.textContent  = caller;
        _mostrarSede(caller);
        timerEl.style.display  = 'none';
        btnsIn.style.display   = 'flex';
        btnsCall.style.display = 'none';
        panel.style.display    = 'block';
    }

    function showInCall(caller) {
        stopRing();
        panelLabel.textContent = 'En llamada';
        postToFrame('incall');
        callerNum.textContent  = caller;
        timerEl.style.display  = 'block';
        timerEl.textContent    = '0:00';
        btnsIn.style.display   = 'none';
        btnsCall.style.display = 'flex';
        panel.style.display    = 'block';

        let secs = 0;
        _timerInterval = setInterval(() => {
            secs++;
            const m = Math.floor(secs / 60);
            const s = String(secs % 60).padStart(2, '0');
            timerEl.textContent = `${m}:${s}`;
        }, 1000);
    }

    function hidePanel() {
        stopRing();
        sedeEl.style.display = 'none';
        panel.style.display = 'none';
        const isReg = window._sipUA?.isRegistered();
        postToFrame(isReg ? 'registered' : 'offline');
        clearInterval(_timerInterval);
        _timerInterval      = null;
        _session            = null;
        window._sipSession  = null;
    }

    // ── Botones ───────────────────────────────────────────────────────────────
    document.getElementById('btn-sip-answer').onclick = () => {
        if (!_session) return;
        const caller = _session.remote_identity.uri.user || 'Desconocido';

        _session.answer({
            mediaConstraints: { audio: true, video: false },
            pcConfig:         { iceServers: ICE }
        });

        _session.connection.addEventListener('track', (e) => {
            document.getElementById('sip-audio').srcObject = e.streams[0];
        });

        _session.connection.addEventListener('connectionstatechange', () => {
            const state = _session?.connection?.connectionState;
            if (state === 'failed' || state === 'closed') {
                if (_session) _session.terminate();
                hidePanel();
            }
        });

        showInCall(caller);
    };

    document.getElementById('btn-sip-reject').onclick = () => {
        if (_session) _session.terminate();
        hidePanel();
    };

    document.getElementById('btn-sip-hangup').onclick = () => {
        if (_session) _session.terminate();
        hidePanel();
    };
</script>

</body>
</html>
