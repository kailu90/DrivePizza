<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CallCenter — DrivePizza</title>
    <link rel="shortcut icon" href="../Imagenes/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../Estilos/styles.css">
    <!-- Prefetch de páginas frecuentes para navegación más rápida -->
    <link rel="prefetch" href="./callcenter.html">
    <link rel="prefetch" href="./historialPedidos.html">
    <link rel="prefetch" href="./clientesCall.html">
    <link rel="prefetch" href="./pedidosCallCenter.html">
    <link rel="prefetch" href="./adminBarrios.html">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #cc-frame { width: 100%; height: 100%; border: none; display: block; }

        /* ── Banner nueva versión ── */
        #banner-nueva-version {
            display: none;
            position: fixed; top: 0; left: 0; right: 0;
            background: #1e40af; color: #fff;
            padding: 10px 20px;
            text-align: center;
            font-family: sans-serif; font-size: 14px;
            z-index: 99999;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        #banner-nueva-version button {
            margin-left: 16px;
            background: #fff; color: #1e40af;
            border: none; border-radius: 6px;
            padding: 4px 14px; font-size: 13px;
            font-weight: 600; cursor: pointer;
        }

        /* ── SIP panel ── */
        #sip-panel {
            display: none;
            position: fixed; bottom: 20px; right: 20px;
            background: #1e293b; color: #f1f5f9;
            border-radius: 14px; padding: 16px 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.55);
            z-index: 9999; min-width: 260px;
            font-family: sans-serif;
        }
        #sip-panel .sip-label {
            font-size: 11px; color: #94a3b8;
            letter-spacing: 1px; text-transform: uppercase;
            margin-bottom: 6px;
        }
        #sip-panel .sip-caller {
            font-size: 22px; font-weight: 700; margin-bottom: 4px;
        }
        #sip-panel .sip-timer {
            font-size: 13px; color: #94a3b8; margin-bottom: 12px;
        }
        #sip-sede {
            display: none;
            font-size: 11px; font-weight: 600;
            background: rgba(34,197,94,0.18); color: #22c55e;
            padding: 3px 10px; border-radius: 20px;
            margin-bottom: 10px; width: fit-content;
        }
        #sip-panel .sip-btns { display: flex; gap: 8px; }
        #sip-panel .sip-btns button {
            flex: 1; padding: 10px 0; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: opacity 0.15s;
        }
        #sip-panel .sip-btns button:hover { opacity: 0.85; }
        #btn-sip-answer { background: #22c55e; color: #fff; }
        #btn-sip-reject,
        #btn-sip-hangup { background: #ef4444; color: #fff; }

        /* ── Overlay navegación ── */
        #nav-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.82);
            z-index: 8000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }
        #nav-overlay.visible { display: flex; }
        .nav-spinner {
            width: 38px; height: 38px;
            border: 3px solid #e8ddd0;
            border-top-color: #c0392b;
            border-radius: 50%;
            animation: nav-spin 0.65s linear infinite;
        }
        @keyframes nav-spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="banner-nueva-version">
    🚀 Hay una nueva versión disponible.
    <button onclick="location.reload()">Recargar ahora</button>
</div>

<iframe id="cc-frame" src="./callcenter.html"></iframe>
<audio id="sip-audio" autoplay></audio>
<div id="nav-overlay"><div class="nav-spinner"></div></div>

<!-- Panel llamada entrante / en curso -->
<div id="sip-panel">
    <div class="sip-label"  id="sip-panel-label">Llamada entrante</div>
    <div id="sip-sede"></div>
    <div class="sip-caller" id="sip-caller-num"></div>
    <div class="sip-timer"  id="sip-timer" style="display:none"></div>

    <div class="sip-btns" id="sip-btns-incoming">
        <button id="btn-sip-answer">Contestar</button>
        <button id="btn-sip-reject">Rechazar</button>
    </div>
    <div class="sip-btns" id="sip-btns-incall" style="display:none">
        <button id="btn-sip-hangup">Colgar</button>
    </div>
</div>

<!-- JsSIP (debe cargar antes del módulo) -->
<script src="../jssip.min.js"></script>

<script type="module">
    import { supabase } from '../Api/supabaseConfig.js';
    import { PBX_URL, WS_URL } from '../Api/config.js';

    const ICE = [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
    ];

    // ── postMessage al iframe ─────────────────────────────────────────────────
    let _sipState = 'offline';
    function postToFrame(state, extra = {}) {
        _sipState = state;
        const frame = document.getElementById('cc-frame');
        if (!frame?.contentWindow) return;
        frame.contentWindow.postMessage({
            type:      'sip-state',
            state,
            username:  window._usuarioCC?.username  || '',
            extension: window._usuarioCC?.extension || '',
            ...extra
        }, '*');
    }
    function sipReconnect() {
        if (window._sipUA) {
            window._sipUA.register();
        }
    }
    // ── Overlay de navegación ─────────────────────────────────────────────────
    const _overlay = document.getElementById('nav-overlay');
    document.getElementById('cc-frame').addEventListener('load', () => {
        _overlay.classList.remove('visible');
    });

    // Mensajes desde el iframe
    window.addEventListener('message', (e) => {
        if (e.data?.type === 'nav-loading')       _overlay.classList.add('visible');
        if (e.data?.type === 'frame-ready')       postToFrame(_sipState);
        if (e.data?.type === 'sip-reconnect')     sipReconnect();
        if (e.data?.type === 'reactivacion-hecha') {
            if (_ws?.readyState === 1) _ws.send(JSON.stringify({ tipo: 'reactivacion' }));
        }
        if (e.data?.type === 'sip-hangup')  { if (_session) _session.terminate(); hidePanel(); }
        if (e.data?.type === 'sip-answer') {
            if (!_session) return;
            const caller = _session.remote_identity.uri.user || 'Desconocido';
            _session.answer({ mediaConstraints: { audio: true, video: false }, pcConfig: { iceServers: ICE } });
            _session.connection.addEventListener('track', (e) => {
                document.getElementById('sip-audio').srcObject = e.streams[0];
            });
            showInCall(caller);
        }
        if (e.data?.type === 'sip-decline') { if (_session) _session.terminate(); hidePanel(); }
    });

    // ── Auth + usuario ────────────────────────────────────────────────────────
    window._usuarioCCPromise = (async () => {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { window.location.href = '../index.html'; return; }
        try {
            const { data, error } = await supabase.from('usuarios').select('*').eq('id', user.id).single();
            if (error || !data) { window.location.href = '../index.html'; return; }
            const ROLES_CC = ['callcenter', 'callcenter-admin', 'admin'];
            if (!ROLES_CC.includes(data.rol)) { window.location.href = '../index.html'; return; }
            window._usuarioCC = {
                uid:         user.id,
                email:       user.email,
                username:    data.username    || user.email,
                sede:        data.sede        || '',
                rol:         data.rol         || '',
                extension:   data.extension   || null,
                sipPassword: data.sip_password || null
            };
            if (data.extension) initSIP(data.extension, data.sip_password || '');
            return window._usuarioCC;
        } catch (err) {
            console.error('[shell] Error cargando usuario:', err);
        } finally {
            document.body.classList.add('loaded');
        }
    })();

    // ── Desconexión al cerrar el navegador ───────────────────────────────────
    window.addEventListener('pagehide', () => {
        const u = window._usuarioCC;
        if (!u?.extension) return;
        const body = JSON.stringify({ extension: u.extension, username: u.username || '' });
        navigator.sendBeacon(`${PBX_URL}/pbx/queue/disconnect`, new Blob([body], { type: 'application/json' }));
    });

    // ── Ringtone (Web Audio API) ──────────────────────────────────────────────
    let _ringCtx      = null;
    let _ringInterval = null;

    // Desbloquear AudioContext en el primer click (política autoplay del browser)
    document.addEventListener('click', () => {
        if (!_ringCtx) _ringCtx = new AudioContext();
        else if (_ringCtx.state === 'suspended') _ringCtx.resume();
    }, { once: true });

    function startRing() {
        if (_ringInterval) return;
        if (!_ringCtx) _ringCtx = new AudioContext();
        if (_ringCtx.state === 'suspended') _ringCtx.resume();

        // Tremolo: triangle 700Hz con LFO que oscila el gain ~20Hz — timbre antiguo
        const osc  = _ringCtx.createOscillator();
        const lfo  = _ringCtx.createOscillator();
        const gain = _ringCtx.createGain();
        const lfoGain = _ringCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.value = 700;

        lfo.type = 'sine';
        lfo.frequency.value = 20;   // velocidad del tremolo
        lfoGain.gain.value = 0.4;   // profundidad del tremolo

        lfo.connect(lfoGain);
        lfoGain.connect(gain.gain);
        gain.gain.value = 0.4;

        osc.connect(gain);
        gain.connect(_ringCtx.destination);

        osc.start();
        lfo.start();

        // Guardar referencias para poder parar
        _ringInterval = { _osc: osc, _lfo: lfo };
    }

    function stopRing() {
        if (!_ringInterval) return;
        if (typeof _ringInterval === 'object') {
            try { _ringInterval._osc.stop(); } catch(e) {}
            try { _ringInterval._lfo.stop(); } catch(e) {}
        } else {
            clearInterval(_ringInterval);
        }
        _ringInterval = null;
    }

    // ── Referencias UI ────────────────────────────────────────────────────────
    const panel      = document.getElementById('sip-panel');
    const panelLabel = document.getElementById('sip-panel-label');
    const callerNum  = document.getElementById('sip-caller-num');
    const timerEl    = document.getElementById('sip-timer');
    const btnsIn     = document.getElementById('sip-btns-incoming');
    const btnsCall   = document.getElementById('sip-btns-incall');

    const IVR_SEDE = {
        '801': 'Cabecera', '802': 'Cañaveral', '803': 'Acrópolis',
        '804': 'Piedecuesta', '805': 'Megamall', '806': 'Único',
    };
    let _pendingSedeSIP = null;   // { numero, sede } recibido por WS antes de que suene
    const sedeEl        = document.getElementById('sip-sede');

    function _mostrarSede(callerNumber) {
        const nombre = (_pendingSedeSIP?.numero === callerNumber) ? IVR_SEDE[_pendingSedeSIP.sede] : null;
        if (nombre) { sedeEl.textContent = nombre; sedeEl.style.display = 'block'; }
        else        { sedeEl.style.display = 'none'; }
    }

    let _session       = null;
    let _timerInterval = null;

    // ── Init JsSIP ────────────────────────────────────────────────────────────
    function initSIP(extension, password) {
        const ua = new JsSIP.UA({
            sockets:                          [new JsSIP.WebSocketInterface('wss://pbx.everest-central.com/ws')],
            uri:                              `sip:${extension}@pbx.everest-central.com`,
            password,
            register:                         true,
            register_expires:                 300,
            connection_recovery_min_interval: 2,
            connection_recovery_max_interval: 30,
        });

        window._sipUA = ua;

        ua.on('registered', () => {
            postToFrame('registered');
            // Conectar automáticamente al IVR al registrarse
            fetch(`${PBX_URL}/pbx/queue/connect`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ extension, username: window._usuarioCC?.username || '' })
            }).catch(() => {});
        });

        ua.on('unregistered', () => {
            postToFrame('offline');
            // Reintentar registro si no fue un logout intencional
            if (ua.isConnected()) {
                setTimeout(() => { try { ua.register(); } catch(e) {} }, 3000);
            }
        });

        ua.on('registrationFailed', (e) => {
            postToFrame('offline');
            console.warn('[SIP] registrationFailed:', e.cause);
            // Reintentar cada 30s
            setTimeout(() => { try { ua.register(); } catch(e) {} }, 30000);
        });

        ua.on('newRTCSession', (e) => {
            const s = e.session;
            if (s.direction !== 'incoming') return;

            _session = s;
            window._sipSession = s;

            s.on('ended',  () => hidePanel());
            s.on('failed', () => hidePanel());

            showRinging(s.remote_identity.uri.user || 'Desconocido');
        });

        ua.start();
    }

    // ── WS: re-anunciar al backend si se reinicia ─────────────────────────────
    // ua.on('registered') solo dispara en el primer registro SIP.
    // Si el backend se reinicia con SIP ya registrado, el WS se reconecta
    // y llamamos /pbx/queue/connect para restaurar el estado en el nuevo proceso.
    let _wsShellFirst = true;
    let _ws = null;
    function initShellWs() {
        _ws = new WebSocket(WS_URL);
        _ws.onopen = () => {
            if (_wsShellFirst) { _wsShellFirst = false; return; }
            // Reconexión = backend reiniciado → re-anunciar si SIP registrado
            const u = window._usuarioCC;
            if (window._sipUA?.isRegistered() && u?.extension) {
                fetch(`${PBX_URL}/pbx/queue/connect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ extension: u.extension, username: u.username || '' })
                }).catch(() => {});
            }
        };
        _ws.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data);
                if (msg.tipo === 'pbx:sede' && msg.numero && msg.sede) {
                    _pendingSedeSIP = { numero: msg.numero, sede: msg.sede };
                    // Si el panel ya está mostrando ese número → actualizar badge
                    if (panel.style.display !== 'none' && callerNum.textContent === msg.numero) {
                        _mostrarSede(msg.numero);
                    }
                }
                if (msg.tipo === 'reactivacion') {
                    const frame = document.getElementById('cc-frame');
                    frame?.contentWindow?.postMessage({ type: 'ws-reactivacion' }, '*');
                }
                if (msg.tipo === 'nueva-version') {
                    document.getElementById('banner-nueva-version').style.display = 'block';
                }
            } catch {}
        };
        _ws.onclose = () => setTimeout(initShellWs, 5000);
    }
    initShellWs();

    // ── Estados del panel ─────────────────────────────────────────────────────
    function showRinging(caller) {
        startRing();
        panelLabel.textContent = 'Llamada entrante';
        postToFrame('ringing', { callerNumber: caller });
        callerNum.textContent  = caller;
        _mostrarSede(caller);
        timerEl.style.display  = 'none';
        btnsIn.style.display   = 'flex';
        btnsCall.style.display = 'none';
        panel.style.display    = 'block';
    }

    function showInCall(caller) {
        stopRing();
        panelLabel.textContent = 'En llamada';
        postToFrame('incall');
        callerNum.textContent  = caller;
        timerEl.style.display  = 'block';
        timerEl.textContent    = '0:00';
        btnsIn.style.display   = 'none';
        btnsCall.style.display = 'flex';
        panel.style.display    = 'block';

        let secs = 0;
        _timerInterval = setInterval(() => {
            secs++;
            const m = Math.floor(secs / 60);
            const s = String(secs % 60).padStart(2, '0');
            timerEl.textContent = `${m}:${s}`;
        }, 1000);
    }

    function hidePanel() {
        stopRing();
        sedeEl.style.display = 'none';
        panel.style.display = 'none';
        const isReg = window._sipUA?.isRegistered();
        postToFrame(isReg ? 'registered' : 'offline');
        clearInterval(_timerInterval);
        _timerInterval      = null;
        _session            = null;
        window._sipSession  = null;
    }

    // ── Botones ───────────────────────────────────────────────────────────────
    document.getElementById('btn-sip-answer').onclick = () => {
        if (!_session) return;
        const caller = _session.remote_identity.uri.user || 'Desconocido';

        _session.answer({
            mediaConstraints: { audio: true, video: false },
            pcConfig:         { iceServers: ICE }
        });

        _session.connection.addEventListener('track', (e) => {
            document.getElementById('sip-audio').srcObject = e.streams[0];
        });

        _session.connection.addEventListener('connectionstatechange', () => {
            const state = _session?.connection?.connectionState;
            if (state === 'failed' || state === 'closed') {
                if (_session) _session.terminate();
                hidePanel();
            }
        });

        showInCall(caller);
    };

    document.getElementById('btn-sip-reject').onclick = () => {
        if (_session) _session.terminate();
        hidePanel();
    };

    document.getElementById('btn-sip-hangup').onclick = () => {
        if (_session) _session.terminate();
        hidePanel();
    };
</script>

</body>
</html>
