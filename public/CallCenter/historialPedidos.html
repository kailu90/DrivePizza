<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Historial de Pedidos - CallCenter</title>
    <link rel="stylesheet" href="../Estilos/styles.css">
    <link rel="stylesheet" href="../Estilos/skeleton.css">
    <link rel="stylesheet" href="../Estilos/historialPedidos.css">
    <link rel="stylesheet" href="pedidosCallCenter.css">
    <link rel="stylesheet" href="../Estilos/workspace.css">
    <link rel="shortcut icon" href="../Imagenes/logo.png" type="image/x-icon">
    <style>
        /* pedidosCallCenter.css define .modal-overlay { display:flex } — revertir */
        .modal-overlay { display: none; }
        /* Responsive header */
        @media (max-width: 768px) {
            .logout-text { display:none; }
            .logout-icon { display:block; }
            #btn-logout { padding:4px 6px; font-size:0; }
            .header-controls { gap:4px; }
        }
    </style>
</head>
<body data-skeleton="historial">

<div id="skeleton" class="sk-page"></div>

<!-- Panel lateral de filtros -->
<div id="filtros-overlay" class="filtros-overlay"></div>
<aside id="filtros-panel" class="filtros-panel">
    <div class="filtros-panel__header">
        <span>Filtros</span>
        <button id="btn-cerrar-panel" class="btn-cerrar-panel">&times;</button>
    </div>
    <div class="filtros-panel__body">
        <div class="filtro-grupo">
            <label>Desde</label>
            <input type="date" id="filtro-desde">
        </div>
        <div class="filtro-grupo">
            <label>Hasta</label>
            <input type="date" id="filtro-hasta">
        </div>
        <div class="filtro-grupo">
            <label>Sede</label>
            <select id="filtro-sede">
                <option value="">Todas</option>
                <option value="cabecera">Cabecera</option>
                <option value="acropolis">Acrópolis</option>
                <option value="cañaveral">Cañaveral</option>
                <option value="megamall">Megamall</option>
                <option value="piedecuesta">Piedecuesta</option>
                <option value="unico">Único</option>
            </select>
        </div>
        <div class="filtro-grupo">
            <label>Estado</label>
            <select id="filtro-estado">
                <option value="">Todos</option>
                <option value="pendiente">Pendiente</option>
                <option value="recibido">Recibido</option>
                <option value="en preparacion">En preparación</option>
                <option value="despachado">Despachado</option>
            </select>
        </div>
        <button class="btn-filtrar" id="btn-filtrar">Filtrar</button>
        <button class="btn-limpiar" id="btn-limpiar">Limpiar</button>
    </div>
</aside>

<div id="contenido-principal" style="display:none;">

    <header class="main-header no-print">
        <div class="header-left">
            <img src="../Imagenes/logo.png" alt="DrivePizza">
        </div>
        <div class="header-name">
            <button class="btn-home with-tooltip" data-tooltip="Regresar al Panel" id="btn-home">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" class="icon-home">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </button>
            <div class="header-username" id="username">—</div>
        </div>
        <div class="header-controls">
            <!-- Toggle WA (mobile) -->
            <button class="btn-historial btn-panel-mobile with-tooltip" data-tooltip="WhatsApp" id="btn-open-wa" aria-label="Abrir WhatsApp">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
                    <path d="M12 0C5.373 0 0 5.373 0 12c0 2.124.558 4.118 1.531 5.845L.057 23.448a.75.75 0 0 0 .92.921l5.684-1.481A11.945 11.945 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.907 0-3.686-.524-5.208-1.433l-.374-.222-3.876 1.009 1.028-3.758-.244-.389A9.956 9.956 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
                </svg>
            </button>
            <!-- Toggle PBX (mobile) -->
            <button class="btn-historial btn-panel-mobile with-tooltip" data-tooltip="Softphone" id="btn-open-pbx" aria-label="Abrir PBX" style="position:relative;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.62 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 5.49 5.49l.98-.97a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 16.92z"/>
                </svg>
                <span id="agents-badge-mobile" class="agents-badge" style="display:none;"></span>
            </button>
            <button id="btn-logout" class="header-link">
                <span class="logout-text">Cerrar Sesión</span>
                <svg class="logout-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>
    </header>

    <div id="workspace">

        <!-- ── Panel izquierdo: WhatsApp ───────────────────────── -->
        <div id="panel-wa" class="side-panel collapsed">
            <div class="panel-header">
                <span class="panel-header__title">WhatsApp</span>
                <button class="panel-header__icon" id="strip-wa" aria-label="Toggle WhatsApp">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
                        <path d="M12 0C5.373 0 0 5.373 0 12c0 2.124.558 4.118 1.531 5.845L.057 23.448a.75.75 0 0 0 .92.921l5.684-1.481A11.945 11.945 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.907 0-3.686-.524-5.208-1.433l-.374-.222-3.876 1.009 1.028-3.758-.244-.389A9.956 9.956 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
                    </svg>
                </button>
            </div>
            <div class="panel-body" id="wa-body"></div>
        </div><!-- /panel-wa -->

        <!-- ── Centro: historial ───────────────────────────────── -->
        <div id="layout-center">
            <main class="historial__main">

                <!-- Encabezado historial -->
                <div class="historial__topbar">
                    <div class="topbar-actions">
                        <button class="btn-filtros-toggle" id="btn-abrir-panel">⚙ Filtros</button>
                        <button class="btn-actualizar" id="btn-actualizar" title="Actualizar">↺ Actualizar</button>
                        <button class="btn-exportar" id="btn-exportar" style="display:none;">⬇ CSV</button>
                        <button class="btn-exportar" id="btn-liquidacion" style="display:none;">📊 Liquidación</button>
                    </div>
                </div>

                <!-- Resumen rápido -->
                <section class="historial__resumen">
                    <div class="resumen-card">
                        <span class="resumen-label">Total pedidos</span>
                        <span class="resumen-valor" id="resumen-total">0</span>
                    </div>
                    <div class="resumen-card">
                        <span class="resumen-label">📱 WhatsApp</span>
                        <span class="resumen-valor" id="resumen-whatsapp">0</span>
                    </div>
                    <div class="resumen-card">
                        <span class="resumen-label">📞 IVR</span>
                        <span class="resumen-valor" id="resumen-ivr">0</span>
                    </div>
                    <div class="resumen-card resumen-card--reserva">
                        <span class="resumen-label">🗓 Reservas</span>
                        <span class="resumen-valor" id="resumen-reservas">0</span>
                    </div>
                </section>

                <!-- Tabla -->
                <section class="inventory-management">
                    <table class="inventory-management__table">
                        <thead class="inventory-management__thead">
                            <tr class="inventory-management__row">
                                <th class="inventory-management__heading">N°</th>
                                <th class="inventory-management__heading">Fecha / Hora</th>
                                <th class="inventory-management__heading">Cliente</th>
                                <th class="inventory-management__heading">Dirección</th>
                                <th class="inventory-management__heading">Canal</th>
                                <th class="inventory-management__heading">Sede</th>
                                <th class="inventory-management__heading">Asesor</th>
                                <th class="inventory-management__heading">Estado</th>
                                <th class="inventory-management__heading">Obs.</th>
                                <th class="inventory-management__heading">Total</th>
                            </tr>
                            <tr class="filtros-columna">
                                <th><input type="text" class="col-filter" id="cf-npedido" placeholder="N° pedido"></th>
                                <th><input type="text" class="col-filter" id="cf-fecha" placeholder="dd/mm/aa"></th>
                                <th><input type="text" class="col-filter" id="cf-cliente" placeholder="Nombre cliente"></th>
                                <th><input type="text" class="col-filter" id="cf-direccion" placeholder="Dirección"></th>
                                <th>
                                    <select class="col-filter" id="cf-canal">
                                        <option value="">Todos</option>
                                        <option value="whatsapp">WhatsApp</option>
                                        <option value="ivr">IVR</option>
                                    </select>
                                </th>
                                <th>
                                    <select class="col-filter" id="cf-sede">
                                        <option value="">Todas</option>
                                        <option value="cabecera">Cabecera</option>
                                        <option value="acropolis">Acrópolis</option>
                                        <option value="cañaveral">Cañaveral</option>
                                        <option value="megamall">Megamall</option>
                                        <option value="piedecuesta">Piedecuesta</option>
                                        <option value="unico">Único</option>
                                    </select>
                                </th>
                                <th>
                                    <select class="col-filter" id="cf-asesor">
                                        <option value="">Todos</option>
                                    </select>
                                </th>
                                <th>
                                    <select class="col-filter" id="cf-estado">
                                        <option value="">Todos</option>
                                        <option value="pendiente">Pendiente</option>
                                        <option value="recibido">Recibido</option>
                                        <option value="en preparacion">En preparación</option>
                                        <option value="despachado">Despachado</option>
                                    </select>
                                </th>
                                <th></th>
                                <th></th>
                                <th class="th-sync" style="display:none;"></th>
                            </tr>
                        </thead>
                        <tbody id="historial-tbody">
                            <tr>
                                <td class="inventory-management__cell" colspan="10" style="text-align:center; padding: 30px;">
                                    Cargando pedidos...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>

                <div id="paginacion" class="paginacion"></div>

            </main>
        </div><!-- /layout-center -->

        <!-- ── Panel derecho: PBX softphone ───────────────────── -->
        <div id="panel-pbx" class="side-panel collapsed">
            <div class="panel-header">
                <div id="sip-status">
                    <button class="panel-header__icon" id="strip-pbx" aria-label="Toggle Softphone">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.62 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 5.49 5.49l.98-.97a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 16.92z"/>
                        </svg>
                    </button>
                    <span id="sip-dot-hdr"></span>
                    <div id="sip-popover">
                        <div class="sip-pop-row">
                            <span class="sip-pop-label">Estado</span>
                            <span id="sip-pop-estado">—</span>
                        </div>
                        <div class="sip-pop-row">
                            <span class="sip-pop-label">Extensión</span>
                            <span id="sip-pop-ext">—</span>
                        </div>
                        <button id="btn-sip-reconectar">Reconectar</button>
                    </div>
                </div>
                <div class="panel-header__title pbx-hdr-info">
                    <span class="pbx-hdr-name" id="pbx-agent-name">Softphone</span>
                    <div class="pbx-hdr-sub">
                        <span class="pbx-hdr-ext" id="pbx-agent-ext"></span>
                        <button class="pbx-hdr-badge" id="pbx-hdr-badge" disabled>Desconectado</button>
                    </div>
                </div>
            </div>
            <!-- Asesores en línea -->
            <div id="panel-agents" style="display:none;">
                <button id="panel-agents-toggle" class="panel-agents-toggle">
                    <span>Asesores en línea</span>
                    <span id="panel-agents-count" class="panel-agents-count-badge"></span>
                    <svg class="panel-agents-arrow" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
                <div id="panel-agents-list" class="agents-strip panel-agents-list" style="display:none;"></div>
            </div>
            <div class="panel-body" id="pbx-body"></div>
        </div><!-- /panel-pbx -->

    </div><!-- /workspace -->

    <div id="workspace-overlay"></div>

</div><!-- /contenido-principal -->

<!-- Modal detalle / gestión de pedido -->
<div class="modal-overlay" id="modal-detalle">
    <div class="modal-pedido-content">

        <div class="mpedido-header">
            <span class="mpedido-npedido" id="modal-npedido"></span>
            <div style="display:flex; gap:6px; align-items:center;">
                <button class="mpedido-close" id="cerrar-detalle">&times;</button>
            </div>
        </div>

        <div class="mpedido-body">
            <div class="mpedido-cliente" id="modal-cliente"></div>
            <div class="mpedido-meta" id="modal-meta"></div>
            <div class="mpedido-entrega" id="modal-entrega"></div>
            <div id="modal-impreso"></div>
            <hr class="mpedido-sep">
            <div class="mpedido-productos-title" id="modal-productos-title">Productos</div>
            <ul class="mpedido-productos" id="modal-productos"></ul>
            <div class="mpedido-totals-box" id="modal-totals-box" style="display:none;">
                <div style="display:flex; justify-content:space-between; font-size:1.3rem; color:#555; margin-bottom:4px;">
                    <span>Productos:</span>
                    <span id="modal-total"></span>
                </div>
                <div id="modal-domicilio-row" style="display:none; justify-content:space-between; font-size:1.3rem; color:#555; margin-bottom:6px;">
                    <span>Domicilio:</span>
                    <span id="modal-domicilio"></span>
                </div>
                <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.5rem; border-top:1px solid #ddd; padding-top:6px;">
                    <span>TOTAL:</span>
                    <span id="modal-total-final" style="color:#e67e22;"></span>
                </div>
            </div>
            <div id="modal-obs"></div>
        </div>

        <div id="modal-stepper"></div>
        <div class="mpedido-cancel-area" id="modal-cancel-area"></div>

    </div>
</div>

<!-- Modal confirmación cancelación -->
<div class="modal-overlay" id="modal-cancelar" style="display:none;">
    <div class="modal-content" style="max-width:400px;">
        <h3>Cancelar Pedido</h3>
        <p id="cancelar-descripcion" style="margin:8px 0; color:#555;"></p>
        <textarea id="cancelar-motivo" placeholder="Motivo de cancelación (opcional)..."
            style="width:100%; margin-top:8px; padding:10px; border-radius:8px; border:1px solid #ddd; min-height:80px; font-size:14px; box-sizing:border-box; resize:vertical;"></textarea>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button id="btn-confirmar-cancelar" class="btn-accion btn-cancelar" style="flex:1; padding:12px;">Confirmar Cancelación</button>
            <button id="btn-cerrar-cancelar" class="btn-accion" style="flex:1; padding:12px; background:#95a5a6; color:white;">Volver</button>
        </div>
    </div>
</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script type="module" src="../CallCenter/historialPedidos.js"></script>

</body>
</html>
