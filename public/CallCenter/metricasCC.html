<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Métricas CC</title>
    <link rel="stylesheet" href="../Estilos/styles.css">
    <link rel="stylesheet" href="../Estilos/metricasCC.css">
</head>
<body>

<div class="mc-page">

    <div class="mc-header">
        <h2 class="mc-title">Métricas <span>CallCenter</span></h2>
        <div class="mc-filters">
            <div class="mc-chips">
                <button class="mc-chip active" data-p="30d">30 días</button>
                <button class="mc-chip" data-p="7d">7 días</button>
                <button class="mc-chip" data-p="mes">Este mes</button>
                <button class="mc-chip" data-p="3m">3 meses</button>
                <button class="mc-chip" data-p="año">Este año</button>
            </div>
            <select id="mc-sede" class="mc-sede-sel">
                <option value="">Todas las sedes</option>
            </select>
        </div>
    </div>

    <div class="mc-kpis" id="mc-kpis">
        <div class="mc-card mc-skel"></div>
        <div class="mc-card mc-skel"></div>
        <div class="mc-card mc-skel"></div>
        <div class="mc-card mc-skel"></div>
        <div class="mc-card mc-skel"></div>
        <div class="mc-card mc-skel"></div>
    </div>

    <p class="mc-section-title">Comportamiento de pedidos</p>

    <div class="mc-charts" id="mc-charts">
        <div class="mc-chart-card">
            <div class="mc-chart-title">Domicilios por día de la semana</div>
            <canvas id="chart-dias"></canvas>
        </div>
        <div class="mc-chart-card">
            <div class="mc-chart-title">Domicilios y pedidos por período</div>
            <canvas id="chart-evolucion"></canvas>
        </div>
        <div class="mc-chart-card">
            <div class="mc-chart-title">Evolución de ventas</div>
            <canvas id="chart-ventas"></canvas>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script type="module" src="../Auth/authCheck.js"></script>
<script type="module" src="metricasCC.js"></script>
</body>
</html>
