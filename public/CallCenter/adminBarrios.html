<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Administrar Barrios - CallCenter</title>
    <link rel="stylesheet" href="../Estilos/styles.css">
    <link rel="stylesheet" href="../Estilos/skeleton.css">
    <link rel="stylesheet" href="pedidosCallCenter.css">
    <link rel="shortcut icon" href="../Imagenes/logo.png" type="image/x-icon">
    <style>
        .modal-overlay { display: none; }

        /* ── Layout dos columnas ───────────────────────────────── */
        .ab-layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 1fr;
            height: calc(100vh - 100px);
            background: var(--color-secundario);
        }

        /* ── Sidebar izquierdo ─────────────────────────────────── */
        .ab-sidebar {
            grid-column: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0d8cc;
            padding: 16px 12px;
            gap: 6px;
            overflow-y: auto;
        }

        .ab-sidebar-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--color-primario);
            margin-bottom: 6px;
            padding-left: 4px;
        }

        /* ── Panel principal ───────────────────────────────────── */
        .ab-main {
            grid-column: 2;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 20px 24px;
            min-height: 0;
        }

        #ab-view-barrios,
        #ab-view-log {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .ab-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .ab-topbar h2 {
            margin: 0;
            font-size: 20px;
            color: var(--color-primario);
        }

        .ab-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-agregar {
            background: var(--color-primario);
            color: var(--color-secundario);
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-agregar:hover { background: var(--color-cuaternario); }

        /* ── Banner migración ──────────────────────────────────── */
        .migration-banner {
            background: #f9f4eb;
            border: 1px solid var(--color-cuaternario);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 14px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .migration-banner p { margin: 0; color: var(--color-terciario); }
        .btn-migrar {
            background: var(--color-quinto);
            color: #fff;
            border: none;
            border-radius: 7px;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-migrar:hover    { opacity: 0.85; }
        .btn-migrar:disabled { background: #bcbcbc; cursor: not-allowed; }

        /* ── Buscador ──────────────────────────────────────────── */
        .barrios-search {
            padding: 9px 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .barrios-search:focus { border-color: var(--color-primario); outline: none; }

        /* ── Status ────────────────────────────────────────────── */
        #barrios-status {
            font-size: 13px;
            min-height: 18px;
            margin-bottom: 6px;
        }
        #barrios-status.error { color: #c0392b; }
        #barrios-status.ok    { color: var(--color-primario); }

        /* ── Tabla ─────────────────────────────────────────────── */
        .ab-table-wrap {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #e0d8cc;
            border-radius: 8px;
        }

        .barrios-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .barrios-table thead {
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .barrios-table th {
            text-align: left;
            padding: 10px 14px;
            background: var(--color-secundario);
            border-bottom: 2px solid var(--color-primario);
            font-weight: 700;
            color: var(--color-primario);
        }
        .barrios-table td {
            padding: 9px 14px;
            border-bottom: 1px solid #e8e0d4;
            vertical-align: middle;
        }
        .barrios-table tr:hover td { background: #ede6d8; }

        .td-barrio { width: 50%; }
        .td-valor  { width: 20%; }
        .td-coord  { width: 15%; color: #888; font-size: 13px; font-variant-numeric: tabular-nums; }

        .td-barrio--clickable {
            cursor: pointer;
            color: var(--color-primario);
            font-weight: 600;
        }
        .td-barrio--clickable:hover { text-decoration: underline; }

        /* ── Botones acción ────────────────────────────────────── */
        .btn-edit, .btn-delete, .btn-save, .btn-cancel {
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-edit         { background: var(--color-secundario); color: var(--color-terciario); border: 1px solid #ccc; }
        .btn-edit:hover   { border-color: var(--color-primario); color: var(--color-primario); }
        .btn-delete       { background: #fdecea; color: #c0392b; border: 1px solid #f5c0bb; margin-left: 4px; }
        .btn-delete:hover { background: #f5c0bb; border-color: #c0392b; }
        .btn-save         { background: var(--color-primario); color: var(--color-secundario); }
        .btn-save:hover   { background: var(--color-cuaternario); }
        .btn-cancel       { background: var(--color-secundario); color: var(--color-terciario); border: 1px solid #ccc; margin-left: 4px; }
        .btn-cancel:hover { border-color: var(--color-terciario); }

        .input-edit {
            width: 100%;
            box-sizing: border-box;
            padding: 5px 8px;
            border: 2px solid var(--color-primario);
            border-radius: 6px;
            font-size: 14px;
        }

        .barrios-empty {
            text-align: center;
            color: #aaa;
            padding: 30px;
            font-size: 14px;
        }

        /* ── Toast ─────────────────────────────────────────────── */
        .ab-toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--color-primario);
            color: var(--color-secundario);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            z-index: 99999;
            white-space: nowrap;
        }
        .ab-toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Botón log en sidebar ──────────────────────────────── */
        #admin-sede-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #admin-sede-nav .sede-btn {
            width: 100%;
            text-align: center;
        }

        .ab-sidebar-divider {
            height: 1px;
            background: #e0d8cc;
            margin: 12px 0;
        }

        .btn-log {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: none;
            font-size: 13px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }
        .btn-log:hover { border-color: var(--color-primario); color: var(--color-primario); }
        .btn-log.active {
            background: var(--color-primario);
            color: var(--color-secundario);
            border-color: var(--color-primario);
        }

        /* ── Tabla log ─────────────────────────────────────────── */
        .log-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .log-table th {
            text-align: left;
            padding: 9px 12px;
            background: var(--color-secundario);
            border-bottom: 2px solid var(--color-primario);
            font-weight: 700;
            color: var(--color-primario);
            white-space: nowrap;
        }
        .log-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #e8e0d4;
            vertical-align: middle;
        }
        .log-table tr:hover td { background: #ede6d8; }
        .log-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }
        .log-badge.crear    { background: #e8f5e9; color: var(--color-primario); }
        .log-badge.editar   { background: #fff8e1; color: #c07800; }
        .log-badge.eliminar { background: #fdecea; color: #c0392b; }

        /* ── Indicador coords ──────────────────────────────────── */
        .td-coords-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            margin-right: 4px;
            cursor: default;
            opacity: 0.2;
            vertical-align: middle;
        }
        .td-coords-icon.has-coords { opacity: 1; }

        /* ── Fila edición (colspan=3) ──────────────────────────── */
        .td-edit-form { padding: 12px 14px !important; background: #fafaf8; }

        .ab-edit-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
            align-items: flex-end;
        }
        .ab-edit-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 130px;
        }
        .ab-edit-field--coords { max-width: 170px; }
        .ab-edit-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #888;
        }
        .btn-geo {
            background: #f0f7ff;
            color: #1565c0;
            border: 1px solid #90caf9;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            width: 100%;
        }
        .btn-geo:hover    { background: #e3f2fd; border-color: #1565c0; }
        .btn-geo:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ── Modal detalle barrio ───────────────────────────────── */
        .modal-det-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 5px;
        }
        .modal-det-coords {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            align-items: end;
        }
        .modal-det-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 22px;
        }

        .ab-edit-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* ── Responsive ────────────────────────────────────────── */
        @media (max-width: 768px) {
            .logout-text { display: none; }
            .logout-icon { display: block; }
            #btn-logout  { padding: 4px 6px; font-size: 0; }
            .header-controls { gap: 4px; }

            .ab-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                height: auto;
            }
            .ab-sidebar {
                flex-direction: row;
                flex-wrap: wrap;
                border-right: none;
                border-bottom: 1px solid #e0d8cc;
                padding: 10px 12px;
            }
            .ab-sidebar-title { display: none; }
            .ab-main { padding: 14px 16px; }
        }
    </style>
</head>
<body data-skeleton="historial">

<div class="pw-page-transition" id="pw-page-transition">
    <img class="pw-page-transition-logo" src="../Imagenes/Isotipo.png" alt="Drive Pizza">
    <span class="pw-page-transition-slogan">
        <span class="pw-pts-left">HECHA PARA</span>
        <span class="pw-pts-right">COMPARTIR</span>
    </span>
</div>

<div id="skeleton" class="sk-page"></div>

<div id="contenido-principal" style="display:none;">

    <header class="main-header">
        <div class="header-left">
            <img src="../Imagenes/logo.png" alt="DrivePizza">
        </div>
        <div class="header-name">
            <button class="btn-home with-tooltip" data-tooltip="Regresar al Panel" id="btn-home">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" class="icon-home">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </button>
            <div class="header-username" id="username">—</div>
        </div>
        <div class="header-controls" id="header-controls">
            <button id="btn-logout" class="header-link">
                <span class="logout-text">Cerrar Sesión</span>
                <svg class="logout-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="ab-layout">

        <!-- ── Sidebar sedes ────────────────────────────────────── -->
        <nav class="ab-sidebar">
            <div class="ab-sidebar-title">Sedes</div>
            <div id="admin-sede-nav"></div>
            <div class="ab-sidebar-divider"></div>
            <button class="btn-log" id="btn-ver-log">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                Log de cambios
            </button>
        </nav>

        <!-- ── Panel principal ─────────────────────────────────── -->
        <div class="ab-main">

            <div class="migration-banner" id="migration-banner">
                <p>¿Primera vez? Importa todos los barrios del archivo local <code>domicilios.js</code> a Supabase.</p>
                <button class="btn-migrar" id="btn-migrar">Importar datos locales</button>
            </div>

            <div class="ab-topbar">
                <h2 id="ab-titulo">Cabecera</h2>
                <div class="ab-actions">
                    <button class="btn-agregar" id="btn-agregar-barrio">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2.5"
                             stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Agregar barrio
                    </button>
                </div>
            </div>

            <!-- Vista: Barrios -->
            <div id="ab-view-barrios">
                <div style="display:flex;gap:8px;margin-bottom:10px;align-items:center;">
                    <input type="text" id="admin-barrios-search" class="barrios-search"
                           placeholder="Buscar barrio..." autocomplete="off"
                           style="margin-bottom:0;flex:1;">
                    <button id="btn-filtro-sin-coords" class="btn-edit" style="white-space:nowrap;padding:8px 12px;font-size:13px;">
                        Sin coords
                    </button>
                </div>

                <div id="barrios-status"></div>

                <div class="ab-table-wrap">
                    <table class="barrios-table">
                        <thead>
                            <tr>
                                <th class="td-barrio">Barrio</th>
                                <th class="td-valor">Domicilio</th>
                                <th class="td-coord">Latitud</th>
                                <th class="td-coord">Longitud</th>
                            </tr>
                        </thead>
                        <tbody id="barrios-tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- Vista: Log -->
            <div id="ab-view-log" style="display:none;">
                <div class="ab-table-wrap">
                    <table class="log-table">
                        <thead>
                            <tr>
                                <th>Acción</th>
                                <th>Sede</th>
                                <th>Barrio</th>
                                <th>Valor ant.</th>
                                <th>Valor nuevo</th>
                                <th>Usuario</th>
                                <th>Fecha y hora</th>
                            </tr>
                        </thead>
                        <tbody id="log-tbody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- ── Modal agregar barrio ─────────────────────────────────────── -->
<div id="modal-agregar-barrio" class="modal-overlay" style="display:none;">
    <div class="modal-content" style="max-width:400px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <h3 style="margin:0;color:var(--color-primario);">Agregar barrio</h3>
            <button id="btn-cerrar-modal-barrio" style="background:none;border:none;font-size:22px;cursor:pointer;color:#666;">&times;</button>
        </div>
        <p id="modal-barrio-sede-label" style="margin:0 0 18px;font-size:22px;font-weight:900;color:var(--color-primario);letter-spacing:0.5px;"></p>
        <div style="display:flex;flex-direction:column;gap:14px;">
            <div>
                <label style="display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:6px;">Nombre del barrio</label>
                <input id="modal-barrio-nombre" type="text" placeholder="Ej: Villa del Prado"
                       class="barrios-search" style="margin-bottom:0;">
            </div>
            <div>
                <label style="display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:6px;">Valor domicilio</label>
                <input id="modal-barrio-valor" type="number" min="0" placeholder="Ej: 5000"
                       class="barrios-search" style="margin-bottom:0;">
            </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:24px;">
            <button class="btn-cancel" id="btn-cancelar-modal-barrio">Cancelar</button>
            <button class="btn-save"   id="btn-guardar-modal-barrio">Guardar</button>
        </div>
    </div>
</div>

<!-- ── Modal detalle / edición de barrio ──────────────────────── -->
<div id="modal-detalle-barrio" class="modal-overlay" style="display:none;">
    <div class="modal-content" style="max-width:440px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <p id="modal-det-sede" style="margin:0;font-size:12px;color:#999;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;"></p>
            <div style="display:flex;align-items:center;gap:6px;">
                <button id="modal-det-eliminar" class="btn-modal btn-modal--danger" title="Eliminar barrio">🗑️</button>
                <button id="btn-cerrar-modal-detalle" style="background:none;border:none;font-size:24px;cursor:pointer;color:#888;line-height:1;">&times;</button>
            </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:12px;">
            <div>
                <label class="modal-det-label">Nombre del barrio</label>
                <input id="modal-det-barrio" type="text" class="barrios-search" style="margin-bottom:0;" autocomplete="off">
            </div>
            <div>
                <label class="modal-det-label">Valor domicilio</label>
                <input id="modal-det-valor" type="number" min="0" class="barrios-search" style="margin-bottom:0;">
            </div>
            <div class="modal-det-coords">
                <div>
                    <label class="modal-det-label">Latitud</label>
                    <input id="modal-det-lat" type="number" step="0.000001" placeholder="Ej: 7.11929"
                           class="barrios-search" style="margin-bottom:0;">
                </div>
                <div>
                    <label class="modal-det-label">Longitud</label>
                    <input id="modal-det-lng" type="number" step="0.000001" placeholder="Ej: -73.12456"
                           class="barrios-search" style="margin-bottom:0;">
                </div>
                <div style="display:flex;align-items:flex-end;">
                    <button id="modal-det-ir-maps" class="btn-edit" style="white-space:nowrap;padding:8px 12px;width:100%;" title="Verificar coordenadas en Google Maps">
                        🗺 Ir a
                    </button>
                </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;">
                <label class="modal-det-label">Pega la URL de Google Maps para extraer coordenadas</label>
                <div style="display:flex;gap:6px;">
                    <input id="modal-det-maps-url" type="text"
                           placeholder="https://www.google.com/maps/..."
                           class="barrios-search" style="margin-bottom:0;flex:1;font-size:12px;padding:7px 10px;">
                    <button id="modal-det-maps-parse" class="btn-save" style="white-space:nowrap;padding:7px 12px;">Extraer</button>
                </div>
            </div>
        </div>

        <div class="modal-det-footer">
            <div style="display:flex;gap:8px;margin-left:auto;">
                <button id="modal-det-cancelar" class="btn-cancel">Cancelar</button>
                <button id="modal-det-guardar"  class="btn-save">Guardar</button>
            </div>
        </div>
    </div>
</div>

<div class="ab-toast" id="ab-toast"></div>
<script type="module" src="./adminBarrios.js"></script>
</body>
</html>
