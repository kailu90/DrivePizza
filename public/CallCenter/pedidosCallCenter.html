    <script type="module">
    import { supabase } from '../Api/supabaseConfig.js';
    import { mostrarSkeleton, ocultarSkeleton } from "../Shared/skeleton.js";
    import { domicilios } from "./domicilios.js";
    import { mostrarOverlay, actualizarOverlay, ocultarOverlay } from "../Shared/overlay.js";
    import { initPanel }    from "../Shared/panelToggle.js";
    import { initPbxPanel }  from "./pbxPanel.js";
    import { initNavButtons } from "./navCallCenter.js";
    import { PBX_URL, WS_URL } from "../Api/config.js";
    import { buscarClientes, cargarCliente, upsertCliente } from "./clientesCall.js";

    // ── Paneles laterales ─────────────────────────────────────────
    const panelWA  = initPanel('panel-wa',  'strip-wa',  'dp_panel_wa');
    const panelPBX = initPanel('panel-pbx', 'strip-pbx', 'dp_panel_pbx');

    // ── PBX Panel UI ──────────────────────────────────────────────
    const pbxPanel = initPbxPanel('pbx-body');

    // Botones del header (solo visibles en mobile — workspace.css)
    document.getElementById('btn-open-wa')?.addEventListener('click',  () => panelWA?.toggle());
    document.getElementById('btn-open-pbx')?.addEventListener('click', () => panelPBX?.toggle());

    // ── Autocomplete teléfono ─────────────────────────────────────
    const telInput    = document.getElementById('clienteTelefono');
    const telDropdown = document.getElementById('tel-dropdown');
    let   telTimer    = null;

    telInput.addEventListener('input', () => {
        clearTimeout(telTimer);
        const q = telInput.value.replace(/\D/g, '');
        if (q.length < 4) { telDropdown.style.display = 'none'; return; }
        telTimer = setTimeout(async () => {
            const results = await buscarClientes(q);
            if (!results.length) { telDropdown.style.display = 'none'; return; }
            telDropdown.innerHTML = results.map(c => `
                <div class="tel-dropdown-item" data-tel="${c.telefono}">
                    <span class="tel-item-nombre">${c.nombre}</span>
                    <span class="tel-item-tel">${c.telefono}</span>
                </div>`).join('');
            telDropdown.style.display = 'block';
        }, 300);
    });

    let _clienteDirs = [];

    function _aplicarDireccion(d) {
        const sedeBtn = document.querySelector(`.sede-btn[data-sede="${d.sede_id}"]`);
        sedeBtn?.click();
        document.querySelector('.entrega-btn[data-tipo="domicilio"]')?.click();
        document.getElementById('clienteDireccion').value = d.direccion || '';
        if (d.barrio) {
            setTimeout(() => {
                document.getElementById('barrioInput').value = d.barrio;
                window.actualizarPrecioDomicilio?.();
            }, 50);
        }
    }

    document.getElementById('dir-chips').addEventListener('click', e => {
        const chip = e.target.closest('.dir-chip');
        if (!chip) return;
        document.querySelectorAll('#dir-chips .dir-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        const d = _clienteDirs[parseInt(chip.dataset.idx)];
        if (d) _aplicarDireccion(d);
    });

    telDropdown.addEventListener('click', async e => {
        const item = e.target.closest('.tel-dropdown-item');
        if (!item) return;
        const tel = item.dataset.tel;
        telInput.value = tel;
        telDropdown.style.display = 'none';

        const cliente = await cargarCliente(tel);
        if (!cliente) return;

        document.getElementById('clienteNombre').value = cliente.nombre || '';

        _clienteDirs = cliente.direcciones_cliente || [];
        const chipsEl = document.getElementById('dir-chips');

        if (!_clienteDirs.length) {
            chipsEl.style.display = 'none';
            chipsEl.innerHTML = '';
            return;
        }

        chipsEl.innerHTML = _clienteDirs.map((d, i) =>
            `<button type="button" class="dir-chip${i === 0 ? ' active' : ''}" data-idx="${i}">${d.predeterminada ? '★ ' : ''}${d.direccion}${d.barrio ? ' · ' + d.barrio : ''}</button>`
        ).join('');
        chipsEl.style.display = 'flex';

        _aplicarDireccion(_clienteDirs[0]);
    });

    document.addEventListener('click', e => {
        if (!e.target.closest('.tel-wrap')) telDropdown.style.display = 'none';
    });
    window.domicilios = domicilios;
    window.mostrarOverlay  = mostrarOverlay;
    window.actualizarOverlay = actualizarOverlay;
    window.ocultarOverlay  = ocultarOverlay;

    mostrarSkeleton('pedidos');

    document.getElementById("btn-logout").addEventListener("click", async () => {
        if (confirm("¿Cerrar sesión?")) {
            await supabase.auth.signOut();
            window.location.href = "../index.html";
        }
    });

    let asesorActual = "";

    // ── TOGGLE PAGO ───────────────────────────────────────────────
    document.querySelectorAll(".pago-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".pago-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
        });
    });

    // ── TOGGLE CANAL ──────────────────────────────────────────────
    document.querySelectorAll(".canal-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".canal-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
        });
    });

    // ── TOGGLE SEDE ───────────────────────────────────────────────
    document.querySelectorAll(".sede-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".sede-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            // Poblar datalist de barrios para esta sede
            const barrios  = window.domicilios?.[btn.dataset.sede] || {};
            const datalist = document.getElementById('barrios-list');
            datalist.innerHTML = Object.keys(barrios).map(b => `<option value="${b}">`).join('');
            document.getElementById('barrioInput').value = '';
            document.getElementById('domicilio-precio').textContent = '';
            actualizarBarrioField();
            window.actualizarTotalCheckout?.();
        });
    });

    // ── TOGGLE ENTREGA ────────────────────────────────────────────
    document.querySelectorAll('.entrega-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.entrega-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const esDomicilio = btn.dataset.tipo === 'domicilio';
            document.getElementById('direccion-section').style.display = esDomicilio ? 'block' : 'none';
            if (!esDomicilio) {
                document.getElementById('clienteDireccion').value = '';
                document.getElementById('barrioInput').value = '';
                document.getElementById('domicilio-precio').textContent = '';
            }
            actualizarBarrioField();
            window.actualizarTotalCheckout?.();
        });
    });

    function actualizarBarrioField() {
        const sede   = document.querySelector('.sede-btn.active')?.dataset.sede || '';
        const tipo   = document.querySelector('.entrega-btn.active')?.dataset.tipo || 'domicilio';
        const barrios = window.domicilios?.[sede] || {};
        const barrioField = document.getElementById('barrio-field');
        barrioField.style.display = (tipo === 'domicilio' && Object.keys(barrios).length > 0) ? 'flex' : 'none';
    }

    window.actualizarPrecioDomicilio = () => {
        const sede   = document.querySelector('.sede-btn.active')?.dataset.sede || '';
        const barrio = document.getElementById('barrioInput').value;
        const valor  = window.domicilios?.[sede]?.[barrio];
        document.getElementById('domicilio-precio').textContent = valor ? `$${valor.toLocaleString()}` : '';
        window.actualizarTotalCheckout?.();
    };

    async function obtenerUsuarioCC() {
        if (window.parent !== window && window.parent._usuarioCCPromise) {
            return await window.parent._usuarioCCPromise;
        }
        // Fallback: acceso directo sin shell
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) return null;
        const { data } = await supabase.from('usuarios').select('*').eq('id', user.id).single();
        if (!data) return null;
        return { uid: user.id, email: user.email, username: data.username || "", sede: data.sede || "", rol: data.rol || "" };
    }

    (async () => {
        try {
            const usuario = await obtenerUsuarioCC();
            if (!usuario?.rol) { window.top.location.href = "../index.html"; return; }
            asesorActual = usuario.username;
            window.asesorActual = asesorActual;
            document.getElementById("username").textContent = `Hola ${asesorActual}`;
        } catch (err) {
            console.error("Error cargando usuario:", err);
        }
        ocultarSkeleton('contenido-principal');
        document.body.classList.add('loaded');
    })();

    // ── Estado SIP desde el shell padre ──────────────────────────────────────
    const SIP_LABELS = { registered: 'Registrado', incall: 'En llamada', ringing: 'Llamada entrante', offline: 'Desconectado' };

    window.addEventListener('message', (e) => {
        if (!e.data || e.data.type !== 'sip-state') return;
        const { state, extension, username, callerNumber, remoteUser } = e.data;
        const dotEl   = document.getElementById('sip-dot-hdr');
        const stripEl = document.getElementById('strip-pbx');
        if (!dotEl) return;
        dotEl.style.display = 'block';
        // Dot: solo ringing/incall se manejan aquí — registered/offline los controla pbxPanel (según queue)
        if (state === 'ringing' || state === 'incall') dotEl.className = state;
        // Animación botón strip
        stripEl?.classList.remove('sip-ringing', 'sip-incall');
        if (state === 'ringing') stripEl?.classList.add('sip-ringing');
        if (state === 'incall')  stripEl?.classList.add('sip-incall');
        // Popover
        document.getElementById('sip-pop-estado').textContent = SIP_LABELS[state] || state;
        document.getElementById('sip-pop-ext').textContent    = extension || '—';
        // PBX Panel UI
        pbxPanel?.update(state, { extension, username, callerNumber, remoteUser });
    });

    // Botón reconectar → notifica al shell
    document.getElementById('btn-sip-reconectar').addEventListener('click', (e) => {
        e.stopPropagation();
        if (window.parent !== window) window.parent.postMessage({ type: 'sip-reconnect' }, '*');
    });

    // Avisar al shell que el frame está listo para recibir el estado actual
    initNavButtons('pedidos');
    if (window.parent !== window) window.parent.postMessage({ type: 'frame-ready' }, '*');

    // ── Asesores conectados ───────────────────────────────────────────────────
    let panelAgentsExpanded = false;

    document.getElementById('panel-agents-toggle').addEventListener('click', () => {
        panelAgentsExpanded = !panelAgentsExpanded;
        document.getElementById('panel-agents-list').style.display = panelAgentsExpanded ? '' : 'none';
        document.querySelector('.panel-agents-arrow').classList.toggle('expanded', panelAgentsExpanded);
    });

    function chipInitials(name) {
        if (!name) return '?';
        return name.trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
    }

    function fmtChipDur(secs) {
        const m = Math.floor(secs / 60);
        const s = String(secs % 60).padStart(2, '0');
        return `${m}:${s}`;
    }

    function buildChipsHTML(visibles) {
        return visibles.map(a => {
            const name = a.username || ('Ext. ' + a.extension);
            let cls, label;
            if (a.in_call)              { cls = 'chip-incall'; label = 'En llamada'; }
            else if (a.queue_connected) { cls = 'chip-queue';  label = 'Disponible'; }
            else if (a.sip_registered)  { cls = 'chip-paused'; label = 'Pausado'; }
            else                        { cls = 'chip-offline'; label = 'Desconectado'; }
            const timerSpan = a.in_call && a.hora_inicio
                ? `<span class="chip-timer" data-chip-inicio="${new Date(a.hora_inicio).getTime()}">${fmtChipDur(Math.floor((Date.now() - new Date(a.hora_inicio).getTime()) / 1000))}</span>`
                : '';
            return `<div class="agent-chip ${cls}">
                <div class="chip-avatar">${chipInitials(a.username)}</div>
                <div class="chip-info">
                    <span class="chip-name">${name}</span>
                    <span class="chip-status">${label}${timerSpan}</span>
                </div>
            </div>`;
        }).join('');
    }

    setInterval(() => {
        document.querySelectorAll('[data-chip-inicio]').forEach(el => {
            const t = parseInt(el.dataset.chipInicio, 10);
            if (!isNaN(t)) el.textContent = fmtChipDur(Math.floor((Date.now() - t) / 1000));
        });
    }, 1000);

    function setAgentsBadge(count) {
        const el = document.getElementById('agents-badge-mobile');
        if (!el) return;
        el.textContent = count;
        el.style.display = count > 0 ? 'flex' : 'none';
    }

    async function loadAgentStrip() {
        try {
            const r = await fetch(`${PBX_URL}/pbx/agents/status`);
            if (!r.ok) return;
            const agents   = await r.json();
            const visibles = agents.filter(a => a.queue_connected || a.in_call);
            setAgentsBadge(visibles.length);

            // Strip en columna de categorías (desktop)
            const agentsStrip = document.getElementById('agents-strip');
            if (agentsStrip) {
                agentsStrip.style.display = visibles.length ? '' : 'none';
                agentsStrip.innerHTML = buildChipsHTML(visibles);
            }

            // Sección dentro del panel PBX (mobile)
            const panelAgents = document.getElementById('panel-agents');
            const panelList   = document.getElementById('panel-agents-list');
            const panelCount  = document.getElementById('panel-agents-count');
            if (panelAgents) {
                panelAgents.style.display = visibles.length ? '' : 'none';
                if (panelCount) panelCount.textContent = visibles.length;
                if (panelList)  panelList.innerHTML    = buildChipsHTML(visibles);
            }
        } catch { /* sin red */ }
    }

    loadAgentStrip();
    setInterval(loadAgentStrip, 10000);

    // WS para refrescar el strip en tiempo real
    (function initStripWs() {
        const ws = new WebSocket(WS_URL);
        ws.onopen = () => loadAgentStrip();
        ws.onmessage = e => {
            try {
                const { tipo } = JSON.parse(e.data);
                if (tipo === 'pbx:llamada' || tipo === 'pbx:sesion') loadAgentStrip();
            } catch {}
        };
        ws.onclose = () => setTimeout(initStripWs, 5000);
    })();

    window.enviarAFirebase = async (datosPedido) => {
        const { data: nPedido, error: rpcError } = await supabase.rpc('siguiente_n_pedido_callcenter');
        if (rpcError) throw new Error('Error obteniendo número de pedido: ' + rpcError.message);

        const esReserva = datosPedido.tipo === 'reserva';
        const fila = {
            n_pedido:  nPedido,
            nombre:    datosPedido.nombre,
            telefono:  datosPedido.telefono,
            sede:      datosPedido.sede,
            obs:       datosPedido.obs ?? '',
            asesor:    asesorActual,
            canal:     datosPedido.canal,
            impreso:   false,
            estado:    'pendiente',
            fecha:     new Date().toISOString(),
        };

        if (esReserva) {
            fila.tipo              = 'reserva';
            fila.fecha_reserva     = datosPedido.fechaReserva ?? null;
            fila.hora_reserva      = datosPedido.horaReserva ?? null;
            fila.cantidad_personas = datosPedido.cantidadPersonas ?? null;
        } else {
            fila.direccion = datosPedido.direccion ?? '';
            fila.pago      = datosPedido.pago;
            fila.productos = datosPedido.productos;
            fila.total     = datosPedido.total;
            fila.domicilio = datosPedido.domicilio ?? null;
        }

        const { data, error } = await supabase.from('pedidos_callcenter').insert(fila).select('n_pedido').single();
        if (error) throw new Error('Error creando pedido: ' + error.message);

        // Guardar/actualizar cliente en segundo plano
        if (!esReserva) {
            const sede   = document.querySelector('.sede-btn.active')?.dataset.sede;
            const barrio = document.getElementById('barrioInput')?.value;
            upsertCliente({
                telefono:  datosPedido.telefono,
                nombre:    datosPedido.nombre,
                direccion: datosPedido.direccion,
                barrio,
                sedeId:    sede,
            }).catch(() => {});
        }

        return data.n_pedido;
    };
</script>
