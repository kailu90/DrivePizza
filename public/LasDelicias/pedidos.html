<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Las Delicias — Pedidos</title>
    <link rel="icon" type="image/png" href="./Imagenes/Favicon.png">
    <link rel="stylesheet" href="../Estilos/styles.css">
    <link rel="stylesheet" href="./Estilos/theme.css">
    <link rel="stylesheet" href="./Estilos/pedidos.css">
    <style>
        /* ── Drawer mode (cargado desde panaderias-shell con ?drawer) ── */
        .ld-drawer-hdr {
            display: none;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            padding: 0 16px;
            background: var(--ld-marron, #75473B);
            color: var(--ld-beige, #F6EBE0);
            flex-shrink: 0;
            font-family: 'Montserrat', sans-serif;
        }
        .ld-drawer-hdr__title { font-size: 1.5rem; font-weight: 700; }
        .ld-drawer-hdr__close {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--ld-beige, #F6EBE0);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
        }
        .ld-drawer-hdr__close:hover { background: rgba(255,255,255,0.22); }
        .ld-drawer-hdr__close svg { width: 20px; height: 20px; }

        body.drawer-mode { display: flex; flex-direction: column; }
        body.drawer-mode #contenido-principal { flex: 1; min-height: 0; }
        .drawer-mode .ld-drawer-hdr { display: flex; }

        /* ── Vistas del panel central ── */
        #view-catalogo {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        #view-historial,
        #view-barrios,
        #view-clientes {
            display: none;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }
        .ld-hist-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--ld-marron-suave, #a07060);
            font-size: 1.4rem;
            font-weight: 500;
        }
        .ld-hist-empty svg {
            width: 48px; height: 48px;
            opacity: 0.35;
        }
    </style>
</head>
<body>

<!-- Header: inyectado por ldHeader.js en init() -->

<div class="ld-drawer-hdr">
    <span class="ld-drawer-hdr__title">Tomar pedido</span>
    <button id="btn-drawer-close" class="ld-drawer-hdr__close" title="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
    </button>
</div>

<div id="contenido-principal" style="display:none">

    <div class="ld-omni-layout">

        <!-- ═══════════════════════════════════════════════════════
             CENTRO — Catalogo de productos
             ═══════════════════════════════════════════════════════ -->
        <div class="ld-catalogo">

            <!-- VIEW: Catálogo de productos -->
            <div id="view-catalogo">

                <!-- Tabs de categorias horizontales (renderCategorias() las genera) -->
                <div class="ld-tabs-wrap">
                    <div class="ld-tabs" id="catTabs"></div>
                </div>

                <!-- Barra de busqueda (fija, no scrollea) -->
                <div class="ld-search-wrap">
                    <svg class="ld-search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <circle cx="11" cy="11" r="7.5"/>
                        <path stroke-linecap="round" d="m19 19-3.5-3.5"/>
                    </svg>
                    <input type="search" class="ld-search" id="searchInput" placeholder="Buscar producto...">
                </div>

                <!-- Grid de productos (scrolleable) -->
                <div class="ld-catalogo__body">
                    <div class="ld-grid" id="productGrid"></div>
                </div>

            </div><!-- /view-catalogo -->

            <!-- VIEW: Historial de pedidos -->
            <div id="view-historial">
                <div class="ld-hist-empty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 7v5l3 3"/>
                    </svg>
                    Historial de pedidos — próximamente
                </div>
            </div><!-- /view-historial -->

            <!-- VIEW: Barrios -->
            <div id="view-barrios">
                <div class="ld-hist-empty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="m19 19-3.5-3.5"/>
                    </svg>
                    Gestión de barrios — próximamente
                </div>
            </div><!-- /view-barrios -->

            <!-- VIEW: Clientes -->
            <div id="view-clientes">
                <div class="ld-hist-empty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="7" r="3"/>
                        <path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/>
                        <path d="M16 3.13a4 4 0 010 7.75"/>
                        <path d="M21 21v-2a4 4 0 00-3-3.85"/>
                    </svg>
                    Clientes — próximamente
                </div>
            </div><!-- /view-clientes -->

        </div>

        <!-- ═══════════════════════════════════════════════════════
             PANEL DERECHO — Pedido en curso
             ═══════════════════════════════════════════════════════ -->
        <aside class="ld-orden">

            <div class="ld-orden__header">
                <span class="ld-orden__titulo">Pedido</span>
                <button class="ld-btn-vaciar" id="btnVaciar" style="display:none" title="Vaciar carrito">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                        <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM15.5 4l-1-1h-5l-1 1H5v2h14V4z"/>
                    </svg>
                </button>
            </div>

            <div class="ld-orden__items" id="orderItems">
                <p class="ld-orden__empty">No hay productos seleccionados</p>
            </div>

            <div class="ld-orden__footer">
                <div class="ld-total-row">
                    <span>Total:</span>
                    <span id="totalDisplay">$0</span>
                </div>
                <button class="ld-btn-enviar" id="btnCheckout" disabled>Datos de envío</button>
            </div>

        </aside>

    </div><!-- /ld-omni-layout -->
</div><!-- /contenido-principal -->

<!-- ═══════════════════════════════════════════════════════
     Modal — Datos del cliente / envio
     ═══════════════════════════════════════════════════════ -->
<div class="ld-modal-bg" id="modalCheckout">
    <div class="ld-modal">

        <div class="ld-modal__hdr">
            <span class="ld-modal__title">Datos del cliente</span>
            <button class="ld-modal__close" id="btnCancelarCheckout">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <!-- Entrega -->
        <div class="ld-modal__entrega">
            <button class="ld-modal__entrega-btn active" data-tipo="domicilio">
                <svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zm-.5 1.5 1.96 2.5H17V9.5h2.5zM6 18c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm2.22-3c-.55-.61-1.33-1-2.22-1s-1.67.39-2.22 1H3V6h12v9H8.22zM18 18c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
                Domicilio
            </button>
            <button class="ld-modal__entrega-btn" data-tipo="recoger">
                <svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>
                Recoger en tienda
            </button>
        </div>

        <!-- Telefono + Nombre -->
        <div class="ld-modal__row2">
            <input class="ld-modal__input" type="tel"  id="ck-telefono"  placeholder="Teléfono / WhatsApp" autocomplete="off">
            <input class="ld-modal__input" type="text" id="ck-nombre"    placeholder="Nombre cliente"      autocomplete="off">
        </div>

        <!-- Dirección (solo domicilio) -->
        <div id="campos-domicilio-modal">
            <div class="ld-modal__row2">
                <input class="ld-modal__input" type="text" id="ck-direccion" placeholder="Dirección" autocomplete="off">
                <input class="ld-modal__input" type="text" id="ck-barrio"    placeholder="Barrio"     autocomplete="off">
            </div>
        </div>

        <!-- Método de pago -->
        <div class="ld-modal__pago">
            <button class="ld-pago-btn active" data-pago="efectivo">
                <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
                Efectivo
            </button>
            <button class="ld-pago-btn" data-pago="transferencia">
                <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
                Transferencia
            </button>
            <button class="ld-pago-btn" data-pago="tarjeta">
                <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
                Datáfono
            </button>
        </div>

        <!-- Observaciones -->
        <textarea class="ld-modal__obs" id="ck-obs" placeholder="Observaciones..."></textarea>

        <!-- Resumen -->
        <div class="ld-modal__resumen">
            <div class="ld-modal__resumen-row">
                <span>Productos</span>
                <span id="modal-subtotal">$0</span>
            </div>
            <div class="ld-modal__resumen-row ld-modal__resumen-row--total">
                <span>Total</span>
                <span id="modal-total">$0</span>
            </div>
        </div>

        <p class="ld-modal-error" id="ck-error"></p>

        <button class="ld-btn-confirmar" id="btnConfirmar">Confirmar pedido</button>

    </div>
</div>

<script type="module" src="./pedidos.js"></script>
</body>
</html>
