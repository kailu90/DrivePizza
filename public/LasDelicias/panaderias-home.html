<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Las Delicias — Panaderias</title>
    <link rel="icon" type="image/png" href="./Imagenes/Favicon.png">
    <link rel="stylesheet" href="../Estilos/styles.css">
    <link rel="stylesheet" href="./Estilos/theme.css">
    <link rel="stylesheet" href="./Estilos/header.css">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background: var(--ld-beige, #F6EBE0);
        }
        body { display: flex; flex-direction: column; }

        #contenido-principal {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        /* ── Home / Cards ──────────────────────────────────────── */
        .pan-home {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.6rem;
            padding: 2.4rem 2rem;
        }

        .pan-home__title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--ld-marron, #75473B);
            margin: 0;
        }

        .pan-home__cards {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 240px);
            gap: 1.4rem;
            align-content: center;
            justify-content: center;
            width: 100%;
        }

        .pan-home__card {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 1.4rem;
            padding: 0 2rem;
            width: 240px;
            height: 88px;
            border-radius: 14px;
            background: var(--ld-beige, #F6EBE0);
            border: 1.5px solid rgba(117,71,59,0.18);
            box-shadow: 0 2px 10px rgba(117,71,59,0.07);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
            font-family: 'Montserrat', sans-serif;
        }

        .pan-home__card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(117,71,59,0.14);
            border-color: var(--ld-marron, #75473B);
        }

        .pan-home__card-ico {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--ld-marron, #75473B);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--ld-beige, #F6EBE0);
        }
        .pan-home__card-ico svg { width: 22px; height: 22px; }

        .pan-home__card-label {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--ld-marron, #75473B);
            text-align: left;
            line-height: 1.3;
        }

        @media (max-width: 540px) {
            .pan-home__cards { grid-template-columns: 1fr; width: 240px; }
            .pan-home__title { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<div id="contenido-principal" style="display:none;">
    <main class="pan-home">
        <h1 class="pan-home__title">Que deseas gestionar hoy?</h1>
        <div class="pan-home__cards">
            <button class="pan-home__card" data-nav="pedidos">
                <div class="pan-home__card-ico">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
                        <rect x="9" y="3" width="6" height="4" rx="1"/>
                        <path d="M9 12h6M9 16h4"/>
                    </svg>
                </div>
                <span class="pan-home__card-label">Pedidos</span>
            </button>
            <button class="pan-home__card" data-nav="historial">
                <div class="pan-home__card-ico">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 7v5l3 3"/>
                    </svg>
                </div>
                <span class="pan-home__card-label">Historial</span>
            </button>
        </div>
    </main>
</div>

<script type="module" src="./panaderias-home.js"></script>
</body>
</html>
