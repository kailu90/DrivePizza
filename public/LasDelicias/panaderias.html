<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Las Delicias — Panadería</title>
    <link rel="icon" type="image/png" href="./Imagenes/Favicon.png">
    <link rel="stylesheet" href="../Estilos/styles.css">
    <link rel="stylesheet" href="./Estilos/theme.css">
    <link rel="stylesheet" href="./Estilos/header.css">
    <link rel="stylesheet" href="./Estilos/panaderias.css">
</head>
<body>

<div id="contenido-principal" style="display:none;">

    <!-- Header: inyectado por ldHeader.js en init() -->

    <!-- ── KPIs ─────────────────────────────────────────── -->
    <div class="pan-kpis">
        <div class="pan-kpi">
            <div class="pan-kpi__icon pan-kpi__icon--blue">📋</div>
            <div>
                <div class="pan-kpi__value" id="kpi-total">—</div>
                <div class="pan-kpi__label">Total hoy</div>
            </div>
        </div>
        <div class="pan-kpi">
            <div class="pan-kpi__icon pan-kpi__icon--green">✅</div>
            <div>
                <div class="pan-kpi__value" id="kpi-entregados">—</div>
                <div class="pan-kpi__label">Entregados</div>
            </div>
        </div>
        <div class="pan-kpi">
            <div class="pan-kpi__icon pan-kpi__icon--red">❌</div>
            <div>
                <div class="pan-kpi__value" id="kpi-cancelados">—</div>
                <div class="pan-kpi__label">Cancelados</div>
            </div>
        </div>
    </div>

    <!-- ── Kanban ────────────────────────────────────────── -->
    <div class="pan-kanban">
        <div class="pan-col">
            <div class="pan-col__hdr pan-col__hdr--recibido">
                Recibido
                <span class="pan-col__count" id="cnt-recibido">0</span>
            </div>
            <div class="pan-col__items" id="col-recibido">
                <div class="pan-col__empty">Sin pedidos</div>
            </div>
        </div>
        <div class="pan-col">
            <div class="pan-col__hdr pan-col__hdr--preparacion">
                En preparación
                <span class="pan-col__count" id="cnt-preparacion">0</span>
            </div>
            <div class="pan-col__items" id="col-preparacion">
                <div class="pan-col__empty">Sin pedidos</div>
            </div>
        </div>
        <div class="pan-col">
            <div class="pan-col__hdr pan-col__hdr--despachado">
                Despachado
                <span class="pan-col__count" id="cnt-despachado">0</span>
            </div>
            <div class="pan-col__items" id="col-despachado">
                <div class="pan-col__empty">Sin pedidos</div>
            </div>
        </div>
    </div>

</div><!-- /contenido-principal -->

<!-- ── Modal detalle ─────────────────────────────────────── -->
<div class="pan-modal-bg" id="panModal">
    <div class="pan-modal">
        <div class="pan-modal__hdr">
            <span class="pan-modal__num" id="mod-num"></span>
            <button class="pan-modal__close" id="mod-close">&times;</button>
        </div>
        <span class="pan-modal__badge" id="mod-badge"></span>
        <div class="pan-modal__section">
            <div class="pan-modal__label">Cliente</div>
            <div id="mod-nombre"></div>
        </div>
        <div class="pan-modal__section" id="mod-dir-wrap">
            <div class="pan-modal__label">Dirección</div>
            <div id="mod-direccion"></div>
        </div>
        <div class="pan-modal__section">
            <div class="pan-modal__label">Pago</div>
            <div id="mod-pago"></div>
        </div>
        <div class="pan-modal__section">
            <div class="pan-modal__label">Hora</div>
            <div id="mod-fecha"></div>
        </div>
        <div class="pan-modal__section">
            <div class="pan-modal__label">Productos</div>
            <ul class="pan-modal__prods" id="mod-prods"></ul>
        </div>
        <div class="pan-modal__total">
            <span>Total</span>
            <span id="mod-total"></span>
        </div>
        <div class="pan-modal__obs" id="mod-obs" style="display:none;"></div>
        <button class="pan-modal__action" id="mod-action" style="display:none;"></button>
    </div>
</div>

<script type="module" src="./panaderias.js"></script>
</body>
</html>
