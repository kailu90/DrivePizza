<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Las Delicias — Panaderías</title>
    <link rel="icon" type="image/png" href="./Imagenes/Favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./Estilos/header.css">
    <link rel="stylesheet" href="./Estilos/theme.css">
    <link rel="prefetch" href="./panaderias-home.html">
    <link rel="prefetch" href="./panaderias.html">
    <link rel="prefetch" href="./historial.html">
    <style>
        html { font-size: 62.5%; }   /* 1rem = 10px */
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

        /* ── WA Panel collapsible (strip 44px ↔ expanded 320px ↔ chat 620px) ── */
        #wa-panel {
            position: fixed;
            top: 64px; left: 0; bottom: 0;
            width: 420px;
            display: flex; flex-direction: row;
            overflow: hidden;
            transform: translateX(-376px);   /* shows 44px strip */
            transition: transform 260ms ease, width 200ms ease;
            z-index: 1200;
        }
        #wa-panel.expanded          { transform: translateX(0); }

        /* Left column: 420px, always present */
        .wa-panel__left {
            width: 420px; flex-shrink: 0;
            display: flex; flex-direction: column;
            background: var(--ld-beige, #F6EBE0);
            border-right: 1px solid rgba(117,71,59,0.15);
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        /* Panel header (brown bar) */
        .wa-panel__hdr {
            display: flex; align-items: center;
            height: 52px; flex-shrink: 0;
            background: var(--ld-marron, #75473B);
        }

        /* Strip toggle button */
        #wa-strip {
            width: 52px; height: 52px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--ld-marron, #75473B);
            border: none; cursor: pointer;
            color: var(--ld-beige, #F6EBE0);
            position: relative;
        }
        #wa-strip svg { width: 20px; height: 20px; }

        /* Badge de no leídos */
        #wa-badge {
            position: absolute; top: 8px; right: 8px;
            background: #ef4444; color: #fff;
            font-size: 1rem; font-weight: 700;
            border-radius: 8px; min-width: 16px; height: 16px;
            padding: 0 3px; display: none;
            align-items: center; justify-content: center;
            line-height: 1; font-family: sans-serif;
        }
        #wa-badge.visible { display: flex; }

        /* Title (only visible when expanded) */
        .wa-panel__title {
            display: flex; align-items: center;
            flex: 1; padding: 0 6px 0 14px; overflow: hidden;
        }
        .wa-panel__label {
            font-size: 1.3rem; font-weight: 700;
            color: var(--ld-beige, #F6EBE0);
            letter-spacing: 0.03em;
            white-space: nowrap;
        }

        /* Body hidden when collapsed */
        #wa-panel:not(.expanded) #wa-body { display: none; }

        #wa-body {
            flex: 1; overflow: hidden; min-height: 0;
            display: flex; flex-direction: column;
        }

        /* Chips */
        .wa-sb__chips {
            display: flex; gap: 6px; padding: 10px 10px 8px;
            border-bottom: 1px solid rgba(117,71,59,0.12);
            flex-shrink: 0;
        }
        .wa-sb__chip {
            flex: 1; padding: 5px 6px; border-radius: 20px;
            border: 1.5px solid rgba(117,71,59,0.3);
            background: none;
            font-size: 1.1rem; font-family: 'Montserrat', sans-serif;
            color: var(--ld-marron, #75473B);
            cursor: pointer; transition: all 0.15s;
            font-weight: 500;
        }
        .wa-sb__chip:hover { background: rgba(117,71,59,0.08); }
        .wa-sb__chip.active {
            background: var(--ld-marron, #75473B);
            border-color: var(--ld-marron, #75473B);
            color: var(--ld-beige, #F6EBE0);
            font-weight: 600;
        }

        /* Lista */
        .wa-sb__list { flex: 1; overflow-y: auto; }
        .wa-sb__list::-webkit-scrollbar { width: 4px; }
        .wa-sb__list::-webkit-scrollbar-track { background: transparent; }
        .wa-sb__list::-webkit-scrollbar-thumb { background: rgba(117,71,59,0.2); border-radius: 4px; }

        /* ── Content frame ── */
        #pan-wrap {
            position: fixed;
            top: 64px; left: 44px; right: 0; bottom: 0;
            overflow: hidden;
        }
        #pan-wrap.wa-panel-off { left: 0 !important; }

        #pan-frame {
            position: absolute; inset: 0;
            width: 100%; height: 100%; border: none; display: block;
        }

        /* ── Drawer "Tomar pedido" ── */
        #pedido-bg {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.3); z-index: 7000;
        }
        #pedido-bg.open { display: block; }
        #pedido-drawer {
            position: fixed; top: 64px; right: 0; bottom: 0;
            width: calc(100% - 44px);
            transform: translateX(100%);
            transition: transform 300ms ease;
            z-index: 7001;
            display: flex; flex-direction: column;
            box-shadow: -6px 0 32px rgba(0,0,0,0.18);
        }
        #pedido-drawer.open { transform: translateX(0); }
        #pedido-frame { flex: 1; border: none; min-height: 0; display: block; }

        @media (max-width: 700px) {
            #wa-panel  { display: none; }
            #pan-wrap  { left: 0 !important; }
            #pedido-drawer { width: 100%; top: 0; }
        }

        /* ── Banner nueva versión ── */
        #banner-nueva-version {
            display: none;
            position: fixed; top: 0; left: 0; right: 0;
            background: #f5c518; color: #3a2a00;
            padding: 10px 20px; text-align: center;
            font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 600;
            z-index: 99999; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        #banner-nueva-version button {
            margin-left: 16px; background: #3a2a00; color: #f5c518;
            border: none; border-radius: 6px;
            padding: 4px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
        }
        #banner-nueva-version button:hover { background: #1a1200; }

        /* ── Modal Próximamente ── */
        #modal-proximamente {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 9000;
            align-items: center;
            justify-content: center;
        }
        #modal-proximamente.open { display: flex; }
        .proxim__card {
            background: #fff;
            border-radius: 16px;
            padding: 36px 40px 28px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            min-width: 260px;
            font-family: 'Montserrat', sans-serif;
            animation: proxim-in .2s ease;
        }
        @keyframes proxim-in { from{opacity:0;transform:scale(.92)} to{opacity:1;transform:scale(1)} }
        .proxim__title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--ld-marron, #75473B);
            margin: 0 0 8px;
        }
        .proxim__text {
            font-size: 1.3rem;
            color: var(--ld-marron-suave, #a07060);
            font-weight: 500;
            margin: 0 0 24px;
            letter-spacing: 0.04em;
        }
        .proxim__btn {
            background: var(--ld-marron, #75473B);
            color: var(--ld-beige, #F6EBE0);
            border: none;
            border-radius: 10px;
            padding: 10px 28px;
            font-size: 1.3rem;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: background 0.15s;
        }
        .proxim__btn:hover { background: var(--ld-marron-oscuro, #4e2e24); }

        /* ── Nav overlay ── */
        #nav-overlay {
            display: none;
            position: fixed; inset: 0;
            background: var(--ld-beige, #F6EBE0);
            z-index: 8000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #nav-overlay.visible { display: flex; }
        .nav-logo { width: 220px; animation: nav-logo-in .5s .1s ease both; }
        @keyframes nav-logo-in { from{opacity:0;transform:scale(.88)} to{opacity:1;transform:scale(1)} }
    </style>
</head>
<body>

<div id="banner-nueva-version">
    Hay una nueva version disponible.
    <button onclick="location.reload()">Recargar ahora</button>
</div>

<!-- WA Panel collapsible -->
<div id="wa-panel">
    <div class="wa-panel__left">
        <div class="wa-panel__hdr">
                <!-- Title (visible when expanded) -->
            <div class="wa-panel__title">
                <span class="wa-panel__label">WhatsApp</span>
            </div>
            <!-- Toggle: siempre visible en la esquina derecha (60px) -->
            <button id="wa-strip" title="WhatsApp">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
                    <path d="M12 0C5.373 0 0 5.373 0 12c0 2.124.558 4.118 1.531 5.845L.057 23.448a.75.75 0 0 0 .92.921l5.684-1.481A11.945 11.945 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.907 0-3.686-.524-5.208-1.433l-.374-.222-3.876 1.009 1.028-3.758-.244-.389A9.956 9.956 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
                </svg>
                <span id="wa-badge"></span>
            </button>
        </div>
        <div id="wa-body"></div>
    </div>
    <!-- #ldwap-chat-col injected here by waPanel.js -->
</div>

<!-- Content frame -->
<div id="pan-wrap">
    <iframe id="pan-frame" src="./panaderias-home.html"></iframe>
</div>

<!-- Drawer: Tomar pedido -->
<div id="pedido-bg"></div>
<div id="pedido-drawer">
    <iframe id="pedido-frame"></iframe>
</div>

<!-- Modal Próximamente -->
<div id="modal-proximamente">
    <div class="proxim__card">
        <p class="proxim__title" id="proxim-nombre"></p>
        <p class="proxim__text">Próximamente</p>
        <button class="proxim__btn" id="proxim-cerrar">Entendido</button>
    </div>
</div>

<div id="nav-overlay" class="visible">
    <img src="./Imagenes/Logo.png" class="nav-logo" alt="Las Delicias">
</div>

<script type="module">
    import { supabase }                          from './supabaseConfig.js'
    import { mountHeader, setHeaderUser, setHeaderMode } from './Shared/ldHeader.js'
    import { WS_URL }                            from '../Api/config.js'

    // ── Overlay ───────────────────────────────────────────────────────────────
    const _overlay = document.getElementById('nav-overlay')
    const MIN_OVERLAY_MS = 300
    let _overlayShownAt   = performance.now()
    let _overlayFallback  = null
    let _overlayHideTimer = null

    function showOverlay() {
        clearTimeout(_overlayHideTimer)
        _overlayHideTimer = null
        _overlayShownAt = performance.now()
        _overlay.classList.add('visible')
        clearTimeout(_overlayFallback)
        _overlayFallback = setTimeout(() => hideOverlay(), 3000)
    }

    function hideOverlay() {
        clearTimeout(_overlayFallback)
        clearTimeout(_overlayHideTimer)
        _overlayFallback = null
        const elapsed = performance.now() - _overlayShownAt
        const wait = Math.max(0, MIN_OVERLAY_MS - elapsed)
        _overlayHideTimer = setTimeout(() => {
            _overlayHideTimer = null
            _overlay.classList.remove('visible')
        }, wait)
    }
    _overlayFallback = setTimeout(() => hideOverlay(), 3000)

    // ── Frame nav ─────────────────────────────────────────────────────────────
    const _frame  = document.getElementById('pan-frame')
    const _waPanel = document.getElementById('wa-panel')
    const _panWrap = document.getElementById('pan-wrap')

    function _listenForFrameNav(frame) {
        try {
            frame.contentWindow?.addEventListener('pagehide', () => showOverlay(), { once: true })
        } catch(e) {}
    }

    _frame.addEventListener('load', () => {
        hideOverlay()
        _listenForFrameNav(_frame)
    })

    const PAGE_SRC = {
        home:    './panaderias-home.html',
        pedidos: './pedidos.html',
    }

    // ── Modal Próximamente ────────────────────────────────────────────────────
    const _modalProxim = document.getElementById('modal-proximamente')
    document.getElementById('proxim-cerrar').addEventListener('click', () => _modalProxim.classList.remove('open'))
    _modalProxim.addEventListener('click', e => { if (e.target === _modalProxim) _modalProxim.classList.remove('open') })

    function showProximamente(nombre) {
        document.getElementById('proxim-nombre').textContent = nombre
        _modalProxim.classList.add('open')
    }

    let _currentPage = null  // página actualmente cargada en #pan-frame

    function _navTo(page) {
        // Vistas internas de pedidos.html
        const PEDIDOS_VIEWS = { historial: 1, barrios: 1, clientes: 1 }

        // Si pedidos ya está cargado, cambiar la vista interna sin recargar
        if (_currentPage === 'pedidos') {
            if (PEDIDOS_VIEWS[page]) {
                _frame.contentWindow?.postMessage({ type: 'switch-view', view: page }, '*')
                return
            }
            if (page === 'pedidos') {
                _frame.contentWindow?.postMessage({ type: 'switch-view', view: 'catalogo' }, '*')
                return
            }
        }

        // Vista interna pedida desde fuera de pedidos → cargar pedidos con ?view=
        const isPedidosView = !!PEDIDOS_VIEWS[page]
        const targetPage    = isPedidosView ? 'pedidos' : page
        const src           = isPedidosView ? `./pedidos.html?view=${page}` : PAGE_SRC[page]
        if (!src) return

        _currentPage = targetPage
        setHeaderMode(targetPage === 'home' ? 'home' : 'full')

        _setWaVisible(targetPage !== 'home')
        showOverlay()
        _frame.src = src
    }

    // ── WA Panel: show/hide y toggle ─────────────────────────────────────────
    function _setWaVisible(show) {
        if (!show) {
            _waPanel.classList.remove('expanded')
            _waPanel.style.display = 'none'
            _panWrap.classList.add('wa-panel-off')
        } else {
            _waPanel.style.display = ''
            _panWrap.classList.remove('wa-panel-off')
        }
    }

    document.getElementById('wa-strip').addEventListener('click', () => {
        _waPanel.classList.toggle('expanded')
    })

    // ── Drawer "Tomar pedido" ─────────────────────────────────────────────────
    let _pedidoDrawerReady = false

    function openPedidoDrawer() {
        const frame = document.getElementById('pedido-frame')
        if (!_pedidoDrawerReady) {
            _pedidoDrawerReady = true
            frame.src = './pedidos.html?drawer=1'
        }
        document.getElementById('pedido-bg').classList.add('open')
        document.getElementById('pedido-drawer').classList.add('open')
    }

    function closePedidoDrawer() {
        document.getElementById('pedido-bg').classList.remove('open')
        document.getElementById('pedido-drawer').classList.remove('open')
    }

    document.getElementById('pedido-bg').addEventListener('click', closePedidoDrawer)

    // ── postMessage desde iframes ─────────────────────────────────────────────
    window.addEventListener('message', (e) => {
        if (e.data?.type === 'logout') {
            window.location.href = './index.html'
            return
        }
        if (e.data?.type === 'nav-switch')        _navTo(e.data.page)
        if (e.data?.type === 'tomar-pedido-open')  openPedidoDrawer()
        if (e.data?.type === 'tomar-pedido-close') closePedidoDrawer()
        if (e.data?.type === 'wa-visible')         _setWaVisible(e.data.show !== false)
    })

    // ── WS backend (nueva versión) ────────────────────────────────────────────
    let _wsRetry = 0
    function initWs() {
        const ws = new WebSocket(WS_URL)
        ws.onopen  = () => { _wsRetry = 0 }
        ws.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data)
                if (msg.tipo === 'nueva-version') {
                    const s = msg.scope
                    if (!s || s === 'all' || s === 'lasdelicias') {
                        document.getElementById('banner-nueva-version').style.display = 'block'
                    }
                }
            } catch {}
        }
        ws.onclose = () => {
            const delay = Math.min(1000 * 2 ** _wsRetry, 30_000)
            _wsRetry++
            setTimeout(initWs, delay)
        }
    }
    initWs()

    // ── Auth ──────────────────────────────────────────────────────────────────
    ;(async () => {
        const { data: { user } } = await supabase.auth.getUser()
        if (!user) { window.location.href = './index.html'; return }

        const { data: { session } } = await supabase.auth.getSession()

        try {
            const { data, error } = await supabase.from('usuarios')
                .select('rol, active, username, sede').eq('id', user.id).single()
            const ROLES_VALIDOS = ['panaderias', 'panaderias-admin', 'admin']
            if (error || !data || !data.active || !ROLES_VALIDOS.includes(data.rol)) {
                window.location.href = './index.html'
                return
            }

            _currentPage = 'home'
            mountHeader({
                navLabel: 'Panaderías',
                navSections: [
                    { label: 'Panaderías', active: true, description: 'Panadería y pastelería' },
                    { label: 'Ghema',     description: 'Próximamente', onClick: () => showProximamente('Ghema')     },
                    { label: 'Figuettos', description: 'Próximamente', onClick: () => showProximamente('Figuettos') },
                ],
                navActions: [
                    { icon: 'search', label: 'Barrios',      onClick: () => _navTo('barrios')   },
                    { icon: 'leaf',   label: 'Historial',    onClick: () => _navTo('historial') },
                    { icon: 'pencil', label: 'Tomar pedido', onClick: () => _navTo('pedidos')   },
                    { icon: 'users',  label: 'Clientes',     onClick: () => _navTo('clientes')  },
                ],
                onHome: () => _navTo('home'),
                onLogout: async () => {
                    if (!confirm('¿Deseas cerrar sesión?')) return
                    await supabase.auth.signOut()
                    window.location.href = './index.html'
                },
            })
            setHeaderUser({ username: data.username || '', sede: data.sede || '' })
            setHeaderMode('home')   // página inicial es el dashboard
            _setWaVisible(false)    // home no muestra el panel omnicanal

            // Inicializar panel WA omnicanal
            const { initWaPanel } = await import('./waPanel.js')
            initWaPanel('wa-body', { rol: data.rol || '', asesor: data.username || '', authToken: session?.access_token || '' })

        } catch (err) {
            console.error('[pan-shell]', err)
            window.location.href = './index.html'
        } finally {
            document.body.classList.add('loaded')
        }
    })()
</script>

</body>
</html>
