<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recepción de Mercancía</title>
    <link rel="stylesheet" href="../Estilos/styles.css">
    <link rel="stylesheet" href="../Estilos/recepcionMercancia.css">
    <link rel="shortcut icon" href="../Imagenes/logo.png" type="image/x-icon">
</head>
<body>

<div class="pw-page-transition" id="pw-page-transition">
    <img class="pw-page-transition-logo" src="../Imagenes/Isotipo.png" alt="Drive Pizza">
    <span class="pw-page-transition-slogan">
        <span class="pw-pts-left">HECHA PARA</span>
        <span class="pw-pts-right">COMPARTIR</span>
    </span>
</div>

<div id="header-container"></div>
<div id="sidebar-container"></div>

<main class="dashboard__main" id="dashboard__main">
    <button class="toggle-btn" id="toggle-btn"><</button>

    <section class="dashboard__section">

        <h2 class="rc-titulo">Recepción de Mercancía</h2>

        <!-- Datos de la factura -->
        <div class="rc-card">
            <div class="rc-header-form">
                <div class="rc-field">
                    <label for="rc-proveedor">Proveedor *</label>
                    <select id="rc-proveedor" class="rc-select">
                        <option value="">Seleccionar proveedor...</option>
                    </select>
                </div>
                <div class="rc-field">
                    <label for="rc-fecha">Fecha *</label>
                    <input type="date" id="rc-fecha" class="rc-input">
                </div>
                <div class="rc-field">
                    <label for="rc-factura">N° Factura</label>
                    <input type="text" id="rc-factura" class="rc-input" placeholder="Opcional">
                </div>
                <div class="rc-field">
                    <label for="rc-metodo">Método de pago *</label>
                    <select id="rc-metodo" class="rc-select">
                        <option value="">Seleccionar...</option>
                        <option value="efectivo">Efectivo</option>
                        <option value="transferencia">Transferencia</option>
                        <option value="tarjeta">Tarjeta de crédito</option>
                        <option value="pendiente">Pendiente</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Productos recibidos -->
        <div class="rc-card">
            <div class="rc-productos-header">
                <span class="rc-card-titulo">Productos recibidos</span>
                <button id="rc-btn-add" class="rc-btn-add">+ Agregar producto</button>
            </div>
            <div class="rc-table-wrap">
                <table class="rc-table">
                    <thead>
                        <tr>
                            <th>PRODUCTO</th>
                            <th>CANTIDAD</th>
                            <th>UNIDAD</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="rc-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- Totales y observaciones -->
        <div class="rc-card">
            <div class="rc-footer-form">
                <div class="rc-field">
                    <label for="rc-valor">Valor total factura ($)</label>
                    <input type="number" id="rc-valor" class="rc-input" placeholder="0" min="0" step="1">
                </div>
                <div class="rc-field">
                    <label for="rc-notas">Observaciones</label>
                    <textarea id="rc-notas" class="rc-textarea" placeholder="Opcional..."></textarea>
                </div>
            </div>
        </div>

        <!-- Acciones -->
        <div class="rc-actions">
            <button id="rc-btn-cancelar" class="rc-btn rc-btn--secondary">Cancelar</button>
            <button id="rc-btn-registrar" class="rc-btn rc-btn--primary">Registrar</button>
        </div>

        <!-- Pagos pendientes -->
        <div class="rc-card rc-pendientes-card" id="rc-pendientes-card" style="display:none">
            <div class="rc-productos-header">
                <span class="rc-card-titulo">
                    Pagos pendientes
                    <span class="rc-pendientes-badge" id="rc-pendientes-badge"></span>
                </span>
            </div>
            <div class="rc-table-wrap">
                <table class="rc-table rc-table--pendientes">
                    <thead>
                        <tr>
                            <th>N°</th>
                            <th>FECHA</th>
                            <th>PROVEEDOR</th>
                            <th>FACTURA</th>
                            <th>VALOR</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="rc-pendientes-tbody"></tbody>
                </table>
            </div>
        </div>

    </section>
</main>

<div id="footer-container"></div>

<datalist id="rc-productos-list"></datalist>

<!-- Dialog: registrar pago -->
<dialog id="rc-dialog-pago" class="rc-dialog-pago">
    <div class="rc-dialog-header">
        <h3 class="rc-dialog-titulo">Registrar pago</h3>
        <button id="rc-dialog-cerrar" class="rc-dialog-cerrar">✕</button>
    </div>
    <div class="rc-dialog-body">
        <p class="rc-dialog-info" id="rc-dialog-info"></p>
        <div class="rc-field">
            <label for="rc-dialog-metodo">Método de pago</label>
            <select id="rc-dialog-metodo" class="rc-select">
                <option value="efectivo">Efectivo</option>
                <option value="transferencia">Transferencia</option>
                <option value="tarjeta">Tarjeta de crédito</option>
            </select>
        </div>
    </div>
    <div class="rc-dialog-actions">
        <button id="rc-dialog-cancelar" class="rc-btn rc-btn--secondary">Cancelar</button>
        <button id="rc-dialog-confirmar" class="rc-btn rc-btn--primary">Confirmar pago</button>
    </div>
</dialog>

<script type="module" src="recepcionMercancia.js"></script>
</body>
</html>
