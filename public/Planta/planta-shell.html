<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planta — DrivePizza</title>
    <link rel="stylesheet" href="../Estilos/styles.css">
    <link rel="stylesheet" href="../Estilos/pedidosPizzeria.css">
    <link rel="shortcut icon" href="../Imagenes/logo.png" type="image/x-icon">
    <style>
        /* ── Sidebar: empieza bajo el header, sin padding de logo ── */
        .sidebar {
            top: 80px !important;
            padding-top: 1.5rem !important;
            padding-bottom: 1.5rem !important;
            width: 240px !important;
        }
        /* ── Main: margen = ancho del sidebar ── */
        .dashboard__main {
            padding: 0 !important;
            overflow: hidden;
            margin-bottom: 0 !important;
            margin-left: 240px;
            margin-top: 80px;
            position: relative;
        }
        .dashboard__main.margin-hidden {
            margin-left: 12px !important;
        }
        /* ── Toggle: centrado en el borde derecho del sidebar (240 - 18) ── */
        .toggle-btn, .inventory-toggle {
            left: 222px !important;
            z-index: 1300 !important;
            width: 36px !important;
            height: 36px !important;
            font-size: 1.2rem !important;
        }
        .toggle-btn.left-hidden {
            left: 0px !important;
        }
        /* ── Nav bar: parte desde el borde del sidebar ── */
        #shell-nav-bar { left: 240px !important; }
        #planta-frame {
            width: 100%;
            height: calc(100vh - 80px - 38px); /* 38px = altura footer fijo */
            border: none;
            display: block;
            background: #f4ecdf;
        }
        /* Barra de progreso — fija debajo del header, a la derecha del sidebar */
        #shell-nav-bar {
            position: fixed;
            top: 80px; /* sobreescrito por JS con altura real del header */
            left: 240px; /* sobreescrito por regla de arriba */
            right: 0;
            height: 3px;
            width: auto;
            background: linear-gradient(90deg, #e67e22, #f39c12);
            z-index: 1200;
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
            transform-origin: left;
            transform: scaleX(0);
        }
        #shell-nav-bar.loading {
            opacity: 1;
            animation: shell-bar-grow 1.8s ease-out forwards;
        }
        #shell-nav-bar.done {
            transform: scaleX(1) !important;
            opacity: 0;
            transition: opacity 0.3s ease 0.15s;
            animation: none;
        }
        @keyframes shell-bar-grow {
            0%   { transform: scaleX(0) }
            40%  { transform: scaleX(0.65) }
            80%  { transform: scaleX(0.85) }
            100% { transform: scaleX(0.92) }
        }
    </style>
</head>
<body>

<div class="pw-page-transition" id="pw-page-transition">
    <img class="pw-page-transition-logo" src="../Imagenes/Isotipo.png" alt="Drive Pizza">
    <span class="pw-page-transition-slogan">
        <span class="pw-pts-left">HECHA PARA</span>
        <span class="pw-pts-right">COMPARTIR</span>
    </span>
</div>

<div id="header-container"></div>
<div id="sidebar-container"></div>

<div id="shell-nav-bar"></div>

<main class="dashboard__main" id="dashboard__main">
    <button class="toggle-btn" id="toggle-btn"><</button>
    <iframe id="planta-frame" src="./dashboard.html" title="Planta"></iframe>
</main>

<div id="footer-container"></div>

<script type="module" src="planta-shell.js"></script>
</body>
</html>
