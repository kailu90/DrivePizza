<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planta — DrivePizza</title>
    <link rel="stylesheet" href="../Estilos/styles.css">
    <link rel="stylesheet" href="../Estilos/pedidosPizzeria.css">
    <link rel="shortcut icon" href="../Imagenes/logo.png" type="image/x-icon">
    <style>
        .dashboard__main {
            padding: 0 !important;
            overflow: hidden;
            margin-bottom: 0 !important;
            position: relative;
        }
        #planta-frame {
            width: 100%;
            height: calc(100vh - 100px);
            border: none;
            display: block;
            background: #fff;
        }
        /* Barra de progreso delgada — reemplaza el overlay de pantalla completa */
        #shell-nav-bar {
            position: absolute;
            top: 0; left: 0;
            height: 3px;
            width: 0%;
            background: linear-gradient(90deg, #e67e22, #f39c12);
            z-index: 200;
            transition: width 0.25s ease, opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }
        #shell-nav-bar.loading {
            opacity: 1;
            animation: shell-bar-grow 1.8s ease-out forwards;
        }
        #shell-nav-bar.done {
            width: 100% !important;
            opacity: 0;
            transition: width 0.15s ease, opacity 0.3s ease 0.15s;
            animation: none;
        }
        @keyframes shell-bar-grow {
            0%   { width: 0% }
            40%  { width: 65% }
            80%  { width: 85% }
            100% { width: 92% }
        }
    </style>
</head>
<body>

<div class="pw-page-transition" id="pw-page-transition">
    <img class="pw-page-transition-logo" src="../Imagenes/Isotipo.png" alt="Drive Pizza">
    <span class="pw-page-transition-slogan">
        <span class="pw-pts-left">HECHA PARA</span>
        <span class="pw-pts-right">COMPARTIR</span>
    </span>
</div>

<div id="header-container"></div>
<div id="sidebar-container"></div>

<main class="dashboard__main" id="dashboard__main">
    <button class="toggle-btn" id="toggle-btn"><</button>
    <div id="shell-nav-bar"></div>
    <iframe id="planta-frame" src="./dashboard.html" title="Planta"></iframe>
</main>

<div id="footer-container"></div>

<script type="module" src="planta-shell.js"></script>
</body>
</html>
