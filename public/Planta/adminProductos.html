<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Productos - DrivePizza</title>
    <link rel="stylesheet" href="../Estilos/styles.css">
    <link rel="stylesheet" href="../Estilos/adminProductos.css">
    <link rel="shortcut icon" href="../Imagenes/Isotipo.png" type="image/x-icon">
</head>
<body>

<div class="pw-page-transition" id="pw-page-transition">
    <img class="pw-page-transition-logo" src="../Imagenes/Isotipo.png" alt="Drive Pizza">
    <span class="pw-page-transition-slogan">
        <span class="pw-pts-left">HECHA PARA</span>
        <span class="pw-pts-right">COMPARTIR</span>
    </span>
</div>

    <div id="header-container"></div>
    <div id="sidebar-container"></div>

    <main class="ap-main">
        <button class="toggle-btn" id="toggle-btn"><</button>
        <!-- Toolbar -->
        <div class="ap-toolbar">
            <div class="ap-toolbar__filters">
                <input
                    type="search"
                    id="ap-search"
                    class="ap-input"
                    placeholder="Buscar producto..."
                    autocomplete="off"
                >
                <select id="ap-filter-rotacion" class="ap-select">
                    <option value="">Todas las rotaciones</option>
                    <option value="alta">Alta rotación</option>
                    <option value="media">Media rotación</option>
                    <option value="baja">Baja rotación</option>
                    <option value="sin">Sin clasificar</option>
                </select>
                <select id="ap-filter-cat" class="ap-select">
                    <option value="">Todas las categorías</option>
                </select>
                <select id="ap-filter-status" class="ap-select">
                    <option value="">Todos</option>
                    <option value="active">Activos</option>
                    <option value="inactive">Inactivos</option>
                </select>
                <select id="ap-filter-proveedor" class="ap-select">
                    <option value="">Todos los proveedores</option>
                </select>
            </div>
            <button class="ap-btn ap-btn--primary" id="ap-btn-nuevo">+ Nuevo producto</button>
            <button class="ap-btn ap-btn--primary" id="btn-add-stock">+ Ingresar Stock</button>
            <button class="ap-btn ap-btn--primary" id="btn-ajuste-stock" style="display:none">&#9878; Ajuste de Inventario</button>
        </div>

        <!-- Contador -->
        <p class="ap-count" id="ap-count"></p>

        <!-- Tabla -->
        <div class="ap-table-wrap">
            <table class="ap-table">
                <thead>
                    <tr>
                        <th class="ap-col-center">Rotación</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Proveedor</th>
                        <th class="ap-col-num">Precio</th>
                        <th class="ap-col-num">Stock</th>
                        <th>Unidad</th>
                        <th>Presentaciones</th>
                        <th class="ap-col-center">Activo</th>
                        <th class="ap-col-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="ap-tbody">
                    <tr id="ap-loading-row">
                        <td colspan="10" class="ap-loading">Cargando productos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal crear / editar producto -->
    <dialog id="ap-modal" class="ap-modal-dialog">
        <form id="ap-form" class="ap-modal__form" novalidate>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
                <h2 class="ap-modal__title" id="ap-modal-title" style="margin:0;">Nuevo producto</h2>
                <button type="button" id="ap-btn-delete-modal" class="btn-modal btn-modal--danger" title="Eliminar producto" style="display:none;font-size:18px;">🗑️</button>
            </div>

            <div class="ap-modal__grid">
                <div class="ap-field ap-field--full">
                    <label class="ap-label" for="f-nombre">Nombre *</label>
                    <input class="ap-input" id="f-nombre" name="nombre" type="text" required autocomplete="off">
                </div>

                <div class="ap-field">
                    <label class="ap-label" for="f-categoria">Categoría *</label>
                    <select class="ap-select" id="f-categoria" name="categoria" required>
                        <option value="">Seleccionar</option>
                    </select>
                </div>

                <div class="ap-field">
                    <label class="ap-label" for="f-unidad">Unidad de medida *</label>
                    <select class="ap-select" id="f-unidad" name="unidad" required></select>
                </div>

                <div class="ap-field">
                    <label class="ap-label" for="f-precio">Precio ($) *</label>
                    <input class="ap-input" id="f-precio" name="precio" type="number" min="0" step="0.01" required>
                </div>

                <div class="ap-field" id="f-stock-wrap">
                    <label class="ap-label" for="f-stock">Stock inicial *</label>
                    <input class="ap-input" id="f-stock" name="stock" type="number" min="0" step="1" required>
                </div>

                <div class="ap-field ap-field--full">
                    <label class="ap-label" for="f-presentaciones">
                        Presentaciones
                        <span class="ap-label__hint">(cantidades separadas por coma, ej: 1,5,10)</span>
                    </label>
                    <input class="ap-input" id="f-presentaciones" name="presentaciones" type="text" autocomplete="off" placeholder="1,5,10">
                </div>

                <div class="ap-field ap-field--full ap-field--row">
                    <label class="ap-label" for="f-activo">Activo</label>
                    <input type="checkbox" id="f-activo" name="activo" class="ap-checkbox">
                </div>

                <div class="ap-field ap-field--full ap-field--row">
                    <label class="ap-label" for="f-sin-limite">Sin límite de stock
                        <span class="ap-label__hint">(las pizzerías pueden pedirlo aunque el stock sea 0)</span>
                    </label>
                    <input type="checkbox" id="f-sin-limite" name="sinLimiteStock" class="ap-checkbox">
                </div>

                <div class="ap-field ap-field--full ap-field--row">
                    <label class="ap-label" for="f-solo-produccion">Solo producción
                        <span class="ap-label__hint">(no aparece en inventario ni en pedidos de pizzerías)</span>
                    </label>
                    <input type="checkbox" id="f-solo-produccion" name="soloProduccion" class="ap-checkbox">
                </div>

                <div class="ap-field ap-field--full ap-field--row">
                    <label class="ap-label" for="f-peso-variable">Peso variable
                        <span class="ap-label__hint">(precio por kg — se debe ingresar el peso real al despachar)</span>
                    </label>
                    <input type="checkbox" id="f-peso-variable" name="pesoVariable" class="ap-checkbox">
                </div>

                <div class="ap-field ap-field--full ap-field--row">
                    <label class="ap-label" for="f-entrega-diferida">Entrega diferida
                        <span class="ap-label__hint">(siropes — se registra pendiente al marcar entregado en planta)</span>
                    </label>
                    <input type="checkbox" id="f-entrega-diferida" name="entregaDiferida" class="ap-checkbox">
                </div>

                <div class="ap-field ap-field--full">
                    <label class="ap-label">Proveedor principal</label>
                    <input type="text" id="f-proveedor-buscar" class="ap-input" placeholder="Busca el proveedor..." autocomplete="off">
                    <div id="f-proveedor-resultados" style="max-height:160px;overflow-y:auto;border:1px solid #eee;border-radius:6px;background:#fff;"></div>
                    <div id="f-proveedor-seleccionado" style="display:none;background:#f0faf4;border-radius:6px;padding:10px;margin-top:4px;">
                        <p style="margin:0;font-weight:600;" id="f-proveedor-nombre"></p>
                    </div>
                </div>

                <div class="ap-field">
                    <label class="ap-label" for="f-rotacion">Rotación</label>
                    <select class="ap-select" id="f-rotacion" name="rotacion">
                        <option value="">Sin clasificar</option>
                        <option value="alta">Alta rotación</option>
                        <option value="media">Media rotación</option>
                        <option value="baja">Baja rotación</option>
                    </select>
                </div>
            </div>

            <p class="ap-modal__error" id="ap-modal-error"></p>

            <div class="ap-modal__actions">
                <button type="button" class="ap-btn ap-btn--ghost" id="ap-btn-cancelar">Cancelar</button>
                <button type="submit" class="ap-btn ap-btn--primary" id="ap-btn-guardar">Guardar</button>
            </div>
        </form>
    </dialog>

    <!-- Modal Ingreso de Stock -->
    <dialog id="modal-stock" class="ap-modal-dialog">
        <form class="ap-modal__form" id="form-stock" novalidate>
            <h2 class="ap-modal__title">Ingreso de Stock</h2>
            <div class="ap-modal__grid">
                <div class="ap-field ap-field--full">
                    <label class="ap-label">Producto</label>
                    <input type="text" id="stock-buscar-input" class="ap-input" placeholder="Busca el producto..." autocomplete="off">
                    <div id="stock-resultados" style="max-height:160px;overflow-y:auto;border:1px solid #eee;border-radius:6px;background:#fff;"></div>
                    <div id="stock-seleccionado" style="display:none;background:#f0faf4;border-radius:6px;padding:10px;margin-top:4px;">
                        <p style="margin:0;font-weight:600;" id="stock-nombre-prod"></p>
                    </div>
                </div>
                <div class="ap-field">
                    <label class="ap-label" for="stock-quantity">Cantidad</label>
                    <input type="number" id="stock-quantity" class="ap-input" placeholder="Cantidad a ingresar" required min="1">
                </div>
                <div class="ap-field">
                    <label class="ap-label">Proveedor</label>
                    <input type="text" id="supplier-buscar-input" class="ap-input" placeholder="Busca el proveedor..." autocomplete="off">
                    <div id="supplier-resultados" style="max-height:160px;overflow-y:auto;border:1px solid #eee;border-radius:6px;background:#fff;"></div>
                    <div id="supplier-seleccionado" style="display:none;background:#f0faf4;border-radius:6px;padding:10px;margin-top:4px;">
                        <p style="margin:0;font-weight:600;" id="supplier-nombre"></p>
                    </div>
                </div>
                <div class="ap-field ap-field--full">
                    <label class="ap-label" for="stock-observation">Observacion</label>
                    <textarea id="stock-observation" class="ap-input" rows="3" placeholder="Detalles del ingreso..."></textarea>
                </div>
            </div>
            <div class="ap-modal__actions">
                <button type="button" class="ap-btn ap-btn--ghost" id="btn-stock-cancel">Cancelar</button>
                <button type="submit" class="ap-btn ap-btn--primary" id="btn-stock-enviar">Guardar</button>
            </div>
        </form>
    </dialog>

    <!-- Modal Confirmacion de Stock -->
    <dialog id="modal-confirm-stock" class="ap-modal-dialog">
        <div class="ap-modal__form">
            <h2 class="ap-modal__title">Confirmar ingreso de stock</h2>
            <div class="ap-modal__grid" style="gap:8px;">
                <div class="ap-field ap-field--full">
                    <table style="width:100%;border-collapse:collapse;font-size:15px;">
                        <tbody id="confirm-stock-tabla"></tbody>
                    </table>
                </div>
            </div>
            <div class="ap-modal__actions">
                <button type="button" class="ap-btn ap-btn--ghost" id="btn-confirm-stock-cancelar">Cancelar</button>
                <button type="button" class="ap-btn ap-btn--primary" id="btn-confirm-stock-ok">&#10003; Confirmar</button>
            </div>
        </div>
    </dialog>

    <!-- Modal Ajuste de Inventario -->
    <dialog id="modal-ajuste" class="ap-modal-dialog">
        <form class="ap-modal__form" id="form-ajuste" novalidate>
            <h2 class="ap-modal__title">Ajuste de Inventario</h2>
            <div class="ap-modal__grid">
                <div class="ap-field ap-field--full">
                    <label class="ap-label">Producto</label>
                    <input type="text" id="ajuste-buscar-input" class="ap-input" placeholder="Busca el producto..." autocomplete="off">
                    <div id="ajuste-resultados" style="max-height:160px;overflow-y:auto;border:1px solid #eee;border-radius:6px;background:#fff;"></div>
                    <div id="ajuste-seleccionado" style="display:none;background:#f0faf4;border-radius:6px;padding:10px;margin-top:4px;">
                        <p style="margin:0;font-weight:600;" id="ajuste-nombre-prod"></p>
                    </div>
                </div>
                <div class="ap-field">
                    <label class="ap-label">Stock actual (sistema)</label>
                    <input type="text" id="ajuste-stock-actual" class="ap-input" disabled placeholder="&#8212;">
                </div>
                <div class="ap-field">
                    <label class="ap-label" for="ajuste-stock-real">Stock real contado</label>
                    <input type="number" id="ajuste-stock-real" class="ap-input" placeholder="Ingresa el conteo real" required min="0">
                </div>
                <div class="ap-field ap-field--full" id="ajuste-diferencia-wrap" style="display:none">
                    <p id="ajuste-diferencia-label" style="font-weight:600;margin:0;padding:6px 10px;border-radius:6px"></p>
                </div>
                <div class="ap-field ap-field--full">
                    <label class="ap-label" for="ajuste-motivo">Motivo del ajuste <span style="color:#c0392b">*</span></label>
                    <textarea id="ajuste-motivo" class="ap-input" rows="2" placeholder="Ej: Novedad en inventario inicio de mes" required></textarea>
                </div>
                <div class="ap-field ap-field--full">
                    <label class="ap-label" for="ajuste-notas">Notas adicionales</label>
                    <textarea id="ajuste-notas" class="ap-input" rows="2" placeholder="Observaciones opcionales..."></textarea>
                </div>
            </div>
            <div class="ap-modal__actions">
                <button type="button" class="ap-btn ap-btn--ghost" id="btn-ajuste-cancel">Cancelar</button>
                <button type="submit" class="ap-btn ap-btn--primary" id="btn-ajuste-enviar">Guardar Ajuste</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="./adminProductos.js"></script>
</body>
</html>
