<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Pizza — Menú</title>
  <link rel="shortcut icon" href="../Imagenes/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="css/brand.css">
  <link rel="stylesheet" href="css/pagWeb.css">
</head>
<body>

  <!-- MENU SHELL (sticky: header + pills juntos) -->
  <div class="pw-menu-shell">

    <!-- HEADER -->
    <header class="pw-header">
      <div class="pw-header-left">
        <button class="pw-header-btn" id="btn-hamburger" aria-label="Menú">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="pw-header-logo-wrap">
        <img class="pw-header-logo" src="../Imagenes/recortelogosinfondo.png" alt="Drive Pizza">
      </div>
      <div class="pw-header-right">
        <button class="pw-header-btn" id="btn-cuenta" aria-label="Mi cuenta">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- FRANJA SEDE -->
    <div class="pw-sede-bar" id="sede-bar"></div>

  </div><!-- /pw-menu-shell -->

  <!-- PROMOS (se renderizan desde JS) -->
  <section class="pw-promo-section pw-cat-section" id="sec-Promociones">
    <div class="pw-promo-scroll-wrap">
      <button class="pw-promo-arrow pw-promo-arrow--prev" id="promo-prev" aria-label="Anterior">&#8249;</button>
      <div class="pw-promo-list" id="promo-list"></div>
      <button class="pw-promo-arrow pw-promo-arrow--next" id="promo-next" aria-label="Siguiente">&#8250;</button>
    </div>
  </section>

  <!-- SUB-SHELL (sticky: buscador + categorías) -->
  <div class="pw-sub-shell">
    <div class="pw-search-wrap">
      <input type="search" class="pw-search-input" id="menu-search"
             placeholder="Buscar producto..." autocomplete="off">
    </div>
    <nav class="pw-cats" id="cats-nav" aria-label="Categorías del menú"></nav>
  </div>

  <!-- AVISO SEDE CERRADA -->
  <div class="pw-closed-banner" id="closed-banner" style="display:none">
    <h3>Sede cerrada</h3>
    <p id="closed-msg"></p>
  </div>

  <!-- MENÚ -->
  <main class="pw-menu-body" id="menu-body">
    <div class="pw-loading">
      <div class="pw-spinner"></div>
      <span>Cargando menú...</span>
    </div>
  </main>

  <!-- BARRA DEL CARRITO -->
  <div class="pw-cart-bar" id="cart-bar">
    <div class="pw-cart-bar-info">
      <div class="pw-cart-bar-items" id="cart-bar-items"></div>
      <div class="pw-cart-bar-total" id="cart-bar-total"></div>
    </div>
    <button class="pw-cart-bar-btn" id="btn-cart-bar">Ver carrito</button>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="pw-bottom-nav">
    <button class="pw-bottom-nav-btn" id="bottom-nav-inicio" aria-label="Inicio">
      <svg class="pw-bottom-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L12 3l9 9M5 10.5V20h5v-5h4v5h5V10.5"/></svg>
      <span>Inicio</span>
    </button>
    <button class="pw-bottom-nav-btn pw-bottom-nav-btn--active" aria-label="Menú">
      <svg class="pw-bottom-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(150 12 12)"><path d="M9.44 9.44Q12 4 14.56 9.44L17.44 15.56Q20 21 14 21L10 21Q4 21 6.56 15.56Z"/><circle cx="12" cy="13" r="1.2" fill="currentColor" stroke="none"/><circle cx="9.5" cy="17" r="1" fill="currentColor" stroke="none"/><circle cx="14.5" cy="17" r="1" fill="currentColor" stroke="none"/></g></svg>
      <span>Menú</span>
    </button>
    <button class="pw-bottom-nav-btn pw-bottom-nav-btn--center" id="bottom-nav-cart-btn" aria-label="Pedido">
      <img src="../Imagenes/Isotipo.png" alt="DrivePizza" class="pw-bottom-nav-isotipo">
      <span class="pw-cart-badge" id="bottom-cart-badge"></span>
      <span>Pedido</span>
    </button>
    <button class="pw-bottom-nav-btn" aria-label="Favoritos">
      <svg class="pw-bottom-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/></svg>
      <span>Favoritos</span>
    </button>
    <button class="pw-bottom-nav-btn" aria-label="Cuenta">
      <svg class="pw-bottom-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>
      <span>Cuenta</span>
    </button>
  </nav>

  <!-- OVERLAY -->
  <div class="pw-overlay" id="overlay"></div>

  <!-- SHEET: PRODUCTO -->
  <div class="pw-sheet" id="product-sheet" role="dialog" aria-modal="true" aria-label="Agregar producto">
    <div class="pw-sheet-handle"></div>
    <button class="pw-sheet-close" id="btn-cerrar-producto" aria-label="Cerrar">&#10005;</button>

    <h3 class="pw-sheet-nombre" id="sheet-nombre"></h3>
    <p class="pw-sheet-desc" id="sheet-desc"></p>

    <div id="sheet-opciones-wrap">
      <span class="pw-sheet-label">Tamaño / Opción</span>
      <div class="pw-opciones" id="sheet-opciones"></div>
    </div>

    <!-- ½+½ MEZCLAR SABORES (solo pizzas con tamaño mixable) -->
    <div id="sheet-mezcla-wrap" style="display:none">
      <button class="pw-btn-mezcla" id="btn-mezcla">🍕 Puedes elegir un segundo sabor para tu pizza (mitad y mitad)</button>
    </div>

    <!-- ADICIONES Y BORDES (solo productos adicionables) -->
    <div id="sheet-adiciones-wrap" style="display:none">
      <!-- Label desktop (siempre visible) -->
      <span class="pw-sheet-label pw-adiciones-label-desk">Adiciones <span class="pw-label-opt">(opcional)</span></span>
      <!-- Toggle mobile (colapsable) -->
      <button class="pw-adiciones-toggle" id="btn-adiciones-toggle" aria-expanded="false">
        Adiciones <span class="pw-label-opt">(opcional)</span>
        <span class="pw-adiciones-chevron" aria-hidden="true">▾</span>
      </button>
      <p class="pw-adiciones-hint" id="adiciones-hint">🍕 Puedes realizar adiciones a tu orden</p>
      <div class="pw-adiciones-collapsible" id="sheet-adiciones-body">
        <div class="pw-adiciones-grid" id="sheet-adiciones"></div>
        <div id="sheet-bordes-wrap" style="display:none">
          <span class="pw-sheet-label" style="margin-top:.6rem">Bordes <span class="pw-label-opt">(opcional)</span></span>
          <div class="pw-adiciones-grid" id="sheet-bordes"></div>
        </div>
      </div>
    </div>

    <span class="pw-sheet-label">Cantidad</span>
    <div class="pw-cantidad-row">
      <button class="pw-cantidad-btn" id="btn-menos" aria-label="Disminuir cantidad">−</button>
      <span class="pw-cantidad-num" id="cant-num">1</span>
      <button class="pw-cantidad-btn" id="btn-mas" aria-label="Aumentar cantidad">+</button>
    </div>

    <span class="pw-sheet-label">Observaciones (opcional)</span>
    <textarea class="pw-obs-input" id="sheet-obs" rows="2"
      placeholder="Ej: sin cebolla, extra salsa..."></textarea>

    <button class="pw-btn-primary" id="btn-agregar">Agregar al carrito</button>
  </div>

  <!-- SHEET: CARRITO -->
  <div class="pw-sheet pw-cart-sheet" id="cart-sheet" role="dialog" aria-modal="true" aria-label="Tu carrito">
    <div class="pw-sheet-handle"></div>
    <div class="pw-cart-sheet-header">
      <h3 class="pw-cart-sheet-title">Tu carrito</h3>
      <button class="pw-sheet-close" id="btn-cerrar-carrito" aria-label="Cerrar">&#10005;</button>
    </div>
    <div id="cart-items-list"></div>
    <div id="cart-footer"></div>
  </div>

  <!-- SHEET: SEGUNDO SABOR -->
  <div class="pw-sheet pw-sabor2-sheet" id="sabor2-sheet" role="dialog" aria-modal="true" aria-label="Elegir 2° sabor">
    <div class="pw-sheet-handle"></div>
    <button class="pw-sheet-close" id="btn-cerrar-sabor2" aria-label="Cerrar">&#10005;</button>
    <h3 class="pw-sheet-nombre" id="sabor2-titulo"></h3>
    <p class="pw-sheet-desc" id="sabor2-subtitulo"></p>
    <input type="text" class="pw-sabor2-buscar" id="sabor2-buscar" placeholder="Buscar sabor..." autocomplete="off">
    <div id="sabor2-grid" class="pw-sabor2-grid"></div>
  </div>

  <!-- SHEET: PROMO -->
  <div class="pw-sheet pw-promo-sheet" id="promo-sheet" role="dialog" aria-modal="true" aria-label="Promoción">
    <div class="pw-sheet-handle"></div>
    <button class="pw-sheet-close" id="btn-cerrar-promo" aria-label="Cerrar">&#10005;</button>
    <div class="pw-promo-stepbar" id="promo-stepbar"></div>
    <h3 class="pw-sheet-nombre" id="promo-titulo"></h3>
    <p class="pw-sheet-desc" id="promo-subtitulo"></p>
    <div id="promo-content"></div>
  </div>

  <footer class="pw-footer">
    <span class="pw-footer-brand">Drive Pizza</span>
    <span class="pw-footer-slogan">HECHA PARA COMPARTIR</span>
  </footer>

  <script type="module" src="js/menu.js"></script>
</body>
</html>
