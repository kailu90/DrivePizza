<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Pizza — Confirmar pedido</title>
  <link rel="shortcut icon" href="../Imagenes/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="css/brand.css">
  <link rel="stylesheet" href="css/pagWeb.css">
  <!-- Meta Pixel -->

  n.callMethod.apply(n,arguments):n.queue.push(arguments)};

  n.queue=[];t=b.createElement(e);t.async=!0;

  src="https://www.facebook.com/tr?id=3847143108886679&ev=PageView&noscript=1"/></noscript>

</head>
<body>

  <!-- HEADER -->
  <header class="pw-header">
    <div class="pw-header-left">
      <a href="menu.html" class="pw-header-btn" aria-label="Volver al menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </a>
    </div>
    <div class="pw-header-logo-wrap">
      <img class="pw-header-logo" src="../Imagenes/recortelogosinfondo.png" alt="Drive Pizza">
    </div>
    <div class="pw-header-right">
      <span class="pw-sede-chip" id="header-sede"></span>
    </div>
  </header>

  <main class="pw-checkout-main">
    <div class="pw-checkout-cols">

      <!-- COLUMNA IZQUIERDA: Datos del cliente -->
      <div class="pw-checkout-col">

        <section class="pw-checkout-section">
          <h3 class="pw-checkout-section-title">Tus datos</h3>
          <div class="pw-form-group">
            <label class="pw-form-label" for="inp-nombre">Nombre *</label>
            <input class="pw-form-input" id="inp-nombre" type="text"
                   placeholder="¿Cómo te llamamos?" autocomplete="name" required>
          </div>
          <div class="pw-form-group">
            <label class="pw-form-label" for="inp-tel">Teléfono *</label>
            <input class="pw-form-input" id="inp-tel" type="tel"
                   placeholder="Número de contacto" autocomplete="tel" inputmode="tel" required>
          </div>
        </section>

        <section class="pw-checkout-section">
          <h3 class="pw-checkout-section-title">¿Cómo lo recibés?</h3>
          <div class="pw-entrega-pills">
            <button class="pw-entrega-pill active" data-tipo="domicilio">
              <span class="pw-entrega-pill-icon">&#x1F6F5;</span>
              Domicilio
            </button>
            <button class="pw-entrega-pill" data-tipo="recoger">
              <span class="pw-entrega-pill-icon">&#x1F3EA;</span>
              Recoger en tienda
            </button>
          </div>
          <div id="seccion-domicilio">

            <!-- Card: barrio ya seleccionado -->
            <div class="pw-barrio-selecc" id="barrio-selecc" style="display:none">
              <div class="pw-barrio-selecc-left">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/>
                </svg>
                <div>
                  <span class="pw-barrio-selecc-nombre" id="barrio-selecc-nombre"></span>
                  <span class="pw-barrio-selecc-fee" id="barrio-selecc-fee"></span>
                </div>
              </div>
              <button class="pw-barrio-selecc-btn" id="btn-cambiar-barrio">Cambiar →</button>
            </div>

            <!-- Autocomplete de barrio -->
            <div class="pw-ac-wrap" id="barrio-ac-wrap">
              <div class="pw-form-group">
                <label class="pw-form-label" for="inp-barrio">Barrio *</label>
                <input class="pw-form-input" id="inp-barrio" type="text"
                       placeholder="Busca tu barrio o sector..." autocomplete="off">
              </div>
              <ul class="pw-ac-suggs" id="barrio-suggs" hidden></ul>
            </div>

            <!-- Dirección completa (se despliega tras elegir barrio) -->
            <div id="dir-wrap" style="display:none">
              <div class="pw-form-group">
                <label class="pw-form-label" for="inp-dir">Dirección *</label>
                <input class="pw-form-input" id="inp-dir" type="text"
                       placeholder="Ej: Cra 27 # 45-12" autocomplete="street-address">
              </div>
              <div class="pw-dir-extras pw-form-group">
                <div>
                  <label class="pw-form-label" for="inp-torre">Torre / Bloque <span class="pw-label-optional">(opcional)</span></label>
                  <input class="pw-form-input" id="inp-torre" type="text" placeholder="Torre 3">
                </div>
                <div>
                  <label class="pw-form-label" for="inp-apto">Apto / Casa <span class="pw-label-optional">(opcional)</span></label>
                  <input class="pw-form-input" id="inp-apto" type="text" placeholder="Apto 401">
                </div>
              </div>
            </div>

            <div class="pw-domicilio-fee" id="domicilio-fee" style="display:none">
              <span>Domicilio</span>
              <span id="domicilio-fee-val"></span>
            </div>

          </div>
          <div id="seccion-recoger" style="display:none">
            <div class="pw-recoger-info" id="recoger-info"></div>
          </div>
        </section>

        <section class="pw-checkout-section">
          <h3 class="pw-checkout-section-title">Método de pago</h3>
          <div class="pw-pago-pills" id="pago-pills">
            <button class="pw-pago-pill active" data-pago="Efectivo">
              <span>&#x1F4B5;</span> Efectivo
            </button>
            <button class="pw-pago-pill" data-pago="Transferencia">
              <span>&#x1F4F1;</span> Transferencia
            </button>
          </div>
        </section>

        <section class="pw-checkout-section">
          <h3 class="pw-checkout-section-title">Observaciones <span style="font-weight:400;font-size:.75rem;color:#aaa">(opcional)</span></h3>
          <textarea class="pw-obs-input" id="inp-obs" rows="2"
            placeholder="Instrucciones especiales para el pedido..."></textarea>
        </section>

      </div>

      <!-- COLUMNA DERECHA: Detalle del pedido -->
      <div class="pw-checkout-col pw-checkout-col--right">

        <section class="pw-checkout-section pw-checkout-items-section">
          <h3 class="pw-checkout-section-title">Tu pedido</h3>
          <div id="summary-items"></div>
          <div class="pw-summary-subtotal" id="summary-subtotal"></div>
        </section>

        <section class="pw-checkout-section pw-checkout-total-section">
          <div class="pw-total-row">
            <span>Subtotal</span>
            <span id="total-subtotal"></span>
          </div>
          <div class="pw-total-row" id="row-domicilio" style="display:none">
            <span>Domicilio</span>
            <span id="total-domicilio"></span>
          </div>
          <div class="pw-total-row pw-total-final">
            <span>Total</span>
            <span id="total-final"></span>
          </div>
        </section>

        <button class="pw-btn-primary pw-btn-confirmar" id="btn-confirmar">
          Confirmar pedido
        </button>
        <div class="pw-confirm-error" id="confirm-error" style="display:none"></div>

      </div>

    </div>

    <!-- Elementos ocultos para compatibilidad con checkout.js -->
    <button id="summary-toggle" style="display:none" aria-expanded="false">
      <span>Ver resumen del pedido</span>
      <span id="summary-total-preview"></span>
      <span class="pw-summary-chevron"></span>
    </button>
    <div id="summary-body" style="display:none"></div>

  </main>

  <script type="module" src="js/checkout.js"></script>
</body>
</html>
