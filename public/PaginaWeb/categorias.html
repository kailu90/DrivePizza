<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Pizza — Menú</title>
  <link rel="shortcut icon" href="../Imagenes/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="css/brand.css">
  <link rel="stylesheet" href="css/pagWeb.css">
</head>
<body>

  <!-- HEADER -->
  <header class="pw-hero pw-hero--sm">
    <img class="pw-hero-logo" src="../Imagenes/logo.png" alt="Drive Pizza">
  </header>

  <!-- CATEGORIAS -->
  <main class="pw-cats-page">
    <h2 class="pw-cats-title">Elige tu Producto</h2>
    <p class="pw-cats-subtitle">Elige una categoría para iniciar tu orden</p>
    <div class="pw-cats-grid" id="cats-grid"></div>

    <!-- BANNER CARRUSEL -->
    <div class="pw-banner" id="pw-banner" style="display:none">
      <div class="pw-banner-track" id="pw-banner-track"></div>
      <div class="pw-banner-dots" id="pw-banner-dots"></div>
    </div>
  </main>

  <footer class="pw-footer">
    <span class="pw-footer-brand">Drive Pizza</span>
    <span class="pw-footer-slogan">HECHA PARA COMPARTIR</span>
  </footer>

  <script type="module" src="js/categorias.js"></script>
</body>
</html>
