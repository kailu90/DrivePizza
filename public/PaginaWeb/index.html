<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Drive Pizza — Pide tu pizza favorita en línea. Domicilios y recogida en tienda.">
  <title>Drive Pizza — Pide en línea</title>
  <link rel="shortcut icon" href="../Imagenes/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="css/brand.css">
  <link rel="stylesheet" href="css/pagWeb.css">
</head>
<body class="pw-page-index">

  <div class="pw-page-transition" id="pw-page-transition"></div>

  <!-- NAV SHELL (sticky en desktop, agrupa header + top nav) -->
  <div class="pw-nav-shell">

    <!-- HEADER -->
    <header class="pw-header">
      <div class="pw-header-logo-wrap">
        <img class="pw-header-logo" src="../Imagenes/recortelogosinfondo.png" alt="Drive Pizza">
      </div>
    </header>

    <!-- TOP NAV (solo desktop) -->
    <nav class="pw-top-nav" aria-label="Navegación principal">
      <button class="pw-top-nav-btn pw-top-nav-btn--active" aria-label="Inicio">
        <svg class="pw-bottom-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L12 3l9 9M5 10.5V20h5v-5h4v5h5V10.5"/></svg>
        <span>Inicio</span>
      </button>
      <button class="pw-top-nav-btn" aria-label="Menú">
        <svg class="pw-bottom-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 5) rotate(150 12 12)"><g transform="translate(12 12) scale(1.2) translate(-12 -12)"><path d="M9.44 9.44Q12 4 14.56 9.44L17.44 15.56Q20 21 14 21L10 21Q4 21 6.56 15.56Z"/><circle cx="12" cy="13" r="1.2" fill="currentColor" stroke="none"/><circle cx="9.5" cy="17" r="1" fill="currentColor" stroke="none"/><circle cx="14.5" cy="17" r="1" fill="currentColor" stroke="none"/></g></g></svg>
        <span>Menú</span>
      </button>
      <button class="pw-top-nav-btn pw-top-nav-btn--cta" aria-label="Pedir ahora">
        <img src="../Imagenes/Isotipo.png" alt="DrivePizza" class="pw-bottom-nav-isotipo">
        <span>Pedir ahora</span>
      </button>
      <button class="pw-top-nav-btn" aria-label="Favoritos">
        <svg class="pw-bottom-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/></svg>
        <span>Favoritos</span>
      </button>
      <button class="pw-top-nav-btn" aria-label="Mi cuenta">
        <svg class="pw-bottom-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>
        <span>Mi cuenta</span>
      </button>
    </nav>

  </div><!-- /pw-nav-shell -->

  <!-- BANNER CARRUSEL -->
  <div class="pw-banner-wrapper">
    <div class="pw-banner" id="pw-banner" style="display:none">
      <div class="pw-banner-track" id="pw-banner-track"></div>
      <div class="pw-banner-dots" id="pw-banner-dots"></div>
    </div>
  </div>

  <!-- SELECTOR DE SEDE -->
  <section class="pw-selector-section">
    <div class="pw-selector-header">
      <h2 class="pw-selector-title">¿Dónde quieres disfrutar tu Drive Pizza?</h2>
      <p class="pw-selector-subtitle">Escribe tu barrio o sector y te mostraremos la sede más cercana para atenderte.</p>
    </div>
    <div class="pw-direccion-wrapper">
      <div class="pw-direccion-input">
        <svg class="pw-direccion-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/>
        </svg>
        <input type="text" placeholder="Ej.: Provenza, Real de minas, Soto mayor, centro." class="pw-direccion-field" id="dir-inicio" autocomplete="off">
        <button class="pw-direccion-gps" aria-label="Usar mi ubicación">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>
          </svg>
        </button>
      </div>
      <div class="pw-dir-suggestions" id="dir-suggestions" hidden></div>
    </div>
    <div id="dir-selected-card" class="pw-dir-selected-card" hidden></div>
    <h3 class="pw-sedes-title" id="sedes-title">Elige una sede</h3>
    <div id="sedes-grid" class="pw-sedes-list">
      <div class="pw-loading">
        <div class="pw-spinner"></div>
        <span>Cargando sedes...</span>
      </div>
    </div>
    <p id="error-sedes" style="display:none; text-align:center; color:#e74c3c; font-size:.88rem; margin-top:1rem;"></p>
  </section>

  <!-- BOTTOM NAV -->
  <nav class="pw-bottom-nav">
    <button class="pw-bottom-nav-btn pw-bottom-nav-btn--active" id="bottom-nav-inicio" aria-label="Inicio">
      <svg class="pw-bottom-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L12 3l9 9M5 10.5V20h5v-5h4v5h5V10.5"/></svg>
      <span>Inicio</span>
    </button>
    <button class="pw-bottom-nav-btn" id="bottom-nav-menu" aria-label="Menú">
      <svg class="pw-bottom-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 5) rotate(150 12 12)"><g transform="translate(12 12) scale(1.2) translate(-12 -12)"><path d="M9.44 9.44Q12 4 14.56 9.44L17.44 15.56Q20 21 14 21L10 21Q4 21 6.56 15.56Z"/><circle cx="12" cy="13" r="1.2" fill="currentColor" stroke="none"/><circle cx="9.5" cy="17" r="1" fill="currentColor" stroke="none"/><circle cx="14.5" cy="17" r="1" fill="currentColor" stroke="none"/></g></g></svg>
      <span>Menú</span>
    </button>
    <button class="pw-bottom-nav-btn pw-bottom-nav-btn--center" aria-label="Pedido">
      <img src="../Imagenes/Isotipo.png" alt="DrivePizza" class="pw-bottom-nav-isotipo">
      <span>Pedido</span>
    </button>
    <button class="pw-bottom-nav-btn" aria-label="Favoritos">
      <svg class="pw-bottom-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/></svg>
      <span>Favoritos</span>
    </button>
    <button class="pw-bottom-nav-btn" aria-label="Cuenta">
      <svg class="pw-bottom-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>
      <span>Cuenta</span>
    </button>
  </nav>

  <!-- MODAL HORARIOS -->
  <div class="pw-horarios-overlay" id="pw-horarios-overlay" role="dialog" aria-modal="true" aria-labelledby="pw-horarios-titulo">
    <div class="pw-horarios-modal">
      <div class="pw-horarios-header">
        <div>
          <p class="pw-horarios-label">Horarios de atención</p>
          <h3 class="pw-horarios-titulo" id="pw-horarios-titulo"></h3>
        </div>
        <button class="pw-horarios-close" id="pw-horarios-close" aria-label="Cerrar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="pw-horarios-lista" id="pw-horarios-lista"></div>
    </div>
  </div>

  <script type="module">
    import { cargarSedes, estaAbierta, formatHorario, setSedeActual, getSedeActual, displayNombre } from './js/sede.js';
    import { vaciarCarrito } from './js/carrito.js';
    import { initBottomNav } from './js/bottomNav.js';
    import { initHeader } from './js/header.js';
    import { cargarTodosBarrios, getBarrioCoordsMap } from '../CallCenter/barriosService.js';
    initHeader();
    initBottomNav();

    // ── RESTAURAR ESTADO DESDE MENÚ (síncrono, antes del primer render) ──
    const fromMenu = sessionStorage.getItem('dp_from_menu') === '1';
    if (fromMenu) {
      sessionStorage.removeItem('dp_from_menu');
      const _sede = (() => { try { return JSON.parse(localStorage.getItem('dp_sede')); } catch { return null; } })();
      const _dir  = (() => { try { return JSON.parse(localStorage.getItem('dp_direccion')); } catch { return null; } })();
      if (_sede) {
        document.querySelector('.pw-direccion-wrapper').hidden = true;
        document.getElementById('sedes-title').textContent = 'Sedes cercanas';
        const _card = document.getElementById('dir-selected-card');
        const _addrLine = _dir?.direccion ? `<span class="pw-dir-card-addr">${_dir.direccion}</span>` : '';
        _card.innerHTML = `
          <div class="pw-dir-card-top">
            <div class="pw-dir-card-col">
              <span class="pw-dir-card-label">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
                Entrega en
              </span>
              <strong class="pw-dir-card-sede">${displayNombre(_sede)}</strong>
              ${_addrLine}
            </div>
            <div class="pw-dir-card-col pw-dir-card-col--right">
              <span class="pw-dir-card-label">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v5"/><circle cx="15.5" cy="17.5" r="2.5"/><circle cx="5.5" cy="17.5" r="2.5"/><path d="M3 11h13"/></svg>
                Tiempo estimado
              </span>
              <strong class="pw-dir-card-tiempo">45 - 60 min</strong>
            </div>
            <button class="pw-dir-card-cambiar" id="btn-cambiar-dir">Cambiar →</button>
          </div>
          <div class="pw-dir-card-bottom">
            <span class="pw-dir-card-zona pw-dir-card-zona--ok">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              Sede seleccionada
            </span>
          </div>`;
        _card.hidden = false;
        _card.querySelector('#btn-cambiar-dir').addEventListener('click', () => {
          _card.hidden = true;
          document.querySelector('.pw-direccion-wrapper').hidden = false;
          document.getElementById('sedes-title').textContent = 'Elige una sede';
        });
      }
    }

    // ── BANNER ──────────────────────────────────────────────────
    const BANNERS = [
      {
        src: '../Imagenes/banners/banner1-desk.jpg',
        srcMobile: '../Imagenes/banners/BannerPaginaWeb.jpeg',
        alt: 'Drive Pizza',
      },
      {
        src: '../Imagenes/banners/banner2-desk.jpg',
        srcMobile: '../Imagenes/banners/BannerPaginaWeb2.jpeg',
        alt: 'Drive Pizza',
        objectPosition: 'center bottom',
      },
      {
        src: '../Imagenes/banners/BannerBerrionda.png',
        srcMobile: '../Imagenes/banners/BannerBerrionda.png',
        alt: 'Promo Berrionda',
      },
    ];

    function initBanner() {
      if (!BANNERS.length) return;
      const wrapper = document.getElementById('pw-banner');
      const track   = document.getElementById('pw-banner-track');
      const dotsEl  = document.getElementById('pw-banner-dots');

      track.innerHTML = BANNERS.map(b => `
        <div class="pw-banner-slide">
          ${b.href ? `<a href="${b.href}">` : ''}
          <picture>
            ${b.srcMobile ? `<source media="(max-width:599px)" srcset="${b.srcMobile}">` : ''}
            <img src="${b.src}" alt="${b.alt ?? ''}" ${b.objectPosition ? `style="object-position:${b.objectPosition}"` : ''}>
          </picture>
          <div class="pw-banner-overlay"></div>
          ${(b.tagline || b.titulo || b.subtitulo) ? `
          <div class="pw-banner-content">
            ${b.tagline ? `<span class="pw-banner-tagline">${b.tagline}</span>` : ''}
            ${b.titulo  ? `<h2 class="pw-banner-titulo${b.tituloLg ? ' pw-banner-titulo--lg' : ''}">${b.titulo}</h2>` : ''}
            ${b.subtitulo ? `<p class="pw-banner-subtitulo">${b.subtitulo}</p>` : ''}
          </div>` : ''}
          ${b.href ? `</a>` : ''}
        </div>`).join('');

      dotsEl.innerHTML = BANNERS.map((_, i) =>
        `<button class="pw-banner-dot${i === 0 ? ' active' : ''}" data-i="${i}" aria-label="Ir a banner ${i + 1}"></button>`
      ).join('');

      wrapper.style.display = '';

      let current = 0, timer = null;
      const dots = dotsEl.querySelectorAll('.pw-banner-dot');

      function goTo(idx) {
        current = (idx + BANNERS.length) % BANNERS.length;
        track.style.transform = `translateX(-${current * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === current));
      }
      function startAuto() { timer = setInterval(() => goTo(current + 1), 4500); }
      function resetAuto() { clearInterval(timer); startAuto(); }

      dots.forEach(d => d.addEventListener('click', () => { goTo(Number(d.dataset.i)); resetAuto(); }));

      let touchX = 0;
      track.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
      track.addEventListener('touchend', e => {
        const delta = e.changedTouches[0].clientX - touchX;
        if (Math.abs(delta) > 40) { goTo(current + (delta < 0 ? 1 : -1)); resetAuto(); }
      }, { passive: true });

      if (BANNERS.length > 1) startAuto();
    }

    initBanner();

    // ── ÍNDICE DE BARRIOS (se llena async desde Supabase en init()) ──
    let barrioIndex  = {};
    let barrioCoords = {}; // { barrio: { lat, lng } } — para Haversine sin GPS

    // ── ESTADO GLOBAL ───────────────────────────────────────────
    const SEDE_IMGS = {
      'acropolis':   '../Imagenes/sedes/acropolis.png',
      'cabecera':    '../Imagenes/sedes/cabecera.png',
      'cañaveral':   '../Imagenes/sedes/canaveral.png',
      'canaveral':   '../Imagenes/sedes/canaveral.png',
      'megamall':    '../Imagenes/sedes/megamall.png',
      'piedecuesta': '../Imagenes/sedes/piedecuesta.png',
      'unico':       '../Imagenes/sedes/unico.jpeg',
      'único':       '../Imagenes/sedes/unico.jpeg',
    };

    let sedesData          = [];
    let userLat            = null;
    let userLng            = null;
    let barrioSeleccionado = '';

    // ── HAVERSINE ───────────────────────────────────────────────
    function haversine(lat1, lon1, lat2, lon2) {
      const R    = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a    = Math.sin(dLat / 2) ** 2 +
                   Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                   Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.asin(Math.sqrt(a));
    }

    // ── RENDER SEDES ────────────────────────────────────────────
    function renderSedes() {
      const grid           = document.getElementById('sedes-grid');
      const refLat         = userLat ?? barrioCoords[barrioSeleccionado]?.lat ?? null;
      const refLng         = userLng ?? barrioCoords[barrioSeleccionado]?.lng ?? null;
      const tieneUbicacion = refLat !== null && refLng !== null;

      const sedes = sedesData.map(sede => {
        const dist = (tieneUbicacion && sede.lat && sede.lng)
          ? haversine(refLat, refLng, sede.lat, sede.lng)
          : null;
        const fueraZona = (userLat !== null)
          ? (dist !== null && sede.radio_km ? dist > sede.radio_km : false)
          : (barrioSeleccionado && barrioIndex[barrioSeleccionado])
            ? !barrioIndex[barrioSeleccionado].has(sede.name || '')
            : false;
        return { ...sede, _dist: dist, _fueraZona: fueraZona };
      });

      sedes.sort((a, b) => {
        const aDisp = estaAbierta(a) && !a._fueraZona;
        const bDisp = estaAbierta(b) && !b._fueraZona;
        if (aDisp !== bDisp) return Number(bDisp) - Number(aDisp);
        if (a._dist !== null && b._dist !== null) return a._dist - b._dist;
        return 0;
      });

      // Badge solo cuando el usuario proporcionó su ubicación
      const iCercana = tieneUbicacion
        ? sedes.findIndex(s => s._dist !== null && !s._fueraZona)
        : -1;

      grid.innerHTML = sedes.map((sede, idx) => {
        const abierta      = estaAbierta(sede);
        const fueraZona    = sede._fueraZona;
        const disponible   = abierta && !fueraZona;
        const nombre       = displayNombre(sede);
        const sedeImg      = SEDE_IMGS[(sede.name || '').toLowerCase().trim()] || '../Imagenes/sede-placeholder.jpeg';
        const esMasCercana = idx === iCercana;
        const distLabel    = sede._dist !== null
          ? (sede._dist < 1
              ? `Distancia ${Math.round(sede._dist * 1000)} m`
              : `Distancia ${sede._dist.toFixed(1)} km`)
          : '';

        return `
          <div class="pw-sede-card-h${disponible ? '' : ' pw-sede-card-h--cerrada'}"
               data-sede='${JSON.stringify(sede).replace(/'/g, '&#39;')}'
               ${disponible ? `tabindex="0" role="button" aria-label="Pedir en ${nombre}"` : 'aria-disabled="true"'}>
            <div class="pw-sede-card-h-img">
              <img src="${sedeImg}" alt="${nombre}">
            </div>
            <div class="pw-sede-card-h-info">
              <span class="pw-sede-status pw-sede-status--${fueraZona ? 'fuera' : (abierta ? 'abierta' : 'cerrada')}">
                ${fueraZona ? 'Fuera de zona' : (abierta ? 'Abierto' : 'Cerrado')}
              </span>
              <div class="pw-sede-nombre">${nombre}</div>
              ${distLabel ? `<div class="pw-sede-dist">${distLabel}</div>` : ''}
              ${sede.direccion ? `<div class="pw-sede-dir">${sede.direccion}</div>` : ''}
            </div>
            ${esMasCercana ? `<span class="pw-sede-badge-cercana">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
              Más cercana</span>` : ''}
            <button class="pw-sede-btn pw-sede-btn--${disponible ? 'abierta' : 'cerrada'}${!disponible && !fueraZona ? ' pw-sede-btn--horarios' : ''}">
              ${disponible ? 'Ver menú →' : (fueraZona ? 'Fuera de zona' : 'Ver horarios →')}
            </button>
          </div>`;
      }).join('');

      grid.querySelectorAll('.pw-sede-btn--horarios').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const sede = JSON.parse(btn.closest('[data-sede]').dataset.sede);
          abrirModalHorarios(sede);
        });
      });

      grid.querySelectorAll('.pw-sede-card-h:not(.pw-sede-card-h--cerrada)').forEach(card => {
        const abrir = () => {
          const sede = JSON.parse(card.dataset.sede);
          const actual = getSedeActual();
          if (!actual || actual.id !== sede.id) vaciarCarrito();
          setSedeActual(sede);
          const t = document.createElement('div');
          t.className = 'pw-page-transition pw-page-transition--cover';
          document.body.appendChild(t);
          setTimeout(() => { window.location.href = 'menu.html'; }, 220);
        };
        card.addEventListener('click', abrir);
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(); }
        });
      });
    }

    // ── MODAL HORARIOS ──────────────────────────────────────────
    const horariosOverlay = document.getElementById('pw-horarios-overlay');

    function abrirModalHorarios(sede) {
      document.getElementById('pw-horarios-titulo').textContent = displayNombre(sede);
      const lista = document.getElementById('pw-horarios-lista');

      // ── Horarios ──
      const horarios = sede.horarios_display;
      let horariosHtml = '';
      if (Array.isArray(horarios) && horarios.length) {
        horariosHtml = horarios.map(h => `
          <div class="pw-horarios-fila">
            <span class="pw-horarios-dia">${h.dia}</span>
            <span class="pw-horarios-hora">${h.horario}</span>
          </div>`).join('');
      } else {
        horariosHtml = `<p class="pw-horarios-empty">Horarios no disponibles por el momento.</p>`;
      }

      // ── Contacto ──
      const lineas = Array.isArray(sede.lineas_domicilio) ? sede.lineas_domicilio : [];
      const wa     = sede.whatsapp;

      const contactoHtml = (wa || lineas.length) ? `
        <div class="pw-horarios-contacto">
          <p class="pw-horarios-contacto-label">¿Necesitas ayuda? Contáctanos</p>
          <div class="pw-horarios-contacto-btns">
            ${wa ? `
            <a href="https://wa.me/${wa}" target="_blank" rel="noopener" class="pw-horarios-btn pw-horarios-btn--wa">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
              WhatsApp
            </a>` : ''}
            ${lineas.map(n => `
            <a href="tel:${n}" class="pw-horarios-btn pw-horarios-btn--tel">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.68A2 2 0 012 .82h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 8.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>
              ${n}
            </a>`).join('')}
          </div>
        </div>` : '';

      lista.innerHTML = horariosHtml + contactoHtml;
      horariosOverlay.classList.add('open');
    }

    horariosOverlay.addEventListener('click', e => {
      if (e.target === horariosOverlay || e.target.closest('#pw-horarios-close')) {
        horariosOverlay.classList.remove('open');
      }
    });

    // ── CARGA INICIAL ───────────────────────────────────────────
    async function init() {
      const grid  = document.getElementById('sedes-grid');
      const error = document.getElementById('error-sedes');
      try {
        // Cargar barrios y sedes en paralelo
        const [domicilios] = await Promise.all([
          cargarTodosBarrios(),
          cargarSedes().then(s => { sedesData = s; }),
        ]);

        // Construir índice barrio → sedes
        Object.entries(domicilios).forEach(([sedeName, barrios]) => {
          Object.keys(barrios).forEach(barrio => {
            if (!barrioIndex[barrio]) barrioIndex[barrio] = new Set();
            barrioIndex[barrio].add(sedeName);
          });
        });
        todosLosBarrios = Object.keys(barrioIndex).sort((a, b) => a.localeCompare(b, 'es'));
        barrioCoords    = getBarrioCoordsMap();

        if (!sedesData.length) {
          grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#999;">No hay sedes disponibles en este momento.</p>';
          return;
        }
        renderSedes();
      } catch (err) {
        console.error(err);
        grid.innerHTML = '';
        error.textContent = 'No pudimos cargar las sedes. Por favor recarga la página.';
        error.style.display = 'block';
      }
    }

    init();

    // ── AUTOCOMPLETE DE BARRIO (búsqueda local en domicilios.js) ─
    const dirField        = document.getElementById('dir-inicio');
    const dirSug          = document.getElementById('dir-suggestions');
    const dirWrapper      = document.querySelector('.pw-direccion-wrapper');
    const dirSelectedCard = document.getElementById('dir-selected-card');

    // Lista ordenada de todos los barrios únicos (se llena en init())
    let todosLosBarrios = [];

    function confirmarDireccion(barrio) {
      if (!barrio) return;
      barrioSeleccionado = barrio;

      // Sede disponible que cubre este barrio (o la más cercana si hay GPS o coords de barrio)
      const barCoords = barrioCoords[barrio];
      const refLat    = userLat ?? barCoords?.lat ?? null;
      const refLng    = userLng ?? barCoords?.lng ?? null;
      const sedesCalc = sedesData.map(s => {
        const dist      = (refLat && s.lat && s.lng) ? haversine(refLat, refLng, s.lat, s.lng) : null;
        const fueraZona = (userLat !== null)
          ? (dist !== null && s.radio_km ? dist > s.radio_km : false)
          : barrioIndex[barrio]
            ? !barrioIndex[barrio].has(s.name || '')
            : (dist !== null && s.radio_km ? dist > s.radio_km : false);
        return { ...s, _dist: dist, _fueraZona: fueraZona };
      });
      sedesCalc.sort((a, b) => {
        const aD = estaAbierta(a) && !a._fueraZona;
        const bD = estaAbierta(b) && !b._fueraZona;
        if (aD !== bD) return Number(bD) - Number(aD);
        if (a._dist !== null && b._dist !== null) return a._dist - b._dist;
        return 0;
      });
      const sedeEntrega = sedesCalc.find(s => estaAbierta(s) && !s._fueraZona) || null;
      const enZona      = !!sedeEntrega;
      const nombreSede  = sedeEntrega ? displayNombre(sedeEntrega) : '—';

      dirSelectedCard.innerHTML = `
        <div class="pw-dir-card-top">
          <div class="pw-dir-card-col">
            <span class="pw-dir-card-label">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
              Entrega en
            </span>
            <strong class="pw-dir-card-sede">${nombreSede}</strong>
            <span class="pw-dir-card-addr">${barrio}</span>
          </div>
          <div class="pw-dir-card-col pw-dir-card-col--right">
            <span class="pw-dir-card-label">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v5"/><circle cx="15.5" cy="17.5" r="2.5"/><circle cx="5.5" cy="17.5" r="2.5"/><path d="M3 11h13"/></svg>
              Tiempo estimado
            </span>
            <strong class="pw-dir-card-tiempo">45 - 60 min</strong>
          </div>
          <button class="pw-dir-card-cambiar" id="btn-cambiar-dir">Cambiar →</button>
        </div>
        <div class="pw-dir-card-bottom">
          <span class="pw-dir-card-zona pw-dir-card-zona--${enZona ? 'ok' : 'fuera'}">
            ${enZona
              ? `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Entregamos en tu zona`
              : `⚠ Fuera de zona de entrega`}
          </span>
        </div>`;

      localStorage.setItem('dp_direccion', JSON.stringify({
        barrio,
        direccion: '',
        lat:       refLat,
        lng:       refLng,
        sedeId:    sedeEntrega?.id ?? null,
        sedeNombre: nombreSede,
      }));

      renderSedes();
      dirWrapper.hidden = true;
      dirSelectedCard.hidden = false;
      document.getElementById('sedes-title').textContent = 'Sedes cercanas';

      document.getElementById('btn-cambiar-dir').addEventListener('click', () => {
        barrioSeleccionado = '';
        dirSelectedCard.hidden = true;
        dirWrapper.hidden = false;
        dirField.value = '';
        userLat = null;
        userLng = null;
        renderSedes();
        document.getElementById('sedes-title').textContent = 'Elige una sede';
      });
    }

    function fetchSug(q) {
      const ql      = q.toLowerCase();
      const matches = todosLosBarrios
        .filter(b => b.toLowerCase().includes(ql))
        .sort((a, b) => {
          // primero los que empiezan con el texto
          const aS = a.toLowerCase().startsWith(ql);
          const bS = b.toLowerCase().startsWith(ql);
          if (aS !== bS) return aS ? -1 : 1;
          return a.localeCompare(b, 'es');
        })
        .slice(0, 8);

      if (!matches.length) { hideSug(); return; }

      dirSug.innerHTML = matches.map(b =>
        `<button class="pw-dir-sug-item" data-barrio="${b}">${b}</button>`
      ).join('');
      dirSug.hidden = false;

      dirSug.querySelectorAll('.pw-dir-sug-item').forEach(btn => {
        btn.addEventListener('click', () => {
          dirField.value = btn.dataset.barrio;
          hideSug();
          confirmarDireccion(btn.dataset.barrio);
        });
      });
    }

    dirField.addEventListener('input', () => {
      const q = dirField.value.trim();
      if (q.length < 2) { hideSug(); return; }
      fetchSug(q);
    });

    function hideSug() { dirSug.innerHTML = ''; dirSug.hidden = true; }

    document.addEventListener('click', e => {
      if (!e.target.closest('.pw-direccion-wrapper')) hideSug();
    });

    // ── GPS ─────────────────────────────────────────────────────
    const gpsBtn = document.querySelector('.pw-direccion-gps');

    gpsBtn.addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert('Tu navegador no soporta geolocalización.');
        return;
      }
      gpsBtn.classList.add('pw-direccion-gps--loading');
      navigator.geolocation.getCurrentPosition(
        async ({ coords }) => {
          try {
            userLat = coords.latitude;
            userLng = coords.longitude;
            const url  = `https://nominatim.openstreetmap.org/reverse?lat=${coords.latitude}&lon=${coords.longitude}&format=json&addressdetails=1`;
            const res  = await fetch(url, { headers: { 'Accept-Language': 'es' } });
            const data = await res.json();

            // Intentar encontrar el barrio en nuestro índice local
            const suburb     = data.address?.suburb || data.address?.neighbourhood || data.address?.quarter || '';
            const barrioGPS  = todosLosBarrios.find(b => b.toLowerCase() === suburb.toLowerCase())
                            || todosLosBarrios.find(b => suburb.toLowerCase().includes(b.toLowerCase()));

            if (barrioGPS) {
              dirField.value = barrioGPS;
              confirmarDireccion(barrioGPS);
            } else {
              // No hay match exacto: mostrar dirección y dejar que el usuario elija
              dirField.value = suburb || data.display_name.split(',').slice(0, 2).join(',').trim();
              renderSedes();
            }
          } catch {
            alert('No pudimos obtener tu dirección. Intenta escribiéndola.');
          } finally {
            gpsBtn.classList.remove('pw-direccion-gps--loading');
          }
        },
        () => {
          alert('No se pudo acceder a tu ubicación. Verifica los permisos.');
          gpsBtn.classList.remove('pw-direccion-gps--loading');
        },
        { timeout: 10000 }
      );
    });

    // Botón "Menú" en bottom nav → ir al menú si hay sede seleccionada
    document.getElementById('bottom-nav-menu')?.addEventListener('click', () => {
      if (!getSedeActual()) return;
      const t2 = document.createElement('div');
      t2.className = 'pw-page-transition pw-page-transition--cover';
      document.body.appendChild(t2);
      setTimeout(() => { window.location.href = 'menu.html'; }, 220);
    });

    // Revelar si viene del menú (animación de derecha)
    const t = document.getElementById('pw-page-transition');
    if (fromMenu) {
      requestAnimationFrame(() => {
        t.classList.add('pw-page-transition--reveal-right');
        t.addEventListener('animationend', () => t.remove(), { once: true });
      });
    } else {
      t?.remove();
    }
  </script>

</body>
</html>
