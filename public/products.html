<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos Sedes</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="./Imagenes/Isotipo.png" type="image/x-icon">
</head>
<body class="orders_body">
<header class="orders_header">
    <img class="logo_orders" src="./Imagenes/logo.png" alt="logo drive">
</header>
<main class="orders_main">

<div class="orders_title">
    <img class="orders_title__image" src="./Imagenes/Isotipo.png" alt="Isotipo Drive">
    <h1 class="title_order">PRODUCTOS</h1>    
</div>  
    
    
    <p class="parragraph">Selecciona los productos que se requieren para
    las labores del día a día</p>
    <form class="form_products" id="form">
        <ul class="list_products" id="products-list">
            <li class="list_location">
                <label>SEDE</label>
                
             <!-- en JS se crea lista de Sedes disponible en BD -->
                <select name="user" id="location" required>
                    <option value="" disabled selected>Seleccionar</option>                  
                </select>

            </li>
            <li class="day_delivery">
                <label for="day_delivery">FECHA</label>
                <input type="date" name="deliveryDate" id="day_delivery" required>
            </li>          
            
        </ul>   
        <ul class="observation_products" id="products-observation">
            <li class="observation">  
                <label>OBSERVACIONES</label>  
                <textarea class="observation_box" name="orderNotes"></textarea>
            </li> 
        </ul> 
    <button class="btn_orders" type="submit" id="btn_orders">Enviar Pedido</button>
    </form>
</main>


<script type="module" src="./products.js"></script>
<footer></footer>



    
</body>
</html>
