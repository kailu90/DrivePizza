<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gastrofusión 2026 — Drive Pizza</title>
    <link rel="shortcut icon" href="../Imagenes/Isotipo.png" type="image/x-icon">
    <link rel="stylesheet" href="../Estilos/styles.css">
    <link rel="stylesheet" href="../Estilos/skeleton.css">
    <link rel="stylesheet" href="../CallCenter/pedidosCallCenter.css">
</head>
<body>

<div id="skeleton" class="sk-page"></div>

<div id="contenido-principal" style="display:none;">

    <header class="main-header no-print">
        <div class="header-left">
            <img src="../Imagenes/logo.png" alt="Drive Pizza">
        </div>
        <div class="header-name">
            <div class="header-username" id="username">Hola</div>
        </div>
        <div class="header-controls">
            <a href="../CallCenter/historialPedidos.html" class="btn-historial with-tooltip" data-tooltip="Historial Pedidos" style="text-decoration:none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
            </a>
            <button id="btn-logout" class="header-link">
                <span class="logout-text">Cerrar Sesión</span>
                <svg class="logout-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>
    </header>

    <div id="layout-center">
        <div class="layout-main">

            <div id="search-wrapper"></div>

            <div class="categories-col">
                <nav class="categories" id="categoryNav"></nav>
            </div>

            <div class="app-container">
                <section class="menu-panel no-print">
                    <div class="content-area">
                        <div id="productGrid" class="product-grid"></div>
                    </div>
                </section>
            </div>

            <aside class="order-panel">
                <div class="order-header">
                    <span class="order-title">Pedido</span>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <button id="btn-vaciar" class="btn-vaciar" onclick="vaciarCarrito()" style="display:none;">🗑 Vaciar</button>
                        <button class="btn-cerrar-cart" onclick="cerrarCartPanel()">✕</button>
                    </div>
                </div>
                <div id="orderItems" class="order-items">
                    <p class="empty-msg">No hay productos seleccionados</p>
                </div>
                <div class="order-footer">
                    <div class="total-row">
                        <span>TOTAL:</span>
                        <span id="totalDisplay">$0</span>
                    </div>
                    <button class="btn-print" onclick="abrirCheckout()">CONFIRMAR PEDIDO</button>
                </div>
            </aside>

        </div><!-- /layout-main -->
    </div><!-- /layout-center -->

    <div id="cart-overlay" class="cart-overlay"></div>

</div><!-- /contenido-principal -->

<!-- Cart bar mobile -->
<div id="cart-bar" class="cart-bar">
    <div class="cart-bar__left">
        <span class="cart-bar__count" id="cart-bar-count">0 productos</span>
        <span class="cart-bar__total" id="cart-bar-total">$0</span>
    </div>
    <button class="cart-bar__btn" id="cart-bar-btn">Ver pedido ›</button>
</div>

<!-- Modal checkout Gastrofusión -->
<div id="modal-checkout" class="modal-overlay" style="display:none;">
    <div class="modal-content checkout-container" style="max-width:440px;">
        <h3>DATOS DEL PEDIDO</h3>
        <div class="form-grid">
            <input type="text" id="mesaInput" placeholder="Mesa / Identificador (opcional)" class="full-width">

            <div class="pago-toggle full-width" id="pago-section">
                <button type="button" class="pago-btn" data-pago="Efectivo">💵 Efectivo</button>
                <button type="button" class="pago-btn" data-pago="Transferencia">📲 Transferencia</button>
                <button type="button" class="pago-btn" data-pago="Datafono">💳 Datáfono</button>
            </div>

            <div class="full-width" id="acomp-section">
                <p class="acomp-titulo">Acompañamientos sin costo</p>
                <div id="acomp-pills" class="acomp-pills">
                    <button type="button" class="acomp-pill" data-topping="Salsa Tártara">Salsa Tártara</button>
                    <button type="button" class="acomp-pill" data-topping="Orégano">Orégano</button>
                    <button type="button" class="acomp-pill" data-topping="Sal de Ajo">Sal de Ajo</button>
                </div>
            </div>
            <textarea id="observaciones" placeholder="Observaciones..." class="full-width"></textarea>
        </div>

        <div style="margin-top:14px; padding:10px 12px; background:#f9f9f9; border-radius:8px; border:1px solid #eee;">
            <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.6rem;">
                <span>TOTAL:</span>
                <span id="checkout-total-final" style="color:#e67e22;">$0</span>
            </div>
        </div>

        <div style="display:flex;gap:10px;margin-top:15px;justify-content:center;">
            <button id="btn-enviar-pedido" class="btn-print btn-finalizar-pedido">ENVIAR PEDIDO</button>
        </div>
    </div>
</div>

<!-- Modal selección de variante (igual que CallCenter) -->
<div id="modal-seleccion" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h3 id="modal-titulo">Seleccionar opción</h3>
        <div id="opciones-tamano" class="opciones-grid"></div>
    </div>
</div>

<script src="gastrofusion-app.js"></script>
<script type="module" src="gastrofusion.js"></script>

</body>
</html>
