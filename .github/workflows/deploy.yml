name: Deploy frontend → app.everest-central.com

on:
  push:
    branches: [main, feature/pruebas]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 65.109.225.149 >> ~/.ssh/known_hosts

      - name: Deploy public/ a Hetzner
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" public/ root@65.109.225.149:/var/www/frontend/

      - name: Fijar permisos y verificar deploy
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@65.109.225.149 "chown -R caddy:caddy /var/www/frontend && echo 'Archivos: $(ls /var/www/frontend/ | wc -l)'"
