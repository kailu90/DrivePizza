name: Deploy frontend → app.everest-central.com

on:
  push:
    branches: [main, feature/pruebas]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 65.109.225.149 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@65.109.225.149 "echo 'SSH OK'"

      - name: Deploy public/ a Hetzner
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" public/ root@65.109.225.149:/root/frontend/

      - name: Verificar deploy
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@65.109.225.149 "ls /root/frontend/ | wc -l && echo 'archivos desplegados'"
