                    width: 28, height: 28, borderRadius: "50%",
                    background: openFaq === i ? T.accent : T.pill,
                    display: "flex", alignItems: "center", justifyContent: "center",
                    color: openFaq === i ? T.accentText : T.textMuted,
                    fontSize: 18, flexShrink: 0, transition: "background .2s",
                    fontWeight: 300,
                  }}>{openFaq === i ? "−" : "+"}</div>
                </div>
                {openFaq === i && (
                  <div style={{ marginTop: 14, fontSize: 14, color: T.textMuted, lineHeight: 1.75, fontFamily: T.fontBody || T.font }}>{f.a}</div>
                )}
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* ── CTA FINAL ── */}
      <section data-screen-label="CTA Final" style={{
        padding: "100px clamp(20px,5vw,80px)",
        textAlign: "center",
        background: T.bg,
      }}>
        <div style={{
          maxWidth: 600, margin: "0 auto",
          padding: "64px 48px",
          background: T.bgCard,
          border: `1px solid ${T.border}`,
          borderRadius: 24,
        }}>
          <Logo accent={T.accent} text={T.text} size={40} />
          <h2 style={{ fontSize: "clamp(24px,3vw,38px)", fontWeight: 800, letterSpacing: "-0.5px", marginTop: 32, marginBottom: 16 }}>
            ¿Listo para escalar tu operación?
          </h2>
          <p style={{ color: T.textMuted, fontSize: 16, marginBottom: 36, lineHeight: 1.7, fontFamily: T.fontBody || T.font }}>
            Hablemos. Sin costo, sin compromiso. Te mostramos cómo Everest Central puede transformar tu negocio.
          </p>
          <a href={wa} target="_blank" style={{
            display: "inline-flex", alignItems: "center", gap: 10,
            background: T.accent, color: T.accentText,
            padding: "16px 40px", borderRadius: 50,
            fontSize: 15, fontWeight: 700,
            transition: "transform .2s",
          }}
          onMouseEnter={e => e.currentTarget.style.transform = "scale(1.04)"}
          onMouseLeave={e => e.currentTarget.style.transform = "scale(1)"}
          >
            Escribinos por WhatsApp →
          </a>
        </div>
      </section>

      {/* ── FOOTER ── */}
      <footer style={{
        padding: "32px clamp(20px,5vw,80px)",
        borderTop: `1px solid ${T.border}`,
        display: "flex", justifyContent: "space-between", alignItems: "center",
        flexWrap: "wrap", gap: 12,
      }}>
        <Logo accent={T.accent} text={T.text} size={28} />
        <div style={{ fontSize: 13, color: T.textMuted }}>© 2026 Everest Central · Soluciones tecnológicas</div>
      </footer>

      {/* ── TWEAKS ── */}
      <TweaksPanel>
        <TweakSection title="Tema visual">
          <TweakRadio id="theme" label="Variante" options={[
            { value: "cumbre",  label: "Cumbre" },
            { value: "valle",   label: "Valle" },
            { value: "vertice", label: "Vértice" },
          ]} />
        </TweakSection>
        <TweakSection title="Contacto">
          <TweakText id="whatsapp" label="WhatsApp (número)" />
          <TweakText id="cta_text" label="Texto del botón CTA" />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
