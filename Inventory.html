 <div id="header-container"></div>

<!--*********************Tabla de listado de los productos*****************-->
<main class="dashboard__main" id="dashboard__main">
    <button class="toggle-btn" id="toggle-btn"><</button>
    <section class="dashboard__section dashboard__overview">
        <h2 class="dashboard__overview-title">Resumen de productos</h2>
        <div class="dashboard__overview-cards ">
            <div class="card">
                <h3 class="card__title">Valor total productos</h3>
                <p class="card__info" id="total-value-counter">0</p>
            </div>
            <div class="card">
                <h3 class="card__title">Productos en Stock</h3>
                <p class="card__info" id="total-products-counter">0</p>
            </div>
            <div class="card">
                <h3 class="card__title">Productos agotados</h3>
                <p class="card__info" id="out-of-stock-counter">0</p>
            </div>
        </div>
    </section>




<!--*********************Botones de gestion de inventario*****************-->    
    <section class="inventory__section inventory-management">        
         <div class="inventory-management__title">
            <button id="btn-create-product" class="button btn-primary">Crear producto</button>
            <button id="btn-add-stock" class="button btn-primary">Agregar Stock</button>            
        </div>



<!--*********************Estructura base de tabla de productos Inventario*****************-->  
        <table class="inventory-management__table">
            <thead class="inventory-management__thead">

                <th>Stock</th>                
                <th>Precio Unidad</th>
                 <th>Precio total</th>
                <th>Acciones</th>
              </tr>
            </thead>

<!--*********************Modal de formulario para ingreso de Stock*****************-->  
  <div id="modal-stock" class="modal-overlay">
    <div class="modal-content inventory-management__stock">
        <span class="close-modal" id="btn-close-x">x</span>        
        <form class="form-body" id="form-stock">
            <div class="header-stock">
                <h2 class="title">INGRESO DE STOCK</h2>
            </div>

            <div class="form-group">
                <label class="label" for="product-select">Producto:</label>
                <select id="product-select" class="form-control btn-primary" required>
                    <option value="" disabled selected>Selecciona un producto</option>
                </select>
            </div>         

            <div class="form-group">
                <label class="label" for="stock-quantity">Cantidad:</label>
                <input type="number" id="stock-quantity" class="form-control btn-primary" placeholder="registra la cantidad a ingresar" required min="1">
            </div>

            <div class="form-group">
                <label class="label" for="supplier-select">Proveedor:</label>
                <select id="supplier-select" class="form-control btn-primary" required>
                    <option value="" disabled selected>Selecciona el proveedor</option>
                </select>
            </div>

            <div class="form-group observation">
                <label class="label" for="stock-observation">Observación:</label>
                <textarea id="stock-observation" class="form-control btn-primary" rows="4" placeholder="Escribe los detalles del ingreso..."></textarea>
            </div>

            <div class="inventory-management__stock-btn ">
                <button type="submit" class="btn-primary" id="btn-enviar">Enviar</button>
                <button type="button" class="btn-primary btn-cancel" id="btn-cancel">Cancelar</button>
            </div>
        </form>
    </div>
</div>


<!--*********************Modal para creación producto*****************-->  

 <div id="modal-create-product" class="modal-overlay">
    <div class="modal-content inventory-management__stock">
        <span class="close-modal" id="btn-close-x-create">&times;</span>
        
        <form class="form-body" id="form-create-product">
            <div class="header-stock">
                <h2 class="title">CREAR PRODUCTO NUEVO</h2>
            </div>

            <div class="form-group">
                <label class="label" for="new-product-name">Nombre del producto:</label>
                <input type="text" id="new-product-name" class="form-control btn-primary" placeholder="Ej: Queso Mozzarella" required>
            </div>

             <div class="form-group">
                <label class="label" for="supplier-select">Proveedor:</label>
                <input type="text" id="new-product-supplier" list="suppliers-list" class="form-control btn-primary" placeholder="Escribe para buscar proveedor..." required>
                <datalist id="suppliers-list"></datalist>
            </div>

            <div class="form-group">
                <label class="label" for="new-product-unit">Unidad de medida:</label>
                <select id="new-product-unit" class="form-control btn-primary" required>
                    <option value="" disabled selected>Selecciona una unidad</option>
                    <option value="libra">Libra</option>
                    <option value="unidad">Unidad</option>
                    <option value="frasco">Frasco</option>
                    <option value="kilo">Kilo</option>
                </select>
            </div>

            <div class="form-group">
                <label class="label" for="new-product-category">Categoria:</label>
                <input type="text" id="new-product-supplier" list="category-list" class="form-control btn-primary" placeholder="Escribe para buscar categoria..." required>
                <datalist id="category-list"></datalist>
            </div>

            <div class="form-group">
                <label class="label" for="new-product-price">Precio del producto:</label>
                <input type="number" id="new-product-price" class="form-control btn-primary" placeholder="Valor unitario" required min="0">
            </div>

            <div class="inventory-management__stock-btn">
                <button type="submit" class="btn-primary" id="btn-save-product">Crear Producto</button>
                <button type="button" class="btn-primary btn-cancel" id="btn-cancel-create">Cancelar</button>
            </div>
        </form>
    </div>
</div>
   
    </section>
</main>
